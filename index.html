<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #171a21;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #292d36;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai {
      background: #252a34;
      align-self: flex-start;
    }

    .user {
      background: #3b82f6;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #292d36;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #252a34;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      🤖 Zatoi AI
    </header>

    <div id="chat">

      <div class="message ai">
        Merhaba! Ben Zatoi AI. 👋
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Zatoi'ye bir şey sor..."
        autocomplete="off"
      >

      <button id="sendButton">
        Gönder
      </button>

    </div>

  </div>

  <script>

    const WORKER_URL =
      "https://zatoi-ai.fbboytr.workers.dev/";

    const chat =
      document.getElementById("chat");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;
    }


    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if (!message) return;

      addMessage(message, "user");

      messageInput.value = "";

      sendButton.disabled = true;

      const aiMessage =
        addMessage("Zatoi düşünüyor...", "ai");


      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        console.log("Zatoi cevabı:", data);


        if (
          data &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content
        ) {

          aiMessage.textContent =
            data.choices[0].message.content;

        }

        else if (data && data.error) {

          aiMessage.textContent =
            "Zatoi AI hatası: " +
            data.error;

        }

        else {

          aiMessage.textContent =
            "Zatoi'den geçerli bir cevap alınamadı.";

        }


      } catch (error) {

        console.error(error);

        aiMessage.textContent =
          "Zatoi'ye bağlanırken hata oluştu.";

      }


      sendButton.disabled = false;

      messageInput.focus();

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
