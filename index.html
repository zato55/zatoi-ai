<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #0f1117;
      color: #ffffff;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
    }

    /* Üst başlık */

    header {
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #292d38;

      font-size: 22px;
      font-weight: bold;

      background: #11141b;
    }

    /* Sohbet alanı */

    #chat {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Mesajlar */

    .message {
      max-width: 80%;

      padding: 12px 15px;

      border-radius: 15px;

      line-height: 1.5;

      white-space: pre-wrap;

      word-wrap: break-word;
    }

    /* Kullanıcı */

    .user {
      align-self: flex-end;

      background: #2563eb;

      border-bottom-right-radius: 4px;
    }

    /* Zatoi */

    .ai {
      align-self: flex-start;

      background: #20242e;

      border-bottom-left-radius: 4px;
    }

    /* Alt bölüm */

    .input-area {
      display: flex;

      gap: 10px;

      padding: 12px;

      background: #11141b;

      border-top: 1px solid #292d38;
    }

    /* Mesaj kutusu */

    #messageInput {
      flex: 1;

      height: 50px;

      padding: 0 15px;

      border: none;

      outline: none;

      border-radius: 12px;

      background: #20242e;

      color: white;

      font-size: 16px;
    }

    #messageInput::placeholder {
      color: #8d93a1;
    }

    /* Gönder butonu */

    #sendButton {
      height: 50px;

      padding: 0 20px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    #sendButton:hover {
      opacity: 0.9;
    }

    #sendButton:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    /* Mobil */

    @media (max-width: 600px) {

      .message {
        max-width: 90%;
      }

      #sendButton {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Başlık -->

  <header>
    🤖 Zatoi AI
  </header>


  <!-- Sohbet -->

  <div id="chat">

    <div class="message ai">
      Merhaba! Ben Zatoi AI. 👋
    </div>

  </div>


  <!-- Mesaj gönderme -->

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Zatoi'ye bir şey sor..."
      autocomplete="off"
    >

    <button id="sendButton">
      Gönder
    </button>

  </div>


  <script>

    /*
      CLOUDFLARE WORKER ADRESİ
    */

    const WORKER_URL =
      "https://zatoi-ai.fbboytr.workers.dev/";


    /*
      HTML ELEMENTLERİ
    */

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");


    /*
      MESAJ GÖNDER
    */

    async function sendMessage() {

      const message =
        input.value.trim();


      // Boş mesaj gönderme

      if (!message) {
        return;
      }


      /*
        KULLANICI MESAJI
      */

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";

      userMessage.textContent =
        message;

      chat.appendChild(userMessage);


      /*
        INPUT TEMİZLE
      */

      input.value = "";


      /*
        BUTONU KİLİTLE
      */

      button.disabled = true;


      /*
        ZATOI BEKLİYOR
      */

      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message ai";

      aiMessage.textContent =
        "Zatoi düşünüyor... 🤔";

      chat.appendChild(aiMessage);


      /*
        SOHBETİ AŞAĞI KAYDIR
      */

      chat.scrollTop =
        chat.scrollHeight;


      try {

        /*
          CLOUDFLARE WORKER'A İSTEK
        */

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message: message
                })
            }
          );


        /*
          GELEN CEVABI OKU
        */

        const data =
          await response.json();


        /*
          HTTP HATASI
        */

        if (!response.ok) {

          aiMessage.textContent =
            "Sunucu hatası: " +
            (
              data.error ||
              "Bilinmeyen hata"
            );

          return;
        }


        /*
          NORMAL AI CEVABI
        */

        if (
  data.choices &&
  data.choices[0] &&
  data.choices[0].message
) {
  aiMessage.textContent =
    data.choices[0].message.content;
}
else if (data.error) {
  aiMessage.textContent =
    "Zatoi AI hatası: " + data.error;
}
else {
  aiMessage.textContent =
    "Beklenmeyen cevap: " +
    JSON.stringify(data);
}

        /*
          HATA MESAJI
        */

        else if (data.error) {

          aiMessage.textContent =
            "Zatoi AI hatası: " +
            data.error;

        }


        /*
          BEKLENMEYEN CEVAP
        */

        else {

          aiMessage.textContent =
            "Beklenmeyen cevap: " +
            JSON.stringify(data);

        }

      }


      /*
        BAĞLANTI HATASI
      */

      catch (error) {

        aiMessage.textContent =
          "Bağlantı hatası: " +
          error.message;

      }


      /*
        BUTONU AÇ
      */

      finally {

        button.disabled = false;

        input.focus();

        chat.scrollTop =
          chat.scrollHeight;

      }

    }


    /*
      GÖNDER BUTONU
    */

    button.addEventListener(
      "click",
      sendMessage
    );


    /*
      ENTER TUŞU
    */

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
