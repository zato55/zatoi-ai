<!DOCTYPE html>

<html lang="tr">
<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Zatoi AI</title>

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #0f0f0f;
      color: white;

      font-family: Arial, sans-serif;

    }


    body {
      overflow: hidden;
    }


    /* =========================
       ÜST BAŞLIK
    ========================= */

    header {

      height: 70px;

      display: flex;
      align-items: center;

      padding: 0 25px;

      background: #151515;

      border-bottom: 1px solid #292929;

      position: relative;

      z-index: 20;

    }


    header h1 {

      margin: 0;

      font-size: 23px;

    }


    header p {

      margin: 4px 0 0 12px;

      color: #888;

      font-size: 13px;

    }


    /* =========================
       ANA PC ALANI
    ========================= */

    #app {

      height: calc(100vh - 70px);

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        330px;

    }


    /* =========================
       SOL SOHBET
    ========================= */

    #chatArea {

      min-width: 0;

      position: relative;

      display: flex;

      flex-direction: column;

      background: #0f0f0f;

    }


    #chat {

      flex: 1;

      overflow-y: auto;

      padding: 25px;

      padding-bottom: 110px;

      width: 100%;

    }


    .message {

      margin-bottom: 16px;

      padding: 13px 16px;

      border-radius: 15px;

      max-width: 78%;

      white-space: pre-wrap;

      line-height: 1.5;

      word-wrap: break-word;

    }


    .user {

      background: #2563eb;

      margin-left: auto;

    }


    .assistant {

      background: #1e1e1e;

      border: 1px solid #303030;

      margin-right: auto;

    }


    .label {

      font-size: 11px;

      color: #aaa;

      margin-bottom: 5px;

    }


    /* =========================
       PC SAĞ PANEL
    ========================= */

    #sidePanel {

      border-left: 1px solid #292929;

      background: #141414;

      padding: 20px;

      overflow-y: auto;

    }


    #sideTitle {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    #sideDescription {

      color: #888;

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 18px;

    }


    /* =========================
       SAĞ PANEL BUTONLARI
    ========================= */

    #buttons {

      display: flex;

      flex-direction: column;

      gap: 9px;

      margin-bottom: 18px;

    }


    #buttons button {

      width: 100%;

      min-height: 45px;

      border: 1px solid #3b3b3b;

      border-radius: 11px;

      background: #292929;

      color: white;

      cursor: pointer;

      font-size: 14px;

      font-weight: bold;

    }


    #buttons button:hover {

      background: #333;

    }


    #buttons button:active {

      transform: scale(0.98);

    }


    /* =========================
       PC HAFIZA
    ========================= */

    #memoryBox {

      background: #101010;

      border: 1px solid #303030;

      border-radius: 13px;

      padding: 15px;

    }


    #memoryBoxTitle {

      font-size: 15px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    #memoryContent {

      white-space: pre-wrap;

      word-break: break-word;

      color: #aaa;

      font-size: 12px;

      line-height: 1.55;

      max-height: calc(100vh - 300px);

      overflow-y: auto;

    }


    /* =========================
       ALT MESAJ PANELİ
    ========================= */

    #bottom {

      position: absolute;

      left: 0;

      right: 0;

      bottom: 0;

      padding: 12px 20px;

      padding-bottom:
        calc(12px + env(safe-area-inset-bottom));

      background: rgba(17,17,17,0.98);

      border-top: 1px solid #292929;

      z-index: 15;

    }


    #inputArea {

      width: 100%;

      display: flex;

      gap: 8px;

    }


    #messageInput {

      flex: 1;

      min-width: 0;

      padding: 14px;

      border-radius: 12px;

      border: 1px solid #3a3a3a;

      background: #1b1b1b;

      color: white;

      outline: none;

      font-size: 15px;

    }


    #messageInput:focus {

      border-color: #2563eb;

    }


    #messageInput::placeholder {

      color: #777;

    }


    #sendButton {

      border: none;

      border-radius: 12px;

      padding: 12px 20px;

      background: #2563eb;

      color: white;

      cursor: pointer;

      font-size: 14px;

      font-weight: bold;

      flex-shrink: 0;

    }


    #sendButton:active {

      transform: scale(0.97);

    }


    /* =========================
       MOBİL
    ========================= */

    @media (max-width: 600px) {

      body {

        overflow: hidden;

      }


      header {

        height: 62px;

        padding: 0 15px;

        justify-content: center;

        flex-direction: column;

      }


      header h1 {

        font-size: 21px;

      }


      header p {

        margin: 3px 0 0;

        font-size: 12px;

      }


      #app {

        height: calc(100vh - 62px);

        display: block;

      }


      #chatArea {

        height: 100%;

      }


      #sidePanel {

        display: none;

      }


      #chat {

        padding: 12px;

        padding-bottom: 125px;

        overflow-y: auto;

      }


      .message {

        max-width: 92%;

        padding: 12px 14px;

        font-size: 14px;

      }


      #bottom {

        padding: 10px 12px;

        padding-bottom:
          calc(10px + env(safe-area-inset-bottom));

      }


      #inputArea {

        gap: 6px;

      }


      #messageInput {

        padding: 13px;

        font-size: 14px;

      }


      #sendButton {

        padding: 11px 13px;

        font-size: 13px;

      }


      /* Mobilde butonları tekrar alt giriş alanının
         hemen üstünde gösteriyoruz */

      #mobileButtons {

        display: flex;

        gap: 7px;

        margin-bottom: 8px;

      }


      #mobileButtons button {

        flex: 1;

        min-height: 43px;

        border: 1px solid #444;

        border-radius: 11px;

        background: #292929;

        color: white;

        font-size: 13px;

        font-weight: bold;

      }

    }


    /* =========================
       PC'DE MOBİL BUTONLAR GİZLİ
    ========================= */

    @media (min-width: 601px) {

      #mobileButtons {

        display: none;

      }

    }


  </style>

</head>

<body>

<!-- =========================
     ÜST
========================= -->

<header>

  <h1>🤖 Zatoi AI</h1>

  <p>Senin kişisel yapay zekân</p>

</header>

<!-- =========================
     ANA UYGULAMA
========================= -->

<div id="app">

  <!-- =========================
       SOL SOHBET
  ========================= -->

  <section id="chatArea">

```
<div id="chat"></div>


<!-- MOBİL BUTONLAR -->

<div id="bottom">


  <div id="mobileButtons">

    <button
      onclick="toggleMemory()"
    >
      🧠 Hafıza
    </button>


    <button
      onclick="clearMemory()"
    >
      🗑️ Temizle
    </button>

  </div>


  <div id="inputArea">


    <input
      id="messageInput"
      type="text"
      placeholder="Zatoi'ye bir şey sor..."
      autocomplete="off"
    >


    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Gönder
    </button>


  </div>


</div>
```

  </section>

  <!-- =========================
       SAĞ PANEL
  ========================= -->

  <aside id="sidePanel">

```
<div id="sideTitle">

  🧠 Zatoi Hafızası

</div>


<div id="sideDescription">

  Zatoi'nin senin hakkında öğrendiği
  ve gelecekte kullanabileceği bilgiler
  burada tutulur.

</div>


<div id="buttons">


  <button
    onclick="toggleMemory()"
  >
    🧠 Hafızayı Yenile
  </button>


  <button
    onclick="clearMemory()"
  >
    🗑️ Sohbet ve Hafızayı Temizle
  </button>


</div>


<div id="memoryBox">


  <div id="memoryBoxTitle">

    Kayıtlı Bilgiler

  </div>


  <div id="memoryContent"></div>


</div>
```

  </aside>

</div>

<script>


/* =========================
   WORKER
========================= */

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";


/* =========================
   LOCAL STORAGE
========================= */

const CONVERSATION_KEY =
  "zatoi_conversation_v4";

const MEMORY_KEY =
  "zatoi_memory_v4";


let conversation = [];


let memory = {

  name: "",

  facts: [],

  preferences: []

};


/* =========================
   VERİLERİ YÜKLE
========================= */

function loadData() {

  try {


    const savedConversation =
      localStorage.getItem(
        CONVERSATION_KEY
      );


    const savedMemory =
      localStorage.getItem(
        MEMORY_KEY
      );


    if (savedConversation) {

      conversation =
        JSON.parse(
          savedConversation
        );

    }


    if (savedMemory) {

      memory =
        JSON.parse(
          savedMemory
        );

    }


  } catch (error) {

    console.log(
      "Yükleme hatası:",
      error
    );

  }

}


/* =========================
   VERİLERİ KAYDET
========================= */

function saveData() {

  localStorage.setItem(

    CONVERSATION_KEY,

    JSON.stringify(
      conversation
    )

  );


  localStorage.setItem(

    MEMORY_KEY,

    JSON.stringify(
      memory
    )

  );

}


/* =========================
   HAFIZAYI GÖSTER
========================= */

function renderMemory() {

  const content =
    document.getElementById(
      "memoryContent"
    );


  content.textContent =
    JSON.stringify(

      memory,

      null,

      2

    );

}


/* =========================
   SOHBETİ GÖSTER
========================= */

function renderConversation() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML = "";


  conversation.forEach(
    message => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message " +
        message.role;


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "label";


      label.textContent =

        message.role === "user"

          ? "Sen"

          : "Zatoi";


      const content =
        document.createElement(
          "div"
        );


      content.textContent =
        message.content;


      div.appendChild(
        label
      );


      div.appendChild(
        content
      );


      chat.appendChild(
        div
      );


    }
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage() {


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  input.value = "";


  /* Kullanıcı mesajı */

  conversation.push({

    role: "user",

    content: text

  });


  renderConversation();


  /* Son 20 mesaj */

  const recentMessages =
    conversation.slice(-20);


  try {


    const response =
      await fetch(

        WORKER_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },


          body:
            JSON.stringify({

              memory: memory,

              messages:
                recentMessages

            })

        }

      );


    const data =
      await response.json();


    if (data.error) {

      throw new Error(
        data.error
      );

    }


    /* =========================
       HAFIZA GÜNCELLE
    ========================= */

    if (data.memory) {


      memory = {


        name:

          data.memory.name ||

          memory.name ||

          "",


        facts:

          Array.isArray(
            data.memory.facts
          )

            ? data.memory.facts

            : memory.facts,


        preferences:

          Array.isArray(
            data.memory.preferences
          )

            ? data.memory.preferences

            : memory.preferences

      };


      renderMemory();

    }


    /* =========================
       CEVABI AL
    ========================= */

    const reply =

      data.reply ||

      data.choices?.[0]
        ?.message
        ?.content ||

      "Zatoi cevap veremedi.";


    conversation.push({

      role: "assistant",

      content: reply

    });


    saveData();


    renderConversation();


  } catch (error) {


    console.log(
      "Hata:",
      error
    );


    conversation.push({

      role: "assistant",

      content:
        "Şu anda bağlantıda bir sorun oluştu. ⚠️"

    });


    renderConversation();

  }

}


/* =========================
   HAFIZA
========================= */

function toggleMemory() {

  renderMemory();


  /* Mobilde hafıza için
     küçük pencere göster */

  if (
    window.innerWidth <= 600
  ) {


    const text =
      JSON.stringify(

        memory,

        null,

        2

      );


    alert(
      "🧠 Zatoi Hafızası\n\n" +
      text
    );

  }

}


/* =========================
   TEMİZLE
========================= */

function clearMemory() {


  const answer =
    confirm(

      "Sohbet ve hafıza tamamen silinsin mi?"

    );


  if (!answer) return;


  conversation = [];


  memory = {

    name: "",

    facts: [],

    preferences: []

  };


  localStorage.removeItem(
    CONVERSATION_KEY
  );


  localStorage.removeItem(
    MEMORY_KEY
  );


  document.getElementById(
    "chat"
  ).innerHTML = "";


  renderMemory();

}


/* =========================
   ENTER
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(

    "keydown",

    function(event) {


      if (
        event.key === "Enter"
      ) {


        event.preventDefault();


        sendMessage();


      }

    }

  );


/* =========================
   BAŞLAT
========================= */

loadData();


renderConversation();


renderMemory();


</script>

</body>
</html>
