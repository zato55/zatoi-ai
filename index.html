<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #202a36;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .brand {
      font-size: 19px;
      font-weight: 700;
    }

    .brand-sub {
      color: #8995a5;
      font-size: 11px;
      margin-top: 2px;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .chat-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-top {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #1d2631;
      background: #0e141c;
    }

    .chat-title {
      font-size: 14px;
      color: #dce4ee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .new-chat-btn {
      border: 0;
      background: #1c2633;
      color: #fff;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .new-chat-btn:hover {
      background: #263344;
    }

    /* MESSAGES */

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 50px auto;
      text-align: center;
      color: #9aa6b5;
    }

    .welcome h1 {
      color: #fff;
      margin-bottom: 10px;
    }

    .welcome p {
      line-height: 1.6;
    }

    .message-row {
      display: flex;
      margin-bottom: 15px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message {
      max-width: min(760px, 82%);
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: #2563eb;
      border-bottom-right-radius: 5px;
    }

    .message.ai {
      background: #18212c;
      border: 1px solid #263241;
      border-bottom-left-radius: 5px;
    }

    .message-label {
      font-size: 10px;
      color: #8190a2;
      margin-bottom: 5px;
    }

    /* INPUT */

    .input-area {
      flex-shrink: 0;
      padding: 12px 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0e141c;
      border-top: 1px solid #202a36;
    }

    .input-box {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #151d27;
      border: 1px solid #283444;
      border-radius: 15px;
      padding: 7px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      max-height: 130px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 11px 9px;
    }

    .text-input::placeholder {
      color: #667487;
    }

    .action-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 11px;
      background: #202b39;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .action-btn:hover {
      background: #2a394b;
    }

    .send-btn {
      background: #2563eb;
      font-size: 14px;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .mic-listening {
      background: #dc2626 !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    /* SIDE PANEL */

    .side-panel {
      width: 300px;
      flex-shrink: 0;
      background: #101720;
      border-left: 1px solid #202a36;
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow-y: auto;
    }

    .panel-section {
      margin-bottom: 22px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #dbe4ef;
      margin-bottom: 10px;
    }

    .panel-description {
      color: #758294;
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* HISTORY */

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: 0;
      background: #18212c;
      color: #dce4ee;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      overflow: hidden;
    }

    .history-open:hover {
      background: #222e3d;
    }

    .history-open.active {
      background: #263a55;
      border: 1px solid #315b91;
    }

    .history-name {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .history-delete {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      background: #1b222c;
      color: #8d98a7;
      cursor: pointer;
    }

    .history-delete:hover {
      background: #3a2025;
      color: #ff8b8b;
    }

    /* MEMORY */

    .memory-box {
      background: #151d27;
      border: 1px solid #263241;
      border-radius: 11px;
      padding: 11px;
      font-size: 12px;
      line-height: 1.55;
      color: #aeb9c7;
    }

    .memory-name {
      color: #fff;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .memory-label {
      color: #728095;
      margin-top: 8px;
      margin-bottom: 3px;
    }

    .memory-buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .small-btn {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 8px 5px;
      background: #202b39;
      color: #dbe4ef;
      cursor: pointer;
      font-size: 10px;
    }

    .small-btn:hover {
      background: #2a394b;
    }

    /* MOBILE HISTORY */

    .mobile-history-btn {
      display: none;
    }

    .mobile-overlay {
      display: none;
    }

    /* VOICE TOGGLE */

    .voice-state {
      margin-top: 9px;
      font-size: 10px;
      color: #778598;
      text-align: center;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #293543;
      border-radius: 10px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .header {
        height: 58px;
        padding: 0 12px;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .brand {
        font-size: 17px;
      }

      .side-panel {
        display: none;
      }

      .chat-top {
        height: 50px;
      }

      .mobile-history-btn {
        display: block;
        border: 0;
        background: #1c2633;
        color: #fff;
        padding: 8px 11px;
        border-radius: 9px;
        font-size: 12px;
      }

      .messages {
        padding: 15px 12px;
        padding-bottom: 15px;
      }

      .message {
        max-width: 88%;
      }

      .input-area {
        padding-left: 8px;
        padding-right: 8px;
      }

      .text-input {
        font-size: 14px;
      }

      .input-box {
        border-radius: 14px;
      }

      .welcome {
        margin: 35px 15px;
      }

      .mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.65);
      }

      .mobile-overlay.open {
        display: block;
      }

      .mobile-history {
        width: min(320px, 88%);
        height: 100%;
        background: #101720;
        padding: 15px;
        overflow-y: auto;
      }

      .mobile-history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }

      .mobile-history-header strong {
        font-size: 15px;
      }

      .close-history {
        border: 0;
        background: #202b39;
        color: #fff;
        width: 34px;
        height: 34px;
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">
    <div class="logo-area">
      <div class="logo">Z</div>

      <div>
        <div class="brand">Zatoi AI</div>
        <div class="brand-sub">Senin kişisel yapay zekân</div>
      </div>
    </div>
  </header>

  <!-- MAIN -->

  <main class="main">

    <section class="chat-column">

      <div class="chat-top">
        <div id="chatTitle" class="chat-title">
          Yeni Sohbet
        </div>

        <button
          class="mobile-history-btn"
          onclick="openMobileHistory()">
          📚 Geçmiş
        </button>

        <button
          class="new-chat-btn"
          onclick="createNewChat()">
          ➕ Yeni Sohbet
        </button>
      </div>

      <div
        id="messages"
        class="messages">
      </div>

      <div class="input-area">

        <div class="input-box">

          <textarea
            id="desktopInput"
            class="text-input"
            placeholder="Zatoi'ye bir şey sor..."
            rows="1"
            onkeydown="handleInputKey(event)"
            oninput="autoResize(this)"
          ></textarea>

          <button
            id="micButton"
            class="action-btn"
            onclick="toggleVoiceRecognition()"
            title="Sesli konuş">
            🎤
          </button>

          <button
            id="voiceToggle"
            class="action-btn"
            onclick="toggleVoiceOutput()"
            title="Sesli cevap">
            🔊
          </button>

          <button
            class="action-btn send-btn"
            onclick="sendFromInput()">
            Gönder
          </button>

        </div>

      </div>

    </section>

    <!-- DESKTOP SIDE PANEL -->

    <aside class="side-panel">

      <div class="panel-section">

        <div class="panel-title">
          💬 Zatoi Sohbetleri
        </div>

        <div class="panel-description">
          Sohbet geçmişin burada tutulur.
        </div>

        <div
          id="historyList"
          class="history-list">
        </div>

      </div>

      <div class="panel-section">

        <div class="panel-title">
          🧠 Kullanıcı Hafızası
        </div>

        <div class="panel-description">
          Zatoi'nin seni farklı sohbetlerde de tanımasını sağlayan ortak hafıza.
        </div>

        <div
          id="memoryBox"
          class="memory-box">
        </div>

        <div class="memory-buttons">

          <button
            class="small-btn"
            onclick="refreshMemoryUI()">
            🔄 Yenile
          </button>

          <button
            class="small-btn"
            onclick="clearMemory()">
            🧠 Temizle
          </button>

        </div>

        <div
          id="voiceState"
          class="voice-state">
        </div>

      </div>

    </aside>

  </main>

</div>

<!-- MOBILE HISTORY -->

<div
  id="mobileOverlay"
  class="mobile-overlay"
  onclick="closeMobileHistory(event)">

  <div
    class="mobile-history"
    onclick="event.stopPropagation()">

    <div class="mobile-history-header">

      <strong>
        📚 Sohbet Geçmişi
      </strong>

      <button
        class="close-history"
        onclick="closeMobileHistory()">
        ✕
      </button>

    </div>

    <div
      id="mobileHistoryList"
      class="history-list">
    </div>

  </div>

</div>

<script>

  /* =====================================================
     AYARLAR
  ===================================================== */

  const API_URL =
    "https://zatoi-ai.fbboytr.workers.dev/";

  const CHATS_KEY =
    "zatoi_chats_v6";

  const ACTIVE_CHAT_KEY =
    "zatoi_active_chat_v6";

  const GLOBAL_MEMORY_KEY =
    "zatoi_global_memory_v6";

  const VOICE_OUTPUT_KEY =
    "zatoi_voice_output_v1";


  /* =====================================================
     DURUM
  ===================================================== */

  let chats = [];

  let activeChatId = null;

  let globalMemory = {
    name: "",
    facts: [],
    preferences: []
  };

  let voiceOutputEnabled =
    localStorage.getItem(VOICE_OUTPUT_KEY) !== "false";

  let recognition = null;

  let isListening = false;


  /* =====================================================
     ELEMENTLER
  ===================================================== */

  const messagesEl =
    document.getElementById("messages");

  const chatTitleEl =
    document.getElementById("chatTitle");

  const desktopInput =
    document.getElementById("desktopInput");

  const historyList =
    document.getElementById("historyList");

  const mobileHistoryList =
    document.getElementById("mobileHistoryList");

  const memoryBox =
    document.getElementById("memoryBox");

  const voiceState =
    document.getElementById("voiceState");

  const micButton =
    document.getElementById("micButton");

  const voiceToggle =
    document.getElementById("voiceToggle");


  /* =====================================================
     BAŞLAT
  ===================================================== */

  document.addEventListener("DOMContentLoaded", () => {

    loadData();

    setupSpeechRecognition();

    updateVoiceToggle();

    renderAll();

  });


  /* =====================================================
     VERİ YÜKLEME
  ===================================================== */

  function loadData() {

    try {

      const savedMemory =
        localStorage.getItem(GLOBAL_MEMORY_KEY);

      if (savedMemory) {

        const parsed =
          JSON.parse(savedMemory);

        globalMemory = {
          name: parsed.name || "",
          facts: Array.isArray(parsed.facts)
            ? parsed.facts
            : [],
          preferences: Array.isArray(parsed.preferences)
            ? parsed.preferences
            : []
        };

      }

    } catch (error) {

      console.log(
        "Hafıza okunamadı:",
        error
      );

    }


    try {

      const savedChats =
        localStorage.getItem(CHATS_KEY);

      if (savedChats) {

        const parsed =
          JSON.parse(savedChats);

        if (Array.isArray(parsed)) {

          chats = parsed.map(chat => ({

            id:
              chat.id ||
              createId(),

            title:
              chat.title ||
              "Yeni Sohbet",

            messages:
              Array.isArray(chat.messages)
                ? chat.messages
                : [],

            createdAt:
              chat.createdAt ||
              Date.now(),

            updatedAt:
              chat.updatedAt ||
              Date.now()

          }));

        }

      }

    } catch (error) {

      console.log(
        "Sohbetler okunamadı:",
        error
      );

      chats = [];

    }


    /*
      Eski v5 sisteminden kalan sohbetleri
      mümkün olduğunca koruyoruz.
    */

    if (!chats.length) {

      try {

        const oldChats =
          localStorage.getItem(
            "zatoi_chats_v5"
          );

        if (oldChats) {

          const parsed =
            JSON.parse(oldChats);

          if (Array.isArray(parsed)) {

            let mergedMemory = {
              name: globalMemory.name || "",
              facts: [...globalMemory.facts],
              preferences: [
                ...globalMemory.preferences
              ]
            };

            chats = parsed.map(chat => {

              if (chat.memory) {

                if (
                  !mergedMemory.name &&
                  chat.memory.name
                ) {
                  mergedMemory.name =
                    chat.memory.name;
                }

                if (
                  Array.isArray(chat.memory.facts)
                ) {

                  mergedMemory.facts.push(
                    ...chat.memory.facts
                  );

                }

                if (
                  Array.isArray(
                    chat.memory.preferences
                  )
                ) {

                  mergedMemory.preferences.push(
                    ...chat.memory.preferences
                  );

                }

              }

              return {

                id:
                  chat.id ||
                  createId(),

                title:
                  chat.title ||
                  "Yeni Sohbet",

                messages:
                  Array.isArray(chat.messages)
                    ? chat.messages
                    : [],

                createdAt:
                  chat.createdAt ||
                  Date.now(),

                updatedAt:
                  chat.updatedAt ||
                  Date.now()

              };

            });


            globalMemory =
              cleanMemory(mergedMemory);

            saveMemory();

            saveChats();

          }

        }

      } catch (error) {

        console.log(
          "Eski sohbetler taşınamadı:",
          error
        );

      }

    }


    if (!chats.length) {

      createInitialChat();

    }


    const savedActive =
      localStorage.getItem(
        ACTIVE_CHAT_KEY
      );

    if (
      savedActive &&
      chats.some(
        chat => chat.id === savedActive
      )
    ) {

      activeChatId = savedActive;

    } else {

      activeChatId =
        chats[0].id;

      saveActiveChat();

    }

  }


  function createInitialChat() {

    const chat = {

      id:
        createId(),

      title:
        "Yeni Sohbet",

      messages: [],

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };

    chats.unshift(chat);

    activeChatId =
      chat.id;

    saveChats();

    saveActive();

  }


  /* =====================================================
     ID
  ===================================================== */

  function createId() {

    return Math.random()
      .toString(36)
      .substring(2, 10);

  }


  /* =====================================================
     KAYDETME
  ===================================================== */

  function saveChats() {

    localStorage.setItem(
      CHATS_KEY,
      JSON.stringify(chats)
    );

  }


  function saveActive() {

    localStorage.setItem(
      ACTIVE_CHAT_KEY,
      activeChatId
    );

  }


  function saveMemory() {

    localStorage.setItem(
      GLOBAL_MEMORY_KEY,
      JSON.stringify(globalMemory)
    );

  }


  /* =====================================================
     AKTİF SOHBET
  ===================================================== */

  function getActiveChat() {

    return chats.find(
      chat => chat.id === activeChatId
    );

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderAll() {

    renderMessages();

    renderHistory();

    renderMemory();

    updateChatTitle();

  }


  function updateChatTitle() {

    const chat =
      getActiveChat();

    if (!chat) {

      chatTitleEl.textContent =
        "Yeni Sohbet";

      return;

    }

    chatTitleEl.textContent =
      chat.title ||
      "Yeni Sohbet";

  }


  /* =====================================================
     MESAJLAR
  ===================================================== */

  function renderMessages() {

    messagesEl.innerHTML = "";

    const chat =
      getActiveChat();

    if (
      !chat ||
      !chat.messages ||
      !chat.messages.length
    ) {

      messagesEl.innerHTML = `
        <div class="welcome">
          <h1>Zatoi AI</h1>
          <p>
            Merhaba 👋<br>
            Ben Zatoi. Senin kişisel yapay zekânım.
          </p>
        </div>
      `;

      return;

    }


    chat.messages.forEach(message => {

      /*
        ÖNEMLİ:
        Sadece gerçek user/assistant mesajları
        burada render edilir.

        Sohbet başlığı hiçbir zaman mesaj olarak
        eklenmez.
      */

      if (
        message.role !== "user" &&
        message.role !== "assistant"
      ) {
        return;
      }

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const wrapper =
        document.createElement("div");


      const label =
        document.createElement("div");

      label.className =
        "message-label";

      label.textContent =
        message.role === "user"
          ? "Sen"
          : "Zatoi";


      const bubble =
        document.createElement("div");

      bubble.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "ai"
        );

      bubble.textContent =
        message.content || "";


      wrapper.appendChild(label);

      wrapper.appendChild(bubble);

      row.appendChild(wrapper);

      messagesEl.appendChild(row);

    });


    scrollMessages();

  }


  function scrollMessages() {

    setTimeout(() => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    }, 30);

  }


  /* =====================================================
     SOHBET GEÇMİŞİ
  ===================================================== */

  function renderHistory() {

    renderHistoryInto(
      historyList
    );

    renderHistoryInto(
      mobileHistoryList
    );

  }


  function renderHistoryInto(container) {

    if (!container) return;

    container.innerHTML = "";


    const sortedChats =
      [...chats].sort(
        (a, b) =>
          b.updatedAt -
          a.updatedAt
      );


    sortedChats.forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "history-item";


      const open =
        document.createElement("button");

      open.className =
        "history-open";

      if (
        chat.id === activeChatId
      ) {

        open.classList.add(
          "active"
        );

      }


      const name =
        document.createElement("span");

      name.className =
        "history-name";

      name.textContent =
        chat.title ||
        "Yeni Sohbet";


      open.appendChild(name);


      open.onclick = () => {

        openChat(chat.id);

      };


      const del =
        document.createElement("button");

      del.className =
        "history-delete";

      del.textContent =
        "🗑️";

      del.title =
        "Sohbeti sil";


      del.onclick = event => {

        event.stopPropagation();

        deleteChat(chat.id);

      };


      item.appendChild(open);

      item.appendChild(del);

      container.appendChild(item);

    });

  }


  /* =====================================================
     YENİ SOHBET
  ===================================================== */

  function createNewChat() {

    stopSpeaking();

    if (recognition && isListening) {

      try {
        recognition.stop();
      } catch (error) {}

    }


    const chat = {

      id:
        createId(),

      /*
        Yeni sohbetin başlangıç başlığı
        mesaj değildir.
      */

      title:
        "Yeni Sohbet",

      messages: [],

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };


    chats.unshift(chat);

    activeChatId =
      chat.id;


    saveChats();

    saveActive();

    renderAll();


    desktopInput.value = "";

    desktopInput.focus();

  }


  /* =====================================================
     SOHBET AÇ
  ===================================================== */

  function openChat(id) {

    stopSpeaking();

    if (recognition && isListening) {

      try {
        recognition.stop();
      } catch (error) {}

    }


    if (
      !chats.some(
        chat => chat.id === id
      )
    ) {
      return;
    }


    activeChatId = id;

    saveActive();

    renderAll();

    closeMobileHistory();

  }


  /* =====================================================
     SOHBET SİL
  ===================================================== */

  function deleteChat(id) {

    const chat =
      chats.find(
        item => item.id === id
      );

    if (!chat) return;


    const confirmed =
      confirm(
        "Bu sohbet silinsin mi?"
      );

    if (!confirmed) return;


    chats =
      chats.filter(
        item => item.id !== id
      );


    if (!chats.length) {

      createInitialChat();

    } else if (
      activeChatId === id
    ) {

      activeChatId =
        chats[0].id;

      saveActive();

    }


    saveChats();

    renderAll();

  }


  /* =====================================================
     INPUT
  ===================================================== */

  function getCurrentInput() {

    return desktopInput;

  }


  function sendFromInput() {

    const input =
      getCurrentInput();

    if (!input) return;

    const text =
      input.value.trim();

    if (!text) return;


    input.value = "";

    input.style.height =
      "42px";


    sendMessage(text);

  }


  function handleInputKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendFromInput();

    }

  }


  function autoResize(element) {

    element.style.height =
      "auto";

    element.style.height =
      Math.min(
        element.scrollHeight,
        130
      ) + "px";

  }


  /* =====================================================
     MESAJ GÖNDER
  ===================================================== */

  async function sendMessage(text) {

    if (!text) return;


    const chat =
      getActiveChat();

    if (!chat) return;


    /*
      İlk kullanıcı mesajı geldiyse,
      başlığı ayrı alanda oluşturuyoruz.

      Fakat başlığı messages dizisine
      KESİNLİKLE eklemiyoruz.
    */

    if (
      chat.messages.length === 0 &&
      chat.title === "Yeni Sohbet"
    ) {

      chat.title =
        makeChatTitle(text);

    }


    chat.messages.push({

      role:
        "user",

      content:
        text

    });


    chat.updatedAt =
      Date.now();


    saveChats();

    renderAll();


    /*
      Son mesajlardan sadece gerçek
      konuşma mesajlarını gönderiyoruz.
    */

    const recentMessages =
      chat.messages
        .filter(
          message =>
            message.role === "user" ||
            message.role === "assistant"
        )
        .slice(-20);


    try {

      showTyping();


      const response =
        await fetch(
          API_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                memory:
                  globalMemory,

                messages:
                  recentMessages

              })

          }
        );


      if (!response.ok) {

        throw new Error(
          "Sunucu hatası: " +
          response.status
        );

      }


      const data =
        await response.json();


      hideTyping();


      let reply =
        data.reply;


      if (
        !reply &&
        data.choices &&
        data.choices[0] &&
        data.choices[0].message
      ) {

        reply =
          data.choices[0]
            .message
            .content;

      }


      if (!reply) {

        reply =
          "Şu anda cevap oluşturamadım.";

      }


      /*
        Worker'dan gelen ortak hafızayı kaydet.
      */

      if (data.memory) {

        globalMemory =
          cleanMemory(
            data.memory
          );

        saveMemory();

        renderMemory();

      }


      chat.messages.push({

        role:
          "assistant",

        content:
          reply

      });


      chat.updatedAt =
        Date.now();


      saveChats();

      renderAll();


      /*
        Sesli cevap.
      */

      speakText(reply);


    } catch (error) {

      hideTyping();

      console.error(
        error
      );


      chat.messages.push({

        role:
          "assistant",

        content:
          "Bir bağlantı sorunu oluştu. Biraz sonra tekrar deneyelim."

      });


      chat.updatedAt =
        Date.now();


      saveChats();

      renderAll();

    }

  }


  /* =====================================================
     TYPING
  ===================================================== */

  function showTyping() {

    const existing =
      document.getElementById(
        "typingMessage"
      );

    if (existing) return;


    const row =
      document.createElement("div");

    row.id =
      "typingMessage";

    row.className =
      "message-row";


    const wrapper =
      document.createElement("div");


    const label =
      document.createElement("div");

    label.className =
      "message-label";

    label.textContent =
      "Zatoi";


    const bubble =
      document.createElement("div");

    bubble.className =
      "message ai";

    bubble.textContent =
      "Yazıyor...";


    wrapper.appendChild(label);

    wrapper.appendChild(bubble);

    row.appendChild(wrapper);

    messagesEl.appendChild(row);

    scrollMessages();

  }


  function hideTyping() {

    const typing =
      document.getElementById(
        "typingMessage"
      );

    if (typing) {

      typing.remove();

    }

  }


  /* =====================================================
     SOHBET BAŞLIĞI
  ===================================================== */

  function makeChatTitle(text) {

    let title =
      text
        .replace(/\s+/g, " ")
        .trim();


    if (!title) {

      return "Yeni Sohbet";

    }


    /*
      Başlığı kısa tutuyoruz.
      Ama mesajın kendisini değiştirmiyoruz.
    */

    if (title.length > 34) {

      title =
        title.substring(0, 34)
        .trim() +
        "...";

    }


    return title;

  }


  /* =====================================================
     HAFIZA
  ===================================================== */

  function cleanMemory(memory) {

    return {

      name:
        typeof memory.name === "string"
          ? memory.name.trim()
          : "",

      facts:
        Array.isArray(memory.facts)
          ? [...new Set(
              memory.facts
                .filter(
                  item =>
                    typeof item === "string"
                )
                .map(
                  item =>
                    item.trim()
                )
                .filter(Boolean)
            )].slice(0, 30)
          : [],

      preferences:
        Array.isArray(memory.preferences)
          ? [...new Set(
              memory.preferences
                .filter(
                  item =>
                    typeof item === "string"
                )
                .map(
                  item =>
                    item.trim()
                )
                .filter(Boolean)
            )].slice(0, 30)
          : []

    };

  }


  function renderMemory() {

    if (!memoryBox) return;


    let html = "";


    if (globalMemory.name) {

      html += `
        <div class="memory-name">
          👤 ${escapeHtml(
            globalMemory.name
          )}
        </div>
      `;

    } else {

      html += `
        <div class="memory-name">
          👤 İsim henüz öğrenilmedi
        </div>
      `;

    }


    if (
      globalMemory.facts &&
      globalMemory.facts.length
    ) {

      html += `
        <div class="memory-label">
          Bildikleri
        </div>
      `;


      globalMemory.facts
        .slice(0, 8)
        .forEach(fact => {

          html += `
            <div>• ${escapeHtml(fact)}</div>
          `;

        });

    }


    if (
      globalMemory.preferences &&
      globalMemory.preferences.length
    ) {

      html += `
        <div class="memory-label">
          Tercihler
        </div>
      `;


      globalMemory.preferences
        .slice(0, 8)
        .forEach(pref => {

          html += `
            <div>• ${escapeHtml(pref)}</div>
          `;

        });

    }


    if (
      !globalMemory.facts.length &&
      !globalMemory.preferences.length &&
      !globalMemory.name
    ) {

      html += `
        <div>
          Zatoi seni tanımaya başladığında
          önemli bilgileri burada gösterecek.
        </div>
      `;

    }


    memoryBox.innerHTML =
      html;

  }


  function refreshMemoryUI() {

    try {

      const saved =
        localStorage.getItem(
          GLOBAL_MEMORY_KEY
        );

      if (saved) {

        globalMemory =
          cleanMemory(
            JSON.parse(saved)
          );

      }

    } catch (error) {

      console.log(error);

    }


    renderMemory();

  }


  function clearMemory() {

    const confirmed =
      confirm(
        "Zatoi'nin seninle ilgili ortak hafızası temizlensin mi?"
      );

    if (!confirmed) return;


    globalMemory = {

      name: "",

      facts: [],

      preferences: []

    };


    saveMemory();

    renderMemory();

  }


  /* =====================================================
     HTML GÜVENLİĞİ
  ===================================================== */

  function escapeHtml(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     SES TANIMA
  ===================================================== */

  function setupSpeechRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      recognition = null;

      updateMicButtons();

      return;

    }


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "tr-TR";

    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;


    recognition.onstart = () => {

      isListening = true;

      updateMicButtons();

    };


    recognition.onresult =
      event => {

        let transcript =
          "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0]
              .transcript;

        }


        transcript =
          transcript.trim();


        const input =
          getCurrentInput();


        if (input) {

          input.value =
            transcript;

          autoResize(input);

        }


        const lastResult =
          event.results[
            event.results.length - 1
          ];


        if (
          lastResult &&
          lastResult.isFinal
        ) {

          setTimeout(() => {

            const currentInput =
              getCurrentInput();


            if (
              currentInput &&
              currentInput.value.trim()
            ) {

              const text =
                currentInput.value.trim();


              currentInput.value =
                "";

              currentInput.style.height =
                "42px";


              sendMessage(text);

            }

          }, 250);

        }

      };


    recognition.onerror =
      event => {

        console.log(
          "Ses tanıma hatası:",
          event.error
        );


        isListening =
          false;


        updateMicButtons();


        if (
          event.error ===
          "not-allowed"
        ) {

          alert(
            "Mikrofon izni verilmedi. Tarayıcı ayarlarından mikrofon iznini aç."
          );

        }

      };


    recognition.onend = () => {

      isListening =
        false;

      updateMicButtons();

    };

  }


  function toggleVoiceRecognition() {

    if (!recognition) {

      alert(
        "Bu tarayıcı sesli konuşmayı desteklemiyor. Chrome kullanmayı deneyebilirsin."
      );

      return;

    }


    if (isListening) {

      recognition.stop();

      return;

    }


    try {

      recognition.start();

    } catch (error) {

      console.log(
        "Mikrofon başlatılamadı:",
        error
      );

    }

  }


  function updateMicButtons() {

    if (!micButton) return;


    if (isListening) {

      micButton.textContent =
        "⏹️";

      micButton.classList.add(
        "mic-listening"
      );

      micButton.title =
        "Dinlemeyi durdur";

    } else {

      micButton.textContent =
        "🎤";

      micButton.classList.remove(
        "mic-listening"
      );

      micButton.title =
        "Sesli konuş";

    }

  }


  /* =====================================================
     SESLİ CEVAP
  ===================================================== */

  function toggleVoiceOutput() {

    voiceOutputEnabled =
      !voiceOutputEnabled;


    localStorage.setItem(
      VOICE_OUTPUT_KEY,
      voiceOutputEnabled
    );


    updateVoiceToggle();


    if (!voiceOutputEnabled) {

      stopSpeaking();

    }

  }


  function updateVoiceToggle() {

    if (!voiceToggle) return;


    voiceToggle.textContent =
      voiceOutputEnabled
        ? "🔊"
        : "🔇";


    voiceToggle.title =
      voiceOutputEnabled
        ? "Sesli cevap açık"
        : "Sesli cevap kapalı";


    if (voiceState) {

      voiceState.textContent =
        voiceOutputEnabled
          ? "🔊 Sesli cevap açık"
          : "🔇 Sesli cevap kapalı";

    }

  }


  function speakText(text) {

    if (!voiceOutputEnabled) return;

    if (
      !("speechSynthesis" in window)
    ) {
      return;
    }


    if (!text) return;


    stopSpeaking();


    /*
      Çok uzun metinlerde tarayıcı seslendirmesi
      kesilmesin diye parçalıyoruz.
    */

    const chunks =
      splitTextForSpeech(
        text,
        220
      );


    let index = 0;


    function speakNext() {

      if (
        !voiceOutputEnabled ||
        index >= chunks.length
      ) {

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          chunks[index]
        );


      utterance.lang =
        "tr-TR";

      utterance.rate =
        1.0;

      utterance.pitch =
        1.0;

      utterance.volume =
        1.0;


      utterance.onend = () => {

        index++;

        speakNext();

      };


      utterance.onerror =
        () => {

          index++;

          speakNext();

        };


      window.speechSynthesis
        .speak(
          utterance
        );

    }


    speakNext();

  }


  function splitTextForSpeech(
    text,
    maxLength
  ) {

    const words =
      text.split(/\s+/);

    const chunks = [];

    let current = "";


    words.forEach(word => {

      const test =
        current
          ? current + " " + word
          : word;


      if (
        test.length >
        maxLength
      ) {

        if (current) {

          chunks.push(
            current
          );

        }

        current =
          word;

      } else {

        current =
          test;

      }

    });


    if (current) {

      chunks.push(
        current
      );

    }


    return chunks;

  }


  function stopSpeaking() {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

    }

  }


  /* =====================================================
     MOBİL GEÇMİŞ
  ===================================================== */

  function openMobileHistory() {

    const overlay =
      document.getElementById(
        "mobileOverlay"
      );

    overlay.classList.add(
      "open"
    );

  }


  function closeMobileHistory(
    event
  ) {

    if (
      event &&
      event.target !==
      document.getElementById(
        "mobileOverlay"
      )
    ) {

      return;

    }


    const overlay =
      document.getElementById(
        "mobileOverlay"
      );


    overlay.classList.remove(
      "open"
    );

  }


  /* =====================================================
     SAYFA KAPANIRKEN SESİ DURDUR
  ===================================================== */

  window.addEventListener(
    "beforeunload",
    () => {

      stopSpeaking();

    }
  );

</script>
