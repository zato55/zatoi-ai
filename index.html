<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #151515;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #999;
      font-size: 13px;
    }

    #chat {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      padding-bottom: 135px;
    }

    .message {
      margin-bottom: 15px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .assistant {
      background: #1e1e1e;
      border: 1px solid #303030;
      margin-right: auto;
    }

    .label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
    }

    #bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      border-top: 1px solid #292929;
      padding: 12px;
    }

    #inputArea {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1b1b1b;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #buttons {
      max-width: 800px;
      margin: 8px auto 0;
      display: flex;
      gap: 8px;
    }

    #memoryButton,
    #clearButton {
      background: #333;
    }

    #memoryPanel {
      display: none;
      max-width: 800px;
      margin: 10px auto;
      padding: 15px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 12px;
      color: #ddd;
      font-size: 13px;
    }

    #memoryPanel pre {
      white-space: pre-wrap;
      margin: 0;
    }

    @media (max-width: 600px) {
      #chat {
        padding: 12px;
        padding-bottom: 145px;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Zatoi AI</h1>
  <p>Senin kişisel yapay zekân</p>
</header>

<div id="chat"></div>

<div id="memoryPanel">
  <strong>🧠 Zatoi Hafızası</strong>
  <br><br>
  <pre id="memoryContent"></pre>
</div>

<div id="bottom">

  <div id="inputArea">

    <input
      id="messageInput"
      type="text"
      placeholder="Zatoi'ye bir şey sor..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">Gönder</button>

  </div>

  <div id="buttons">

    <button id="memoryButton" onclick="toggleMemory()">
      🧠 Hafıza
    </button>

    <button id="clearButton" onclick="clearMemory()">
      🗑️ Temizle
    </button>

  </div>

</div>

<script>

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";

const CONVERSATION_KEY =
  "zatoi_conversation_v4";

const MEMORY_KEY =
  "zatoi_memory_v4";


let conversation = [];

let memory = {
  name: "",
  facts: [],
  preferences: []
};


/* =========================
   VERİLERİ YÜKLE
========================= */

function loadData() {

  try {

    const savedConversation =
      localStorage.getItem(CONVERSATION_KEY);

    const savedMemory =
      localStorage.getItem(MEMORY_KEY);

    if (savedConversation) {
      conversation = JSON.parse(savedConversation);
    }

    if (savedMemory) {
      memory = JSON.parse(savedMemory);
    }

  } catch (error) {

    console.log("Yükleme hatası:", error);

  }

}


/* =========================
   VERİLERİ KAYDET
========================= */

function saveData() {

  localStorage.setItem(
    CONVERSATION_KEY,
    JSON.stringify(conversation)
  );

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


/* =========================
   SOHBETİ GÖSTER
========================= */

function renderConversation() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  conversation.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "message " + message.role;

    const label =
      document.createElement("div");

    label.className = "label";

    label.textContent =
      message.role === "user"
        ? "Sen"
        : "Zatoi";

    const content =
      document.createElement("div");

    content.textContent =
      message.content;

    div.appendChild(label);
    div.appendChild(content);

    chat.appendChild(div);

  });

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text) return;

  input.value = "";


  /* Kullanıcı mesajını ekle */

  conversation.push({
    role: "user",
    content: text
  });

  renderConversation();


  /* Gönderilecek son 20 mesaj */

  const recentMessages =
    conversation.slice(-20);


  try {

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          memory: memory,

          messages: recentMessages

        })

      });


    const data =
      await response.json();


    if (data.error) {
      throw new Error(data.error);
    }


    /* =========================
       YENİ HAFIZAYI AL
    ========================= */

    if (data.memory) {

      memory = {

        name:
          data.memory.name ||
          memory.name ||
          "",

        facts:
          Array.isArray(data.memory.facts)
            ? data.memory.facts
            : memory.facts,

        preferences:
          Array.isArray(data.memory.preferences)
            ? data.memory.preferences
            : memory.preferences

      };

    }


    /* =========================
       CEVABI AL
    ========================= */

    const reply =
      data.reply ||
      data.choices?.[0]?.message?.content ||
      "Zatoi cevap veremedi.";


    conversation.push({

      role: "assistant",

      content: reply

    });


    saveData();

    renderConversation();


  } catch (error) {

    console.log("Hata:", error);

    conversation.push({

      role: "assistant",

      content:
        "Şu anda bağlantıda bir sorun oluştu. ⚠️"

    });

    renderConversation();

  }

}


/* =========================
   HAFIZA PANELİ
========================= */

function toggleMemory() {

  const panel =
    document.getElementById("memoryPanel");

  const content =
    document.getElementById("memoryContent");


  if (panel.style.display === "block") {

    panel.style.display = "none";

    return;

  }


  content.textContent =
    JSON.stringify(
      memory,
      null,
      2
    );

  panel.style.display =
    "block";

}


/* =========================
   TEMİZLE
========================= */

function clearMemory() {

  const answer =
    confirm(
      "Sohbet ve hafıza tamamen silinsin mi?"
    );

  if (!answer) return;


  conversation = [];

  memory = {

    name: "",

    facts: [],

    preferences: []

  };


  localStorage.removeItem(
    CONVERSATION_KEY
  );

  localStorage.removeItem(
    MEMORY_KEY
  );


  document.getElementById(
    "chat"
  ).innerHTML = "";

  document.getElementById(
    "memoryPanel"
  ).style.display = "none";

}


/* =========================
   ENTER TUŞU
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );


/* =========================
   BAŞLAT
========================= */

loadData();

renderConversation();

</script>

</body>
</html>
