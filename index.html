<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zatoi AI | Yapay Zeka Asistanı</title>

  <meta
    name="description"
    content="Zatoi AI; sohbet, web araştırması, PDF analizi ve kişisel hafıza özelliklerine sahip yapay zeka asistanıdır."
  >
  <meta name="robots" content="index,follow">

  <link rel="canonical" href="https://zato55.github.io/zatoi-ai/">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zatoi AI">
  <meta property="og:title" content="Zatoi AI | Yapay Zeka Asistanı">
  <meta
    property="og:description"
    content="Sohbet et, güncel web bilgilerini araştır, PDF'leri analiz et ve Zatoi'nin seni hatırlamasına izin ver."
  >
  <meta property="og:url" content="https://zato55.github.io/zatoi-ai/">
  <meta property="og:image" content="https://zato55.github.io/zatoi-ai/icon-512.png">
  <meta property="og:locale" content="tr_TR">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zatoi AI | Yapay Zeka Asistanı">
  <meta
    name="twitter:description"
    content="Sohbet, web araştırması, PDF analizi ve kişisel hafıza özellikleriyle Zatoi AI."
  >
  <meta name="twitter:image" content="https://zato55.github.io/zatoi-ai/icon-512.png">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zatoi AI">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .sync-status {
      position: fixed;
      left: 50%;
      top: 18px;
      z-index: 2000;
      transform: translate(-50%, -12px);
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100vw - 28px);
      padding: 10px 14px;
      border: 1px solid #2d4154;
      border-radius: 999px;
      background: rgba(16, 25, 34, .96);
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      color: #dbeafe;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .sync-status.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sync-spinner {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      border: 2px solid #314356;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: syncSpin .8s linear infinite;
    }

    @keyframes syncSpin {
      to { transform: rotate(360deg); }
    }

    .history-empty {
      padding: 18px 12px;
      color: #7f91a3;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    /* =================================
       AUTH
    ================================= */

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #182536 0%,
          #0b0f14 55%
        );
    }

    .auth-screen.hidden {
      display: none;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;

      padding: 30px 24px;

      background: #101720;

      border:
        1px solid #263442;

      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);

      text-align: center;
    }

    .auth-logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #17212b;

      font-size: 34px;
    }

    .auth-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .auth-subtitle {
      margin: 0 0 22px;
      color: #8b9aaa;
      font-size: 14px;
    }

    .auth-error {
      display: none;

      margin-bottom: 14px;
      padding: 10px 12px;

      border:
        1px solid #7f3030;

      border-radius: 10px;

      background: #291519;
      color: #ff9d9d;

      font-size: 13px;
      line-height: 1.4;
    }

    .auth-error.show {
      display: block;
    }

    .auth-input {
      width: 100%;

      height: 46px;

      margin-bottom: 10px;

      padding: 0 13px;

      outline: none;

      border:
        1px solid #293846;

      border-radius: 10px;

      background: #0b1118;
      color: white;

      font-size: 15px;
    }

    .auth-input:focus {
      border-color: #2563eb;
    }

    .auth-submit {
      width: 100%;

      height: 46px;

      margin-top: 8px;

      border-radius: 10px;

      background: #2563eb;
      color: white;

      font-size: 15px;
      font-weight: 700;
    }

    .auth-submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .auth-switch {
      width: 100%;

      margin-top: 12px;

      padding: 9px;

      background: transparent;
      color: #8fb8ff;

      font-size: 14px;
    }

    .auth-info {
      margin-top: 18px;

      color: #687888;

      font-size: 12px;
      line-height: 1.5;
    }

    /* =================================
       APP
    ================================= */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      background: #0b0f14;
    }

    .app.hidden {
      display: none;
    }

    /* =================================
       CHAT
    ================================= */

    .chat-column {
      flex: 1;
      min-width: 0;

      height: 100%;

      display: flex;
      flex-direction: column;
    }

    .chat-top {
      height: 58px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom:
        1px solid #1c2530;

      background: #0d1218;
    }

    .chat-title {
      min-width: 0;

      font-size: 17px;
      font-weight: 700;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-area {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-right: 2px;
    }

    .account-name {
      max-width: 130px;

      padding: 7px 9px;

      border-radius: 9px;

      background: #17212b;
      color: #cbd5df;

      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      background: #171d23;
      color: #ff9a9a;

      border:
        1px solid #29323a;

      border-radius: 9px;

      padding: 8px 10px;

      font-size: 12px;
    }

    .new-chat-btn,
    .mobile-history-btn {
      background: #17212b;
      color: white;

      border:
        1px solid #263442;

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 13px;
    }

    .mobile-history-btn {
      display: none;
    }

    /* =================================
       INPUT
    ================================= */

    .desktop-input-area {
      flex-shrink: 0;

      padding: 12px 18px;

      background: #0b0f14;

      border-bottom:
        1px solid #1c2530;
    }

    .input-box {
      width: 100%;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      background: #111820;

      border:
        1px solid #273440;

      border-radius: 14px;

      padding: 8px;
    }

    textarea {
      flex: 1;
      min-width: 0;

      resize: none;

      max-height: 130px;
      min-height: 40px;

      border: none;
      outline: none;

      background: transparent;
      color: white;

      font-size: 15px;
      line-height: 1.4;

      padding: 10px;
    }

    textarea::placeholder {
      color: #71808f;
    }

    .action-btn,
    .voice-btn {
      flex-shrink: 0;

      height: 40px;
      min-width: 40px;

      border-radius: 10px;

      background: #1b2732;
      color: white;

      font-size: 14px;

      padding: 0 12px;
    }

    .send-btn {
      background: #2563eb;
      font-weight: 700;
    }

    .pdf-btn {
      font-size: 18px;
      padding: 0 10px;
    }

    .voice-btn.active {
      background: #b91c1c;
    }

    /* =================================
       PDF
    ================================= */

    .file-input {
      display: none;
    }

    .selected-file {
      display: none;

      align-items: center;
      gap: 8px;

      padding: 8px 12px;
      margin: 0 18px 8px;

      background: #101922;

      border:
        1px solid #263542;

      border-radius: 10px;

      font-size: 13px;
      color: #cbd5df;
    }

    .selected-file.show {
      display: flex;
    }

    .selected-file-name {
      flex: 1;
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file-btn {
      background: transparent;
      color: #ff8b8b;
      font-size: 18px;
    }

    /* =================================
       MESSAGES
    ================================= */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      scrollbar-width: thin;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(78%, 850px);

      padding: 11px 14px;

      border-radius: 14px;

      font-size: 15px;
      line-height: 1.5;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: #2563eb;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #17212b;

      border:
        1px solid #253341;

      border-bottom-left-radius: 5px;
    }

    .welcome {
      margin: auto;

      text-align: center;

      color: #8b9aaa;

      padding: 30px;
    }

    .welcome h1 {
      color: white;

      font-size: 30px;

      margin: 0 0 12px;
    }

    .welcome p {
      line-height: 1.7;
    }

    /* =================================
       TYPING
    ================================= */

    .typing-row {
      display: flex;
      justify-content: flex-start;
    }

    .typing {
      background: #17212b;

      border:
        1px solid #253341;

      border-radius: 14px;

      padding: 11px 14px;

      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      background: #8999a8;

      border-radius: 50%;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    .mobile-thinking-text {
      display: none;
      align-items: center;
      gap: 8px;
      color: #9fb0c0;
      font-size: 13px;
      padding: 2px 2px 0;
    }

    .mobile-thinking-text::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9fb0c0;
      animation: thinkingPulse 1s infinite ease-in-out;
    }

    @keyframes thinkingPulse {
      0%, 100% { opacity: .35; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =================================
       HISTORY
    ================================= */

    .side-panel {
      width: 320px;
      height: 100%;

      flex-shrink: 0;

      border-left:
        1px solid #1c2530;

      background: #0d1218;

      display: flex;
      flex-direction: column;
    }

    .side-header {
      height: 58px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      border-bottom:
        1px solid #1c2530;
    }

    .history-list {
      flex: 1;

      overflow-y: auto;

      padding: 12px;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;

      align-items: center;

      gap: 8px;

      margin-bottom: 8px;
    }

    .history-open {
      flex: 1;
      min-width: 0;

      text-align: left;

      background: #111820;
      color: #dce4eb;

      border:
        1px solid #202d39;

      border-radius: 10px;

      width: 100%;
      min-height: 40px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.3;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .history-open.active {
      border-color: #2563eb;
      background: #142338;
    }

    .history-delete {
      width: 36px;
      height: 36px;

      border-radius: 8px;

      background: #171d23;

      color: #ff8585;
    }

    .mobile-thinking-indicator {
      display: none;
    }

    @media (max-width: 800px) {
      .mobile-thinking-indicator {
        position: fixed;
        left: 12px;
        bottom: calc(82px + env(safe-area-inset-bottom));
        z-index: 45;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        border: 1px solid #2b3b49;
        border-radius: 12px;
        background: rgba(16, 25, 34, .97);
        color: #c8d4df;
        box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
        font-size: 13px;
        pointer-events: none;
      }

      .mobile-thinking-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .mobile-thinking-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #9fb0c0;
        animation: typing 1.2s infinite;
      }

      .mobile-thinking-dots span:nth-child(2) {
        animation-delay: .15s;
      }

      .mobile-thinking-dots span:nth-child(3) {
        animation-delay: .3s;
      }
    }

    /* =================================
       MOBILE
    ================================= */

    .mobile-input-area {
      display: none;
    }

    .mobile-history-overlay {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background: rgba(0,0,0,.6);
    }

    .mobile-history-overlay.show {
      display: block;
    }

    .mobile-history-panel {
      position: absolute;

      top: 0;
      left: 0;
      bottom: 0;

      width: min(320px, 85vw);

      background: #0d1218;

      border-right:
        1px solid #26313d;

      display: flex;

      flex-direction: column;
    }

    .mobile-history-header {
      height: 58px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 14px;

      border-bottom:
        1px solid #1c2530;
    }

    .close-history {
      width: 35px;
      height: 35px;

      border-radius: 8px;

      background: #19222b;

      color: white;

      font-size: 18px;
    }

    .mobile-history-list {
      flex: 1;

      overflow-y: auto;

      padding: 10px;
    }

    @media (max-width: 800px) {

      .app {
        height: 100dvh;
      }

      .side-panel {
        display: none;
      }

      .chat-top {
        height: 56px;
        padding: 0 10px;
      }

      .chat-title {
        max-width: 130px;
      }

      .mobile-history-btn {
        display: block;

        padding: 8px 9px;

        font-size: 12px;
      }

      .new-chat-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .account-area {
        margin-right: 0;
      }

      .account-name {
        display: none;
      }

      .logout-btn {
        padding: 8px 9px;
      }

      .desktop-input-area {
        display: none;
      }

      .messages {
        padding: 12px 10px 100px;
      }

      .message {
        max-width: 88%;
      }

      .mobile-input-area {
        display: block;

        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 20;

        padding: 8px;

        background: rgba(11,15,20,.97);

        border-top:
          1px solid #1c2530;
      }

      .mobile-input-area .selected-file {
        margin: 0 0 7px;
      }

      .mobile-input-area .input-box {
        padding: 6px;
      }

      .mobile-input-area textarea {
        min-height: 38px;
        max-height: 100px;

        padding: 9px;

        font-size: 14px;
      }

      .mobile-input-area .voice-btn,
      .mobile-input-area .action-btn {
        height: 38px;
        min-width: 38px;
        padding: 0 8px;
      }

      .mobile-thinking-text {
        display: flex;
      }

      .typing-row.mobile-thinking-row .typing {
        display: none;
      }

      .auth-card {
        padding: 26px 20px;
      }

    }



  /* V8 - WEB KAYNAK KARTLARI */
  .source-cards {
    display: grid;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #2a3947;
  }

  .source-card {
    display: block;
    padding: 10px 11px;
    border: 1px solid #2b3b49;
    border-radius: 10px;
    background: #101922;
    color: inherit;
    text-decoration: none;
  }

  .source-card:hover {
    border-color: #3b82f6;
    background: #13202c;
  }

  .source-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .source-number {
    display: inline-grid;
    place-items: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 999px;
    background: #2563eb;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .source-host {
    min-width: 0;
    color: #8fa4b7;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .source-title {
    color: #e7edf3;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
  }

  .source-open {
    margin-top: 5px;
    color: #7fb0ff;
    font-size: 11px;
  }

  </style>

</head>

<body>


<!-- ==========================================
     AUTH EKRANI
========================================== -->

<div
  id="authScreen"
  class="auth-screen"
>

  <div class="auth-card">

    <div class="auth-logo" aria-hidden="true">
      🤖
    </div>

    <h1>
      Zatoi AI
    </h1>

    <p
      id="authSubtitle"
      class="auth-subtitle"
    >
      Kullanıcı adın ve şifrenle hesabına giriş yap
    </p>

    <div
      id="authError"
      class="auth-error"
    ></div>

    <label for="authUsername" class="sr-only">Kullanıcı adı</label>

    <input
      id="authUsername"
      aria-describedby="authHelp"
      class="auth-input"
      type="text"
      autocomplete="username"
      placeholder="Kullanıcı adı"
      maxlength="40"
    >

    <label for="authPassword" class="sr-only">Şifre</label>

    <input
      id="authPassword"
      aria-describedby="authHelp"
      class="auth-input"
      type="password"
      autocomplete="current-password"
      placeholder="Şifre"
      maxlength="128"
    >

    <label for="authPasswordConfirm" class="sr-only">Şifre tekrar</label>

    <input
      id="authPasswordConfirm"
      class="auth-input"
      type="password"
      autocomplete="new-password"
      placeholder="Şifre tekrar"
      maxlength="128"
      style="display:none;"
    >

    <button
      id="authSubmit"
      class="auth-submit"
    >
      Giriş Yap
    </button>

    <button
      id="authSwitch"
      class="auth-switch"
    >
      Hesabın yok mu? Hesap oluştur
    </button>

    <div id="authHelp" class="auth-info">
      Hesabın yoksa ücretsiz oluşturabilirsin. E-posta gerekmez; yalnızca bir kullanıcı adı ve en az 8 karakterlik şifre yeterlidir.
    </div>

  </div>

</div>


<div
  id="syncStatus"
  class="sync-status"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <span class="sync-spinner" aria-hidden="true"></span>
  <span id="syncStatusText">Sohbetler yükleniyor...</span>
</div>

<!-- ==========================================
     ANA UYGULAMA
========================================== -->

<div
  id="app"

<script>


/* ==========================================
   AYARLAR
========================================== */

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";


const CHATS_KEY =
  "zatoi_chats_v6";


const ACTIVE_CHAT_KEY =
  "zatoi_active_chat_v6";


const GLOBAL_MEMORY_KEY =
  "zatoi_global_memory_v6";


const VOICE_OUTPUT_KEY =
  "zatoi_voice_output_v1";


const AUTH_TOKEN_KEY =
  "zatoi_auth_token_v1";


const AUTH_USER_KEY =
  "zatoi_auth_user_v1";


/* ==========================================
   AUTH DURUMU
========================================== */

let authToken =
  localStorage.getItem(
    AUTH_TOKEN_KEY
  ) || "";


let currentUser = null;


try {

  currentUser =
    JSON.parse(
      localStorage.getItem(
        AUTH_USER_KEY
      ) || "null"
    );

} catch (error) {

  currentUser = null;

}


/* ==========================================
   ELEMENTLER
========================================== */

const authScreen =
  document.getElementById(
    "authScreen"
  );


const app =
  document.getElementById(
    "app"
  );


const authSubtitle =
  document.getElementById(
    "authSubtitle"
  );


const authError =
  document.getElementById(
    "authError"
  );


const authUsername =
  document.getElementById(
    "authUsername"
  );


const authPassword =
  document.getElementById(
    "authPassword"
  );


const authPasswordConfirm =
  document.getElementById(
    "authPasswordConfirm"
  );


const authSubmit =
  document.getElementById(
    "authSubmit"
  );


const authSwitch =
  document.getElementById(
    "authSwitch"
  );


const accountUsername =
  document.getElementById(
    "accountUsername"
  );

const syncStatus =
  document.getElementById(
    "syncStatus"
  );

const syncStatusText =
  document.getElementById(
    "syncStatusText"
  );


const messagesElement =
  document.getElementById(
    "messages"
  );


const chatTitleElement =
  document.getElementById(
    "chatTitle"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


const mobileHistoryList =
  document.getElementById(
    "mobileHistoryList"
  );


const desktopInput =
  document.getElementById(
    "desktopInput"
  );


const mobileInput =
  document.getElementById(
    "mobileInput"
  );


const pdfInput =
  document.getElementById(
    "pdfInput"
  );


let chats = [];

let activeChatId = null;

let selectedPdf = null;

let documentData = null;

let sending = false;

let authMode = "login";


/* ==========================================
   AUTH HATA MESAJI
========================================== */

function showAuthError(message) {

  authError.textContent =
    message;

  authError.classList.add(
    "show"
  );

}


function clearAuthError() {

  authError.textContent =
    "";

  authError.classList.remove(
    "show"
  );

}


/* ==========================================
   AUTH MODU
========================================== */

function updateAuthMode() {

  clearAuthError();

  authUsername.value = "";
  authPassword.value = "";
  authPasswordConfirm.value = "";

  if (authMode === "login") {

    authSubtitle.textContent =
      "Kullanıcı adın ve şifrenle hesabına giriş yap";

    authPassword.autocomplete =
      "current-password";

    authPasswordConfirm.style.display =
      "none";

    authSubmit.textContent =
      "Giriş Yap";

    authSwitch.textContent =
      "Hesabın yok mu? Hesap oluştur";

  } else {

    authSubtitle.textContent =
      "Kullanıcı adını ve en az 8 karakterlik şifreni belirle";

    authPassword.autocomplete =
      "new-password";

    authPasswordConfirm.style.display =
      "block";

    authSubmit.textContent =
      "Hesap Oluştur";

    authSwitch.textContent =
      "Zaten hesabın var mı? Giriş yap";

  }

}


authSwitch.onclick =
  () => {

    authMode =
      authMode === "login"
        ? "register"
        : "login";

    updateAuthMode();

  };


/* ==========================================
   AUTH API
========================================== */

async function authRequest(
  action,
  username = "",
  password = ""
) {

  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          ...(authToken
            ? {
                "Authorization":
                  `Bearer ${authToken}`
              }
            : {})

        },

        body:
          JSON.stringify({

            type:
              "auth",

            action:
              action,

            username:
              username,

            password:
              password

          })

      }
    );


  let data = {};

  try {

    data =
      await response.json();

  } catch (error) {

    data = {};

  }


  if (!response.ok) {

    throw new Error(

      data.details ||
      data.error ||
      "İşlem başarısız."

    );

  }


  return data;

}


/* ==========================================
   AUTH BAŞARILI
========================================== */

function saveAuth(
  token,
  user,
  memory
) {

  authToken =
    token || "";

  currentUser =
    user || null;


  if (authToken) {

    localStorage.setItem(
      AUTH_TOKEN_KEY,
      authToken
    );

  } else {

    localStorage.removeItem(
      AUTH_TOKEN_KEY
    );

  }


  if (currentUser) {

    localStorage.setItem(

      AUTH_USER_KEY,

      JSON.stringify(
        currentUser
      )

    );

  } else {

    localStorage.removeItem(
      AUTH_USER_KEY
    );

  }


  if (memory) {

    globalMemory = {

      name:
        memory.name || "",

      facts:
        Array.isArray(
          memory.facts
        )
          ? memory.facts
          : [],

      preferences:
        Array.isArray(
          memory.preferences
        )
          ? memory.preferences
          : []

    };


    saveMemory();

  }


  if (currentUser) {

    accountUsername.textContent =
      "👤 " +
      currentUser.username;

  } else {

    accountUsername.textContent =
      "";

  }

}


function showSyncStatus(message = "Sohbetler yükleniyor...") {

  if (!syncStatus || !syncStatusText) {
    return;
  }

  syncStatusText.textContent =
    message;

  syncStatus.classList.add(
    "show"
  );

}


function hideSyncStatus() {

  if (!syncStatus) {
    return;
  }

  syncStatus.classList.remove(
    "show"
  );

}


/* ==========================================
   UYGULAMAYI GÖSTER
========================================== */

function showApp() {

  authScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );

  renderAll();

  updateMic();

  updateVoiceButton();

  focusInput();

}


/* ==========================================
   AUTH EKRANINI GÖSTER
========================================== */

function showAuthScreen() {

  stopSpeaking();

  app.classList.add(
    "hidden"
  );

  authScreen.classList.remove(
    "hidden"
  );

  authMode =
    "login";

  updateAuthMode();

}


/* ==========================================
   REGISTER
========================================== */

async function registerAccount() {

  clearAuthError();


  const username =
    authUsername.value.trim();


  const password =
    authPassword.value;


  const confirm =
    authPasswordConfirm.value;


  if (!username) {

    showAuthError(
      "Kullanıcı adı gir."
    );

    return;

  }


  if (password.length < 8) {

    showAuthError(
      "Şifre en az 8 karakter olmalı."
    );

    return;

  }


  if (password !== confirm) {

    showAuthError(
      "Şifreler aynı değil."
    );

    return;

  }


  authSubmit.disabled =
    true;


  authSubmit.textContent =
    "Oluşturuluyor...";


  try {

    const data =
      await authRequest(
        "register",
        username,
        password
      );


    if (
      !data.token ||
      !data.user
    ) {

      throw new Error(
        "Hesap oluşturuldu ancak oturum başlatılamadı."
      );

    }


    saveAuth(
      data.token,
      data.user,
      data.memory
    );


    authUsername.value = "";
    authPassword.value = "";
    authPasswordConfirm.value = "";


    await syncChatsWithCloud();

    showApp();


  } catch (error) {

    console.log(
      "Register error:",
      error
    );


    showAuthError(
      error.message ||
      "Hesap oluşturulamadı."
    );

  }


  authSubmit.disabled =
    false;


  authSubmit.textContent =
    "Hesap Oluştur";

}


/* ==========================================
   LOGIN
========================================== */

async function loginAccount() {

  clearAuthError();


  const username =
    authUsername.value.trim();


  const password =
    authPassword.value;


  if (!username) {

    showAuthError(
      "Kullanıcı adı gir."
    );

    return;

  }


  if (!password) {

    showAuthError(
      "Şifreni gir."
    );

    return;

  }


  authSubmit.disabled =
    true;


  authSubmit.textContent =
    "Giriş yapılıyor...";


  try {

    const data =
      await authRequest(
        "login",
        username,
        password
      );


    if (
      !data.token ||
      !data.user
    ) {

      throw new Error(
        "Giriş başarılı ancak oturum bilgisi alınamadı."
      );

    }


    saveAuth(
      data.token,
      data.user,
      data.memory
    );


    authUsername.value = "";
    authPassword.value = "";


    await syncChatsWithCloud();

    showApp();


  } catch (error) {

    console.log(
      "Login error:",
      error
    );


    showAuthError(
      error.message ||
      "Giriş yapılamadı."
    );

  }


  authSubmit.disabled =
    false;


  authSubmit.textContent =
    "Giriş Yap";

}


/* ==========================================
   AUTH SUBMIT
========================================== */

authSubmit.onclick =
  () => {

    if (
      authMode ===
      "register"
    ) {

      registerAccount();

    } else {

      loginAccount();

    }

  };


authPassword.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      if (
        authMode ===
        "login"
      ) {

        loginAccount();

      } else {

        authPasswordConfirm.focus();

      }

    }

  }
);


authPasswordConfirm.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      registerAccount();

    }

  }
);


/* ==========================================
   LOGOUT
========================================== */

async function logoutAccount() {

  if (!authToken) {

    showAuthScreen();

    return;

  }


  try {

    await authRequest(
      "logout"
    );

  } catch (error) {

    console.log(
      "Logout error:",
      error
    );

  }


  authToken = "";

  currentUser = null;


  localStorage.removeItem(
    AUTH_TOKEN_KEY
  );

  localStorage.removeItem(
    AUTH_USER_KEY
  );


  showAuthScreen();

}


document
  .getElementById(
    "logoutButton"
  )
  .onclick =
    logoutAccount;


/* ==========================================
   AUTH KONTROL
========================================== */

async function checkAuth() {

  if (!authToken) {

    showAuthScreen();

    return false;

  }


  try {

    const data =
      await authRequest(
        "me"
      );


    if (
      !data.success ||
      !data.user
    ) {

      throw new Error(
        "Oturum geçersiz."
      );

    }


    saveAuth(
      authToken,
      data.user,
      data.memory
    );


    await syncChatsWithCloud();

    showApp();


    return true;

  } catch (error) {

    console.log(
      "Auth check error:",
      error
    );


    authToken = "";

    currentUser = null;


    localStorage.removeItem(
      AUTH_TOKEN_KEY
    );

    localStorage.removeItem(
      AUTH_USER_KEY
    );


    showAuthScreen();


    return false;

  }

}


/* ==========================================
   HAFIZA
========================================== */

let globalMemory = {

  name: "",

  facts: [],

  preferences: []

};


function loadMemory() {

  try {

    const saved =
      localStorage.getItem(
        GLOBAL_MEMORY_KEY
      );


    if (saved) {

      const parsed =
        JSON.parse(saved);


      globalMemory = {

        name:
          parsed.name || "",

        facts:
          Array.isArray(
            parsed.facts
          )
            ? parsed.facts
            : [],

        preferences:
          Array.isArray(
            parsed.preferences
          )
            ? parsed.preferences
            : []

      };

    }

  } catch (error) {

    console.log(
      "Memory error:",
      error
    );

  }

}


function saveMemory() {

  localStorage.setItem(

    GLOBAL_MEMORY_KEY,

    JSON.stringify(
      globalMemory
    )

  );

}


loadMemory();


/* ==========================================
   CHAT
========================================== */

function createChat() {

  return {

    id:
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    title:
      "Yeni Sohbet",

    messages: [],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    document:
      null

  };

}


function saveChats() {

  localStorage.setItem(

    CHATS_KEY,

    JSON.stringify(
      chats
    )

  );


  localStorage.setItem(

    ACTIVE_CHAT_KEY,

    activeChatId || ""

  );

}


function loadChats() {

  try {

    const saved =
      localStorage.getItem(
        CHATS_KEY
      );


    if (saved) {

      chats =
        JSON.parse(saved);

    }

  } catch (error) {

    chats = [];

  }


  if (!Array.isArray(chats)) {

    chats = [];

  }


  chats =
    chats.map(
      chat => ({

        id:
          chat.id ||
          "chat_" +
          Date.now(),

        title:
          chat.title ||
          "Yeni Sohbet",

        messages:
          Array.isArray(
            chat.messages
          )
            ? chat.messages
            : [],

        createdAt:
          chat.createdAt ||
          Date.now(),

        updatedAt:
          chat.updatedAt ||
          Date.now(),

        document:
          chat.document ||
          null

      })
    );


  const savedActive =
    localStorage.getItem(
      ACTIVE_CHAT_KEY
    );


  if (
    savedActive &&
    chats.some(
      c =>
        c.id ===
        savedActive
    )
  ) {

    activeChatId =
      savedActive;

  } else if (
    chats.length
  ) {

    activeChatId =
      chats[0].id;

  } else {

    const chat =
      createChat();

    chats.push(chat);

    activeChatId =
      chat.id;

    saveChats();

  }

}


loadChats();


/* ==========================================
   V10 - BULUT SOHBET GEÇMİŞİ
========================================== */

async function cloudChatRequest(action, payload = {}) {

  if (!authToken) {
    throw new Error("AUTH_REQUIRED");
  }

  const response = await fetch(
    WORKER_URL,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${authToken}`
      },
      body: JSON.stringify({
        type: "chat_history",
        action,
        ...payload
      })
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (response.status === 401) {
    throw new Error("AUTH_REQUIRED");
  }

  if (!response.ok) {
    throw new Error(
      data.details ||
      data.error ||
      "Bulut sohbet işlemi başarısız."
    );
  }

  return data;
}


function normalizeCloudChatForLocal(chat) {

  if (!chat || !chat.id) {
    return null;
  }

  return {
    id: String(chat.id),
    title: String(chat.title || "Yeni Sohbet"),
    messages: Array.isArray(chat.messages)
      ? chat.messages
      : [],
    createdAt: Number(chat.createdAt) || Date.now(),
    updatedAt: Number(chat.updatedAt) || Number(chat.createdAt) || Date.now(),
    document: chat.document && typeof chat.document === "object"
      ? {
          name: String(chat.document.name || "Yüklenen PDF"),
          text: String(chat.document.text || "").slice(0, 500000)
        }
      : null
  };
}


function isEmptyPlaceholderChat(chat) {

  return !!chat &&
    (!Array.isArray(chat.messages) || chat.messages.length === 0) &&
    !chat.document &&
    (chat.title === "Yeni Sohbet" || !chat.title);
}


async function saveChatToCloud(chat) {

  if (!authToken || !chat) {
    return;
  }

  const payloadChat = {
    id: chat.id,
    title: chat.title || "Yeni Sohbet",
    messages: Array.isArray(chat.messages)
      ? chat.messages.slice(-100)
      : [],
    createdAt: Number(chat.createdAt) || Date.now(),
    updatedAt: Number(chat.updatedAt) || Date.now(),
    document: chat.document
      ? {
          name: chat.document.name || "Yüklenen PDF",
          text: String(chat.document.text || "").slice(0, 500000)
        }
      : null
  };

  await cloudChatRequest(
    "upsert",
    { chat: payloadChat }
  );
}


function queueCloudSave(chat) {

  if (!authToken || !chat) {
    return;
  }

  saveChatToCloud(chat)
    .catch(error => {
      if (error?.message !== "AUTH_REQUIRED") {
        console.log("Cloud save error:", error);
      }
    });
}


async function deleteChatFromCloud(chatId, updatedAt = Date.now()) {

  if (!authToken || !chatId) {
    return;
  }

  try {
    await cloudChatRequest(
      "delete",
      {
        chatId,
        updatedAt
      }
    );
  } catch (error) {
    if (error?.message !== "AUTH_REQUIRED") {
      console.log("Cloud delete error:", error);
    }
  }
}


async function syncChatsWithCloud() {

  if (!authToken) {
    return;
  }

  showSyncStatus(
    "Sohbetler yükleniyor..."
  );

  try {

    const data = await cloudChatRequest("list");

    const remoteChats = Array.isArray(data.chats)
      ? data.chats
          .map(normalizeCloudChatForLocal)
          .filter(Boolean)
      : [];

    const deletedMap = new Map(
      (Array.isArray(data.deleted) ? data.deleted : [])
        .filter(item => item && item.id)
        .map(item => [
          String(item.id),
          Number(item.updatedAt) || 0
        ])
    );

    let localChats = Array.isArray(chats)
      ? chats
          .map(normalizeCloudChatForLocal)
          .filter(Boolean)
      : [];

    // Başka cihazda silinen daha eski yerel kopyayı geri getirme.
    localChats = localChats.filter(chat => {
      const deletedAt = deletedMap.get(chat.id);
      return !(deletedAt && deletedAt >= (Number(chat.updatedAt) || 0));
    });

    // Bulutta gerçek sohbet varsa bu cihazın otomatik boş sohbetini taşıma.
    if (remoteChats.length) {
      localChats = localChats.filter(chat => !isEmptyPlaceholderChat(chat));
    }

    const merged = new Map();
    const uploadAfterMerge = [];

    for (const remote of remoteChats) {
      merged.set(remote.id, remote);
    }

    for (const local of localChats) {

      const remote = merged.get(local.id);

      if (!remote) {
        merged.set(local.id, local);
        uploadAfterMerge.push(local);
        continue;
      }

      if ((Number(local.updatedAt) || 0) > (Number(remote.updatedAt) || 0)) {
        merged.set(local.id, local);
        uploadAfterMerge.push(local);
      }
    }

    chats = [...merged.values()]
      .sort((a, b) =>
        (Number(b.updatedAt) || 0) -
        (Number(a.updatedAt) || 0)
      )
      .slice(0, 50);

    if (!chats.length) {
      const chat = createChat();
      chats = [chat];
      uploadAfterMerge.push(chat);
    }

    if (!chats.some(chat => chat.id === activeChatId)) {
      activeChatId = chats[0].id;
    }

    saveChats();
    renderAll();

    // Eski tarayıcı sohbetlerini ilk senkron sırasında buluta taşı.
    for (const chat of uploadAfterMerge) {
      try {
        await saveChatToCloud(chat);
      } catch (error) {
        console.log("Initial cloud upload error:", error);
      }
    }

  } catch (error) {

    console.log("Cloud sync error:", error);

    // Bulut erişilemezse yerel sohbetler çalışmaya devam eder.

  } finally {

    hideSyncStatus();

  }
}


function getActiveChat() {

  return chats.find(
    chat =>
      chat.id ===
      activeChatId
  );

}


function createNewChat() {

  stopSpeaking();

  const chat =
    createChat();


  chats.unshift(chat);

  activeChatId =
    chat.id;


  saveChats();

  queueCloudSave(chat);

  clearSelectedFile();

  renderAll();

  setInput("");

}


function selectChat(id) {

  stopSpeaking();

  activeChatId =
    id;


  saveChats();

  clearSelectedFile();

  renderAll();

  closeMobileHistory();

}


function deleteChat(id) {

  const index =
    chats.findIndex(
      chat =>
        chat.id === id
    );


  if (index === -1) {
    return;
  }


  const deletedChat = chats[index];
  const deletedAt = Date.now();

  const wasActive =
    activeChatId === id;


  chats.splice(
    index,
    1
  );


  let newChat = null;

  if (
    chats.length === 0
  ) {

    newChat = createChat();

    chats.push(newChat);

    activeChatId =
      newChat.id;

  } else if (
    wasActive
  ) {

    activeChatId =
      chats[0].id;

  }


  saveChats();

  deleteChatFromCloud(
    deletedChat.id,
    deletedAt
  );

  if (newChat) {
    queueCloudSave(newChat);
  }

  clearSelectedFile();

  renderAll();

}

/* ==========================================
   V8 - WEB KAYNAKLARI
========================================== */

function normalizeSources(sources) {

  if (!Array.isArray(sources)) {
    return [];
  }

  const seen = new Set();

  return sources
    .map((source, index) => ({
      index: Number(source?.index) || index + 1,
      title: String(source?.title || `Kaynak ${index + 1}`).trim(),
      url: String(source?.url || "").trim()
    }))
    .filter(source => {
      if (!source.url) return false;

      try {
        const url = new URL(source.url);
        if (url.protocol !== "http:" && url.protocol !== "https:") return false;
        if (seen.has(url.href)) return false;
        seen.add(url.href);
        return true;
      } catch {
        return false;
      }
    })
    .slice(0, 6);
}

function stripWorkerSourceList(reply, sources) {
  const text = String(reply || "").replace(/\r\n/g, "\n").trim();
  if (!sources.length) return text;
  const lines = text.split("\n");
  const sourceHeadingIndex = lines.findIndex(line => {
    const cleaned = line.replace(/#{1,6}|\*\*|__|`/g, "").trim();
    return /^(kaynaklar|kaynakça|kaynakca|sources|references)\s*:?\s*$/i.test(cleaned);
  });
  if (sourceHeadingIndex === -1) return text;
  return lines.slice(0, sourceHeadingIndex).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function createSourceCards(sources) {
  const normalized = normalizeSources(sources);
  if (!normalized.length) return null;
  const wrapper = document.createElement("div");
  wrapper.className = "source-cards";

  normalized.forEach(source => {
    const link = document.createElement("a");
    link.className = "source-card";
    link.href = source.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    let hostname = "Kaynak";
    try { hostname = new URL(source.url).hostname.replace(/^www\./, ""); } catch {}

    const top = document.createElement("div");
    top.className = "source-card-top";
    const number = document.createElement("span");
    number.className = "source-number";
    number.textContent = String(source.index);
    const host = document.createElement("span");
    host.className = "source-host";
    host.textContent = hostname;
    top.appendChild(number);
    top.appendChild(host);

    const title = document.createElement("div");
    title.className = "source-title";
    title.textContent = source.title;
    const open = document.createElement("div");
    open.className = "source-open";
    open.textContent = "Kaynağı aç ↗";

    link.appendChild(top);
    link.appendChild(title);
    link.appendChild(open);
    wrapper.appendChild(link);
  });

  return wrapper;
}

function renderMessages() {

  messagesElement.innerHTML =
    "";


  const chat =
    getActiveChat();


  if (
    !chat ||
    chat.messages.length === 0
  ) {

    messagesElement.innerHTML = `

      <div class="welcome">

        <h1>
          Zatoi AI 🤖
        </h1>

        <p>
          Merhaba! Ben Zatoi.
          <br>
          Sana nasıl yardımcı olabilirim?
        </p>

      </div>

    `;

    return;

  }


  let messages;


  if (isMobile()) {

    messages =
      [...chat.messages];

  } else {

    messages =
      [...chat.messages]
        .reverse();

  }


  messages.forEach(
    message => {

      if (
        message.role !==
          "user" &&
        message.role !==
          "assistant"
      ) {

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        message.role;


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message " +
        message.role;


      const content =
        document.createElement(
          "div"
        );


      content.textContent =
        message.content;


      bubble.appendChild(
        content
      );


      if (
        message.role ===
          "assistant" &&
        Array.isArray(
          message.sources
        ) &&
        message.sources.length
      ) {

        const cards =
          createSourceCards(
            message.sources
          );


        if (cards) {
          bubble.appendChild(
            cards
          );
        }

      }


      row.appendChild(
        bubble
      );


      messagesElement.appendChild(
        row
      );

    }
  );


  if (isMobile()) {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      },
      20
    );

  } else {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          0;

      },
      20
    );

  }

}

      open.onclick =
        () =>
          selectChat(
            chat.id
          );


      const del =
        document.createElement(
          "button"
        );


      del.className =
        "history-delete";


      del.textContent =
        "🗑️";


      del.setAttribute(

            chat.id
          );

        };


      item.appendChild(
        open
      );

      item.appendChild(
        del
      );


      element.appendChild(
        item
      );

    }
  );

}

async function uploadPdf(file) {

  if (!authToken) {

    throw new Error(
      "Oturum açman gerekiyor."
    );

  }


  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        headers: {

          "Authorization":
            `Bearer ${authToken}`

        },

        body:
          formData

      }
    );


  if (
    response.status ===
    401
  ) {

    await forceLogout();

    throw new Error(
      "Oturum süren dolmuş. Tekrar giriş yap."
    );

  }


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(

      data.details ||
      data.error ||
      "PDF yüklenemedi."

    );

  }


  if (
    !data.success ||
    !data.text
  ) {

    throw new Error(

      data.error ||
      "PDF'den metin çıkarılamadı."

    );

  }


  return {

    name:
      data.name ||
      file.name,

    text:
      data.text

  };

}

      alert(
        "PDF 25 MB'dan büyük olamaz."

    }


    selectedPdf =
      file;


    updateFileUI();


    const desktopName =
      document.getElementById(

    const mobileName =

    desktopName.textContent =

    try {

      const result =
        await uploadPdf(
          file
        );


      documentData =
        result;


      const chat =
        getActiveChat();


      if (chat) {

        chat.document = {

              500000
            )

        chat.updatedAt =

      desktopName.textContent =
        result.name +
        " ✓";


      mobileName.textContent =
        result.name +
        " ✓";


      focusInput();


    } catch (error) {

      console.log(
        "PDF error:",
        error
      );


      if (
        error.message !==
        "Oturum süren dolmuş. Tekrar giriş yap."
      ) {

        alert(

          "PDF okunurken hata oluştu:\n\n" +
          (
            error.message ||
            "Bilinmeyen hata"
          )

        );

      }


      clearSelectedFile();

    }

  }
);

/* ==========================================
   MESAJ GÖNDER
========================================== */

async function sendMessage() {

  if (sending) {
    return;
  }


  if (!authToken) {

    showAuthScreen();

    return;

  }


  const input =
    getInput();


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  const chat =
    getActiveChat();


  if (!chat) {
    return;
  }


  sending = true;


  chat.messages.push({

    role:
      "user",

    content:
      text,

    time:
      Date.now()

  });


  updateTitle(
    chat,
    text
  );


  chat.updatedAt =
    Date.now();


  saveChats();

  queueCloudSave(chat);


  setInput("");


  renderAll();

  showTyping();


  try {

    let documentForAI =
      null;


    if (
      chat.document &&
      chat.document.text
    ) {

      documentForAI = {

        name:
          chat.document.name,

        text:
          chat.document.text.slice(
            0,
            500000
          )

      };

    }


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${authToken}`

          },

          body:
            JSON.stringify({

              /*
                Worker artık userId'yi
                token üzerinden alıyor.
              */

              memory:
                globalMemory,

              messages:
                chat.messages.slice(
                  -20
                ),

              document:
                documentForAI

            })

        }
      );


    let data = {};
    let rawResponse = "";

    try {
      rawResponse = await response.text();

      if (rawResponse) {
        try {
          data = JSON.parse(rawResponse);
        } catch (parseError) {
          data = {};
        }
      }
    } catch (readError) {
      console.log("Response read error:", readError);
    }


    /* =============================
       OTURUM GEÇERSİZ
    ============================= */

    if (
      response.status ===
      401
    ) {

      hideTyping();

      sending = false;

      await forceLogout();

      alert(
        "Oturum süren dolmuş. Lütfen tekrar giriş yap."
      );

      return;

    }


    if (!response.ok) {

      const serverMessage =
        data.details ||
        data.error ||
        rawResponse ||
        "Sunucu hatası.";

      throw new Error(
        `HTTP ${response.status} ${response.statusText || ""}\n${serverMessage}`.trim()
      );

    }


    /* =============================
       HAFIZA
    ============================= */

    if (data.memory) {

      globalMemory = {

        name:
          data.memory.name ||
          globalMemory.name ||
          "",

        facts:
          Array.isArray(
            data.memory.facts
          )
            ? data.memory.facts
            : globalMemory.facts,

        preferences:
          Array.isArray(
            data.memory.preferences
          )
            ? data.memory.preferences
            : globalMemory.preferences

      };


      saveMemory();

    }


    /* =============================
       CEVAP
    ============================= */

    let reply =
      data.reply;


    if (!reply) {

      const debugInfo =
        data.error ||
        data.details ||
        rawResponse ||
        "Worker 200 döndürdü ama 'reply' alanı gelmedi.";

      reply =
        `⚠️ Zatoi cevap üretemedi.\n\n${debugInfo}`;

    }


    const sources =
      normalizeSources(
        data.sources
      );


    const cleanReply =
      stripWorkerSourceList(
        reply,
        sources
      );


    chat.messages.push({

      role:
        "assistant",

      content:
        cleanReply || reply,

      sources,

      searchedWeb:
        !!data.searchedWeb,

      time:
        Date.now()

    });


    chat.updatedAt =
      Date.now();


    saveChats();

    queueCloudSave(chat);


    hideTyping();

    renderAll();


    if (
      voiceOutputEnabled
    ) {

      speakText(
        reply
      );

    }


  } catch (error) {

    console.log(
      "Chat error:",
      error
    );


    hideTyping();


    const errorText =
      error && error.message
        ? error.message
        : String(error || "Bilinmeyen hata");

    chat.messages.push({

      role:
        "assistant",

      content:
        `⚠️ Hata oluştu:\n\n${errorText}`,

      time:
        Date.now()

    });


    chat.updatedAt =
      Date.now();

    saveChats();

    queueCloudSave(chat);

    renderAll();

  }


  sending = false;

  focusInput();

}

    createNewChat;


/* ==========================================
   SESLİ KONUŞMA
========================================== */

let recognition =
  null;

let isListening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "tr-TR";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      isListening =
        true;

      updateMic();

    };


  recognition.onend =
    () => {

      isListening =
        false;

      updateMic();

    };


  recognition.onresult =
    event => {

      let finalText =
        "";


      let interimText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript;


        if (
          event.results[i]
            .isFinal
        ) {

          finalText +=
            transcript;

        } else {

          interimText +=
            transcript;

        }

      }


      if (
        finalText.trim()
      ) {

        setInput(
          finalText.trim()
        );

        sendMessage();

      } else if (
        interimText.trim()
      ) {

        setInput(
          interimText
        );

      }

    };

}


function updateMic() {

  const buttons = [

    document.getElementById(
      "micButton"
    ),

    document.getElementById(
      "mobileMicButton"
    )

  ];


  buttons.forEach(
    button => {

      if (!button) {
        return;
      }


      if (isListening) {

        button.textContent =
          "⏹️";

        button.setAttribute(
          "aria-label",
          "Sesli mesajı durdur"
        );

        button.classList.add(
          "active"
        );

      } else {

        button.textContent =
          "🎤";

        button.setAttribute(
          "aria-label",
          "Sesli mesaj başlat"
        );

        button.classList.remove(
          "active"
        );

      }

    }
  );

}


function toggleMic() {

  if (!recognition) {

    alert(
      "Bu tarayıcı sesli konuşmayı desteklemiyor. Chrome kullanmayı dene."
    );

    return;

  }


  if (isListening) {

    recognition.stop();

  } else {

    try {

      recognition.start();

    } catch (error) {

      console.log(
        error
      );

    }

  }

}


document
  .getElementById(
    "micButton"
  )
  .onclick =
    toggleMic;


document
  .getElementById(
    "mobileMicButton"
  )
  .onclick =
    toggleMic;


/* ==========================================
   SESLİ CEVAP
========================================== */

let voiceOutputEnabled =
  true;


try {

  const saved =
    localStorage.getItem(
      VOICE_OUTPUT_KEY
    );


  if (
    saved !== null
  ) {

    voiceOutputEnabled =
      saved === "true";

  }

} catch (error) {}


function updateVoiceButton() {

  const icon =
    voiceOutputEnabled
      ? "🔊"
      : "🔇";


  const desktopVoiceButton =
    document.getElementById(
      "voiceToggle"
    );

  desktopVoiceButton.textContent =
    icon;

  desktopVoiceButton.setAttribute(
    "aria-pressed",
    String(voiceOutputEnabled)
  );

  desktopVoiceButton.setAttribute(
    "aria-label",
    voiceOutputEnabled
      ? "Sesli cevapları kapat"
      : "Sesli cevapları aç"
  );


  const mobileVoiceButton =
    document.getElementById(
      "mobileVoiceToggle"
    );

  mobileVoiceButton.textContent =
    icon;

  mobileVoiceButton.setAttribute(
    "aria-pressed",
    String(voiceOutputEnabled)
  );

  mobileVoiceButton.setAttribute(
    "aria-label",
    voiceOutputEnabled
      ? "Sesli cevapları kapat"
      : "Sesli cevapları aç"
  );

}


function stopSpeaking() {

  if (
    "speechSynthesis" in
    window
  ) {

    speechSynthesis.cancel();

  }

}


function speakText(text) {

  if (
    !voiceOutputEnabled ||
    !("speechSynthesis" in window)
  ) {

    return;

  }


  stopSpeaking();


  const chunks = [];

  let current = "";


  const sentences =
    text.split(
      /(?<=[.!?])\s+/
    );


  sentences.forEach(
    sentence => {

      if (
        current.length +
        sentence.length >
        220
      ) {

        if (
          current.trim()
        ) {

          chunks.push(
            current.trim()
          );

        }


        current =
          sentence;

      } else {

        current +=
          " " +
          sentence;

      }

    }
  );


  if (
    current.trim()
  ) {

    chunks.push(
      current.trim()
    );

  }


  let index =
    0;


  function next() {

    if (
      index >=
      chunks.length
    ) {

      return;

    }


    const utterance =
      new SpeechSynthesisUtterance(
        chunks[index]
      );


    utterance.lang =
      "tr-TR";


    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    utterance.onend =
      () => {

        index++;

        next();

      };


    speechSynthesis.speak(
      utterance
    );

  }


  next();

}


function toggleVoice() {

  voiceOutputEnabled =
    !voiceOutputEnabled;


  if (
    !voiceOutputEnabled
  ) {

    stopSpeaking();

  }


  localStorage.setItem(

    VOICE_OUTPUT_KEY,

    String(
      voiceOutputEnabled
    )

  );


  updateVoiceButton();

}


document
  .getElementById(
    "voiceToggle"
  )
  .onclick =
    toggleVoice;


document
  .getElementById(
    "mobileVoiceToggle"
  )
  .onclick =
    toggleVoice;


updateVoiceButton();


/* ==========================================
   MOBİL GEÇMİŞ
========================================== */

function openMobileHistory() {

  document
    .getElementById(
      "mobileHistoryOverlay"
    )
    .classList.add(
      "show"
    );

}


function closeMobileHistory() {

  document
    .getElementById(
      "mobileHistoryOverlay"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "mobileHistoryButton"
  )
  .onclick =
    openMobileHistory;


document
  .getElementById(
    "closeHistoryButton"
  )
  .onclick =
    closeMobileHistory;


document
  .getElementById(
    "mobileHistoryOverlay"
  )
  .onclick =
    event => {

      if (
        event.target.id ===
        "mobileHistoryOverlay"
      ) {

        closeMobileHistory();

      }

    };

  }
);

========================================== */

  renderMessages();

  renderHistory();

}

========================================== */

    navigator.serviceWorker

        console.log(

        );

      })
      .catch(error => {

          "Zatoi Service Worker hatası:",
          error
        );

      });

  });

}
