<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0d12;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      background: #0b0d12;
    }

    .chat-column {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-top {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #20242d;
      background: #10131a;
    }

    .chat-title {
      font-size: 17px;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      cursor: pointer;
      color: #fff;
    }

    .new-chat-btn,
    .mobile-history-btn {
      background: #1a1f29;
      border: 1px solid #2a303b;
      border-radius: 10px;
      padding: 9px 12px;
    }

    .new-chat-btn:hover,
    .mobile-history-btn:hover {
      background: #242a35;
    }

    .mobile-history-btn {
      display: none;
    }

    .desktop-input-area {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #20242d;
      background: #0f1218;
    }

    .input-box {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #171b23;
      border: 1px solid #2a303b;
      border-radius: 14px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      padding: 9px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: #858c99;
    }

    .voice-btn,
    .file-btn,
    .action-btn {
      height: 42px;
      min-width: 42px;
      border-radius: 10px;
      background: #242a35;
      border: 1px solid #303744;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .voice-btn:hover,
    .file-btn:hover {
      background: #303744;
    }

    .send-btn {
      background: #ffffff;
      color: #111318;
      font-weight: 700;
      min-width: 70px;
    }

    .send-btn:hover {
      background: #e7e7e7;
    }

    .send-btn:disabled,
    .voice-btn:disabled,
    .file-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(760px, 85%);
      padding: 11px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .message.user {
      background: #ffffff;
      color: #111318;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #191e27;
      border: 1px solid #292f3a;
      border-bottom-left-radius: 5px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      color: #aeb5c1;
      padding: 30px;
    }

    .welcome h1 {
      color: #fff;
      margin-bottom: 8px;
    }

    .typing-row {
      display: flex;
      justify-content: flex-start;
    }

    .typing {
      background: #191e27;
      border: 1px solid #292f3a;
      border-radius: 14px;
      padding: 10px 14px;
      color: #aeb5c1;
    }

    .side-panel {
      width: 290px;
      height: 100%;
      flex-shrink: 0;
      border-left: 1px solid #20242d;
      background: #10131a;
      display: flex;
      flex-direction: column;
    }

    .side-header {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #20242d;
      font-weight: 700;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .history-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: #171b23;
      border: 1px solid #252b35;
      border-radius: 9px;
      padding: 10px;
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-open:hover {
      background: #222833;
    }

    .history-delete {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #1c2028;
      color: #aaa;
    }

    .history-delete:hover {
      background: #30252a;
      color: #fff;
    }

    .mobile-input-area {
      display: none;
    }

    .file-info {
      display: none;
      margin: 0 16px 8px;
      padding: 9px 12px;
      background: #171b23;
      border: 1px solid #2a303b;
      border-radius: 10px;
      color: #cbd1db;
      font-size: 13px;
    }

    .file-info.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .file-info-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-remove {
      background: transparent;
      color: #aaa;
      font-size: 16px;
    }

    .listening {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }

      100% {
        opacity: 1;
      }
    }

    @media (max-width: 800px) {

      html,
      body {
        overflow: hidden;
      }

      .app {
        display: block;
      }

      .chat-column {
        width: 100%;
        height: 100vh;
      }

      .chat-top {
        height: 58px;
        padding: 0 12px;
      }

      .new-chat-btn {
        padding: 8px 10px;
        font-size: 13px;
      }

      .mobile-history-btn {
        display: block;
        padding: 8px 10px;
        font-size: 13px;
      }

      .desktop-input-area {
        display: none;
      }

      .messages {
        padding: 14px 10px 95px;
      }

      .message {
        max-width: 90%;
      }

      .side-panel {
        display: none;
        position: fixed;
        z-index: 100;
        top: 0;
        right: 0;
        width: 85%;
        max-width: 330px;
        height: 100vh;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4);
      }

      .side-panel.open {
        display: flex;
      }

      .mobile-input-area {
        position: fixed;
        z-index: 50;
        left: 0;
        right: 0;
        bottom: 0;
        display: block;
        padding: 8px;
        background: rgba(15, 18, 24, 0.98);
        border-top: 1px solid #20242d;
      }

      .mobile-input-area .input-box {
        padding: 6px;
      }

      .mobile-input-area textarea {
        max-height: 110px;
      }

      .mobile-input-area .send-btn {
        min-width: 58px;
        padding: 0 9px;
      }

      .mobile-input-area .voice-btn,
      .mobile-input-area .file-btn {
        min-width: 38px;
        width: 38px;
        padding: 0;
      }

      .file-info {
        margin: 0 8px 7px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <section class="chat-column">

      <div class="chat-top">

        <div id="chatTitle" class="chat-title">
          Yeni Sohbet
        </div>

        <div class="top-actions">

          <button
            class="mobile-history-btn"
            id="mobileHistoryButton">
            📚 Geçmiş
          </button>

          <button
            class="new-chat-btn"
            id="newChatButton">
            ➕ Yeni Sohbet
          </button>

        </div>

      </div>


      <!-- PC DOSYA / MESAJ ALANI -->

      <div class="desktop-input-area">

        <div
          id="desktopFileInfo"
          class="file-info">

          <span
            id="desktopFileName"
            class="file-info-name">
          </span>

          <button
            id="desktopRemoveFile"
            class="file-remove">
            ✕
          </button>

        </div>

        <div class="input-box">

          <textarea
            id="desktopInput"
            rows="1"
            placeholder="Zatoi'ye bir şey sor..."></textarea>

          <input
            id="desktopFileInput"
            type="file"
            accept="application/pdf,.pdf"
            hidden>

          <button
            id="desktopFileButton"
            class="file-btn"
            title="PDF yükle">
            📎
          </button>

          <button
            id="micButton"
            class="voice-btn"
            title="Sesli giriş">
            🎤
          </button>

          <button
            id="voiceToggle"
            class="voice-btn"
            title="Sesli cevap">
            🔊
          </button>

          <button
            id="sendButton"
            class="action-btn send-btn">
            Gönder
          </button>

        </div>

      </div>


      <!-- MESAJLAR -->

      <div id="messages" class="messages"></div>


      <!-- MOBİL MESAJ / DOSYA ALANI -->

      <div class="mobile-input-area">

        <div
          id="mobileFileInfo"
          class="file-info">

          <span
            id="mobileFileName"
            class="file-info-name">
          </span>

          <button
            id="mobileRemoveFile"
            class="file-remove">
            ✕
          </button>

        </div>

        <div class="input-box">

          <textarea
            id="mobileInput"
            rows="1"
            placeholder="Zatoi'ye bir şey sor..."></textarea>

          <input
            id="mobileFileInput"
            type="file"
            accept="application/pdf,.pdf"
            hidden>

          <button
            id="mobileFileButton"
            class="file-btn"
            title="PDF yükle">
            📎
          </button>

          <button
            id="micButtonMobile"
            class="voice-btn"
            title="Sesli giriş">
            🎤
          </button>

          <button
            id="voiceToggleMobile"
            class="voice-btn"
            title="Sesli cevap">
            🔊
          </button>

          <button
            id="sendButtonMobile"
            class="action-btn send-btn">
            Gönder
          </button>

        </div>

      </div>

    </section>


    <!-- GEÇMİŞ -->

    <aside class="side-panel">

      <div class="side-header">
        💬 Zatoi Sohbetleri
      </div>

      <div
        id="historyList"
        class="history-list">
      </div>

    </aside>

  </div>


  <script>

    /* =====================================================
       AYARLAR
    ===================================================== */

    const WORKER_URL =
      "https://zatoi-ai.fbboytr.workers.dev/";


    const CHATS_KEY =
      "zatoi_chats_v6";

    const ACTIVE_CHAT_KEY =
      "zatoi_active_chat_v6";

    const GLOBAL_MEMORY_KEY =
      "zatoi_global_memory_v6";

    const VOICE_OUTPUT_KEY =
      "zatoi_voice_output_v1";


    /* =====================================================
       DOM
    ===================================================== */

    const messagesElement =
      document.getElementById("messages");

    const historyList =
      document.getElementById("historyList");

    const chatTitle =
      document.getElementById("chatTitle");


    const desktopInput =
      document.getElementById("desktopInput");

    const mobileInput =
      document.getElementById("mobileInput");


    const sendButton =
      document.getElementById("sendButton");

    const sendButtonMobile =
      document.getElementById("sendButtonMobile");


    const micButton =
      document.getElementById("micButton");

    const micButtonMobile =
      document.getElementById("micButtonMobile");


    const voiceToggle =
      document.getElementById("voiceToggle");

    const voiceToggleMobile =
      document.getElementById("voiceToggleMobile");


    const newChatButton =
      document.getElementById("newChatButton");

    const mobileHistoryButton =
      document.getElementById("mobileHistoryButton");


    /* =====================================================
       DOSYA ELEMANLARI
    ===================================================== */

    const desktopFileInput =
      document.getElementById("desktopFileInput");

    const mobileFileInput =
      document.getElementById("mobileFileInput");


    const desktopFileButton =
      document.getElementById("desktopFileButton");

    const mobileFileButton =
      document.getElementById("mobileFileButton");


    const desktopFileInfo =
      document.getElementById("desktopFileInfo");

    const mobileFileInfo =
      document.getElementById("mobileFileInfo");


    const desktopFileName =
      document.getElementById("desktopFileName");

    const mobileFileName =
      document.getElementById("mobileFileName");


    const desktopRemoveFile =
      document.getElementById("desktopRemoveFile");

    const mobileRemoveFile =
      document.getElementById("mobileRemoveFile");


    /* =====================================================
       HAFIZA
    ===================================================== */

    let globalMemory = {
      name: "",
      facts: [],
      preferences: []
    };


    try {

      const savedMemory =
        localStorage.getItem(
          GLOBAL_MEMORY_KEY
        );

      if (savedMemory) {

        globalMemory =
          JSON.parse(savedMemory);

      }

    } catch (error) {

      console.log(
        "Hafıza okunamadı:",
        error
      );

    }


    function saveMemory() {

      localStorage.setItem(
        GLOBAL_MEMORY_KEY,
        JSON.stringify(globalMemory)
      );

    }


    /* =====================================================
       SOHBETLER
    ===================================================== */

    let chats = [];

    let activeChatId = null;


    try {

      const savedChats =
        localStorage.getItem(CHATS_KEY);

      if (savedChats) {

        chats =
          JSON.parse(savedChats);

      }

    } catch (error) {

      chats = [];

    }


    try {

      activeChatId =
        localStorage.getItem(
          ACTIVE_CHAT_KEY
        );

    } catch (error) {

      activeChatId = null;

    }


    function createChat() {

      return {

        id:
          Date.now().toString(),

        title:
          "Yeni Sohbet",

        messages:
          []

      };

    }


    function getActiveChat() {

      return chats.find(
        chat =>
          chat.id === activeChatId
      );

    }


    function saveChats() {

      localStorage.setItem(
        CHATS_KEY,
        JSON.stringify(chats)
      );

      if (activeChatId) {

        localStorage.setItem(
          ACTIVE_CHAT_KEY,
          activeChatId
        );

      }

    }


    function ensureChat() {

      if (!chats.length) {

        const chat =
          createChat();

        chats.push(chat);

        activeChatId =
          chat.id;

        saveChats();

        return;

      }


      if (
        !activeChatId ||
        !getActiveChat()
      ) {

        activeChatId =
          chats[0].id;

        saveChats();

      }

    }


    ensureChat();


    /* =====================================================
       MOBİL KONTROL
    ===================================================== */

    function isMobile() {

      return window.innerWidth <= 800;

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollToBottom() {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    function scrollToTop() {

      messagesElement.scrollTop = 0;

    }


    /* =====================================================
       MESAJLARI GÖSTER
    ===================================================== */

    function renderMessages() {

      messagesElement.innerHTML = "";

      const chat =
        getActiveChat();


      if (
        !chat ||
        chat.messages.length === 0
      ) {

        messagesElement.innerHTML = `

          <div class="welcome">

            <h1>Zatoi AI 🤖</h1>

            <p>
              Merhaba! Ben Zatoi.
              <br>
              Sana nasıl yardımcı olabilirim?
            </p>

          </div>

        `;

        return;

      }


      let messagesToShow;


      if (isMobile()) {

        messagesToShow =
          [...chat.messages];

      } else {

        messagesToShow =
          [...chat.messages]
            .reverse();

      }


      messagesToShow.forEach(
        message => {

          if (
            message.role !== "user" &&
            message.role !== "assistant"
          ) {

            return;

          }


          const row =
            document.createElement(
              "div"
            );

          row.className =
            "message-row " +
            message.role;


          const bubble =
            document.createElement(
              "div"
            );

          bubble.className =
            "message " +
            message.role;

          bubble.textContent =
            message.content;


          row.appendChild(
            bubble
          );

          messagesElement.appendChild(
            row
          );

        }
      );


      if (isMobile()) {

        scrollToBottom();

      } else {

        scrollToTop();

      }

    }


    /* =====================================================
       GEÇMİŞİ GÖSTER
    ===================================================== */

    function renderHistory() {

      historyList.innerHTML = "";


      [...chats]
        .reverse()
        .forEach(chat => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "history-item";


          const openButton =
            document.createElement(
              "button"
            );

          openButton.className =
            "history-open";

          openButton.textContent =
            chat.title ||
            "Yeni Sohbet";


          openButton.onclick =
            () => {

              activeChatId =
                chat.id;

              saveChats();

              stopSpeaking();

              renderAll();

              if (isMobile()) {

                document
                  .querySelector(
                    ".side-panel"
                  )
                  .classList.remove(
                    "open"
                  );

              }

            };


          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.className =
            "history-delete";

          deleteButton.textContent =
            "✕";


          deleteButton.onclick =
            event => {

              event.stopPropagation();

              chats =
                chats.filter(
                  item =>
                    item.id !==
                    chat.id
                );


              if (
                activeChatId ===
                chat.id
              ) {

                if (chats.length) {

                  activeChatId =
                    chats[
                      chats.length - 1
                    ].id;

                } else {

                  const newChat =
                    createChat();

                  chats.push(
                    newChat
                  );

                  activeChatId =
                    newChat.id;

                }

              }


              saveChats();

              stopSpeaking();

              renderAll();

            };


          item.appendChild(
            openButton
          );

          item.appendChild(
            deleteButton
          );

          historyList.appendChild(
            item
          );

        });

    }


    /* =====================================================
       BAŞLIK
    ===================================================== */

    function updateTitle() {

      const chat =
        getActiveChat();

      if (!chat) {

        chatTitle.textContent =
          "Yeni Sohbet";

        return;

      }

      chatTitle.textContent =
        chat.title ||
        "Yeni Sohbet";

    }


    /* =====================================================
       HER ŞEYİ YENİLE
    ===================================================== */

    function renderAll() {

      updateTitle();

      renderHistory();

      renderMessages();

    }


    /* =====================================================
       YENİ SOHBET
    ===================================================== */

    function startNewChat() {

      stopSpeaking();

      const chat =
        createChat();

      chats.push(chat);

      activeChatId =
        chat.id;

      saveChats();

      clearSelectedFile();

      desktopInput.value = "";

      mobileInput.value = "";

      renderAll();

      if (isMobile()) {

        mobileInput.focus();

      } else {

        desktopInput.focus();

      }

    }


    newChatButton.onclick =
      startNewChat;


    /* =====================================================
       MOBİL GEÇMİŞ
    ===================================================== */

    mobileHistoryButton.onclick =
      () => {

        const panel =
          document.querySelector(
            ".side-panel"
          );

        panel.classList.toggle(
          "open"
        );

      };


    /* =====================================================
       DOSYA
    ===================================================== */

    let selectedFile = null;


    function showSelectedFile(file) {

      selectedFile =
        file;


      desktopFileName.textContent =
        "📄 " + file.name;

      mobileFileName.textContent =
        "📄 " + file.name;


      desktopFileInfo.classList.add(
        "show"
      );

      mobileFileInfo.classList.add(
        "show"
      );

    }


    function clearSelectedFile() {

      selectedFile = null;


      desktopFileInput.value = "";

      mobileFileInput.value = "";


      desktopFileInfo.classList.remove(
        "show"
      );

      mobileFileInfo.classList.remove(
        "show"
      );

      desktopFileName.textContent =
        "";

      mobileFileName.textContent =
        "";

    }


    function handleFile(file) {

      if (!file) {
        return;
      }


      const isPdf =
        file.type ===
          "application/pdf" ||
        file.name
          .toLowerCase()
          .endsWith(".pdf");


      if (!isPdf) {

        alert(
          "Şimdilik yalnızca PDF dosyaları destekleniyor."
        );

        return;

      }


      showSelectedFile(file);

    }


    desktopFileButton.onclick =
      () => {

        desktopFileInput.click();

      };


    mobileFileButton.onclick =
      () => {

        mobileFileInput.click();

      };


    desktopFileInput.onchange =
      () => {

        handleFile(
          desktopFileInput.files[0]
        );

      };


    mobileFileInput.onchange =
      () => {

        handleFile(
          mobileFileInput.files[0]
        );

      };


    desktopRemoveFile.onclick =
      clearSelectedFile;


    mobileRemoveFile.onclick =
      clearSelectedFile;


    /* =====================================================
       YAZI ALANLARI
    ===================================================== */

    function resizeTextarea(textarea) {

      textarea.style.height =
        "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          150
        ) + "px";

    }


    desktopInput.addEventListener(
      "input",
      () => {

        resizeTextarea(
          desktopInput
        );

      }
    );


    mobileInput.addEventListener(
      "input",
      () => {

        resizeTextarea(
          mobileInput
        );

      }
    );


    /* =====================================================
       TYPING
    ===================================================== */

    function showTyping() {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "typing-row";

      row.id =
        "typingIndicator";


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "typing";

      bubble.textContent =
        "Zatoi yazıyor...";


      row.appendChild(
        bubble
      );


      if (isMobile()) {

        messagesElement.appendChild(
          row
        );

        scrollToBottom();

      } else {

        messagesElement.insertBefore(
          row,
          messagesElement.firstChild
        );

        scrollToTop();

      }

    }


    function hideTyping() {

      const typing =
        document.getElementById(
          "typingIndicator"
        );

      if (typing) {

        typing.remove();

      }

    }


    /* =====================================================
       PDF'Yİ WORKER'A GÖNDER
    ===================================================== */

    async function uploadPdf(file) {

      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "memory",
        JSON.stringify(
          globalMemory
        )
      );


      formData.append(
        "messages",
        JSON.stringify(
          []
        )
      );


      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",
            body: formData
          }
        );


      if (!response.ok) {

        throw new Error(
          "PDF gönderilemedi."
        );

      }


      const data =
        await response.json();


      if (
        !data.success ||
        !data.text
      ) {

        throw new Error(
          data.error ||
          "PDF okunamadı."
        );

      }


      return {

        name:
          data.name ||
          file.name,

        text:
          data.text

      };

    }


    /* =====================================================
       MESAJ GÖNDER
    ===================================================== */

    async function sendMessage(
      customInput = null
    ) {

      const input =
        customInput ||
        (
          isMobile()
            ? mobileInput
            : desktopInput
        );


      const text =
        input.value.trim();


      if (
        !text &&
        !selectedFile
      ) {

        return;

      }


      const chat =
        getActiveChat();


      if (!chat) {
        return;
      }


      /*
      -----------------------------------------------------
      PDF VARSA ÖNCE OKU
      -----------------------------------------------------
      */

      let documentData =
        null;


      if (selectedFile) {

        try {

          setSendingState(true);

          showTyping();


          documentData =
            await uploadPdf(
              selectedFile
            );


          hideTyping();

          setSendingState(false);


        } catch (error) {

          hideTyping();

          setSendingState(false);

          alert(
            error.message ||
            "PDF okunamadı."
          );

          return;

        }

      }


      /*
      -----------------------------------------------------
      KULLANICI MESAJI
      -----------------------------------------------------
      */

      let userContent =
        text;


      if (
        documentData &&
        !text
      ) {

        userContent =
          `📄 ${documentData.name} yüklendi.`;

      }


      chat.messages.push({

        role:
          "user",

        content:
          userContent

      });


      /*
      -----------------------------------------------------
      BAŞLIK
      -----------------------------------------------------
      */

      if (
        chat.title ===
        "Yeni Sohbet"
      ) {

        const titleSource =
          text ||
          documentData?.name ||
          "Yeni Sohbet";


        chat.title =
          titleSource.length > 35
            ? titleSource.slice(
                0,
                35
              ) + "..."
            : titleSource;

      }


      input.value = "";

      resizeTextarea(input);


      /*
      -----------------------------------------------------
      DOSYAYI TEMİZLE
      -----------------------------------------------------
      */

      clearSelectedFile();


      saveChats();

      renderAll();


      /*
      -----------------------------------------------------
      AI'YA GÖNDERİLECEK MESAJLAR
      -----------------------------------------------------
      */

      let messagesForAI =
        chat.messages;


      if (documentData) {

        /*
        PDF içeriğini sadece bu isteğe
        bağlam olarak ekliyoruz.
        */

        messagesForAI = [

          ...chat.messages,

          {

            role:
              "user",

            content:
              `Yüklenen PDF dosyası: ${documentData.name}

PDF içeriği:

${documentData.text}

Bu PDF'yi mevcut konuşmada kaynak olarak kullan. Kullanıcı PDF hakkında soru sorarsa içeriğe göre cevap ver.`

          }

        ];

      }


      const recentMessages =
        messagesForAI.slice(-20);


      /*
      -----------------------------------------------------
      TYPING
      -----------------------------------------------------
      */

      showTyping();

      setSendingState(true);


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  memory:
                    globalMemory,

                  messages:
                    recentMessages

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Sunucu hatası oluştu."
          );

        }


        /*
        ---------------------------------------------------
        HAFIZA
        ---------------------------------------------------
        */

        if (data.memory) {

          globalMemory = {

            name:
              data.memory.name ||
              globalMemory.name ||
              "",

            facts:
              Array.isArray(
                data.memory.facts
              )
                ? data.memory.facts
                : globalMemory.facts,

            preferences:
              Array.isArray(
                data.memory.preferences
              )
                ? data.memory.preferences
                : globalMemory.preferences

          };


          saveMemory();

        }


        /*
        ---------------------------------------------------
        CEVAP
        ---------------------------------------------------
        */

        let reply =
          data.reply;


        if (
          !reply &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message
        ) {

          reply =
            data
              .choices[0]
              .message
              .content;

        }


        if (!reply) {

          reply =
            "Üzgünüm, şu anda cevap oluşturamadım.";

        }


        /*
        ---------------------------------------------------
        PDF İÇERİĞİ KALICI MESAJ OLARAK EKLENMİYOR
        ---------------------------------------------------
        */

        chat.messages.push({

          role:
            "assistant",

          content:
            reply

        });


        saveChats();

        hideTyping();

        setSendingState(false);

        renderAll();


        /*
        ---------------------------------------------------
        SESLİ CEVAP
        ---------------------------------------------------
        */

        if (
          voiceOutputEnabled
        ) {

          speakText(reply);

        }


      } catch (error) {

        console.log(
          "Mesaj gönderme hatası:",
          error
        );


        hideTyping();

        setSendingState(false);


        chat.messages.push({

          role:
            "assistant",

          content:
            "Üzgünüm, şu anda bağlantıda bir sorun oluştu."

        });


        saveChats();

        renderAll();

      }

    }


    /* =====================================================
       GÖNDERME DURUMU
    ===================================================== */

    function setSendingState(
      state
    ) {

      sendButton.disabled =
        state;

      sendButtonMobile.disabled =
        state;

      desktopFileButton.disabled =
        state;

      mobileFileButton.disabled =
        state;

    }


    /* =====================================================
       BUTONLAR
    ===================================================== */

    sendButton.onclick =
      () => {

        sendMessage(
          desktopInput
        );

      };


    sendButtonMobile.onclick =
      () => {

        sendMessage(
          mobileInput
        );

      };


    /* =====================================================
       ENTER
    ===================================================== */

    desktopInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage(
            desktopInput
          );

        }

      }
    );


    mobileInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage(
            mobileInput
          );

        }

      }
    );


    /* =====================================================
       SESLİ ÇIKIŞ
    ===================================================== */

    let voiceOutputEnabled =
      true;


    try {

      const savedVoice =
        localStorage.getItem(
          VOICE_OUTPUT_KEY
        );

      if (
        savedVoice !== null
      ) {

        voiceOutputEnabled =
          savedVoice === "true";

      }

    } catch (error) {

      voiceOutputEnabled =
        true;

    }


    function updateVoiceButtons() {

      const icon =
        voiceOutputEnabled
          ? "🔊"
          : "🔇";


      voiceToggle.textContent =
        icon;

      voiceToggleMobile.textContent =
        icon;

    }


    function stopSpeaking() {

      if (
        "speechSynthesis"
        in window
      ) {

        speechSynthesis.cancel();

      }

    }


    function speakText(text) {

      if (
        !voiceOutputEnabled ||
        !(
          "speechSynthesis"
          in window
        )
      ) {

        return;

      }


      stopSpeaking();


      const cleanText =
        String(text || "")
          .trim();


      if (!cleanText) {
        return;
      }


      /*
      Uzun cevapları parçalara böl.
      */

      const chunks = [];


      for (
        let i = 0;
        i < cleanText.length;
        i += 220
      ) {

        chunks.push(
          cleanText.slice(
            i,
            i + 220
          )
        );

      }


      let index = 0;


      function speakNext() {

        if (
          index >=
          chunks.length
        ) {

          return;

        }


        const utterance =
          new SpeechSynthesisUtterance(
            chunks[index]
          );


        utterance.lang =
          "tr-TR";

        utterance.rate =
          1.0;

        utterance.pitch =
          1.0;

        utterance.volume =
          1.0;


        utterance.onend =
          () => {

            index++;

            speakNext();

          };


        speechSynthesis.speak(
          utterance
        );

      }


      speakNext();

    }


    function toggleVoiceOutput() {

      voiceOutputEnabled =
        !voiceOutputEnabled;


      localStorage.setItem(
        VOICE_OUTPUT_KEY,
        String(
          voiceOutputEnabled
        )
      );


      updateVoiceButtons();


      if (
        !voiceOutputEnabled
      ) {

        stopSpeaking();

      }

    }


    voiceToggle.onclick =
      toggleVoiceOutput;


    voiceToggleMobile.onclick =
      toggleVoiceOutput;


    updateVoiceButtons();


    /* =====================================================
       SESLİ GİRİŞ
    ===================================================== */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition =
      null;


    let isListening =
      false;


    function getActiveInput() {

      return isMobile()
        ? mobileInput
        : desktopInput;

    }


    function setMicVisual(
      listening
    ) {

      const icon =
        listening
          ? "⏹️"
          : "🎤";


      micButton.textContent =
        icon;

      micButtonMobile.textContent =
        icon;


      if (listening) {

        micButton.classList.add(
          "listening"
        );

        micButtonMobile.classList.add(
          "listening"
        );

      } else {

        micButton.classList.remove(
          "listening"
        );

        micButtonMobile.classList.remove(
          "listening"
        );

      }

    }


    function startRecognition() {

      if (!SpeechRecognition) {

        alert(
          "Bu tarayıcı sesli girişi desteklemiyor. Chrome kullanabilirsin."
        );

        return;

      }


      if (isListening) {

        recognition.stop();

        return;

      }


      recognition =
        new SpeechRecognition();


      recognition.lang =
        "tr-TR";

      recognition.continuous =
        false;

      recognition.interimResults =
        true;


      const input =
        getActiveInput();


      recognition.onstart =
        () => {

          isListening =
            true;

          setMicVisual(
            true
          );

        };


      recognition.onresult =
        event => {

          let transcript =
            "";


          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            transcript +=
              event.results[i][0]
                .transcript;

          }


          input.value =
            transcript;

          resizeTextarea(
            input
          );


          const lastResult =
            event.results[
              event.results.length - 1
            ];


          if (
            lastResult &&
            lastResult.isFinal
          ) {

            setTimeout(
              () => {

                sendMessage(
                  input
                );

              },
              150
            );

          }

        };


      recognition.onerror =
        event => {

          console.log(
            "Ses tanıma hatası:",
            event.error
          );


          if (
            event.error ===
            "not-allowed"
          ) {

            alert(
              "Mikrofon izni verilmedi."
            );

          }

        };


      recognition.onend =
        () => {

          isListening =
            false;

          setMicVisual(
            false
          );

        };


      try {

        recognition.start();

      } catch (error) {

        console.log(
          "Mikrofon başlatılamadı:",
          error
        );

      }

    }


    micButton.onclick =
      startRecognition;


    micButtonMobile.onclick =
      startRecognition;


    /* =====================================================
       PENCERE BOYUTU
    ===================================================== */

    window.addEventListener(
      "resize",
      () => {

        renderMessages();

      }
    );


    /* =====================================================
       BAŞLANGIÇ
    ===================================================== */

    renderAll();

  </script>

</body>
</html>
