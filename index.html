<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1117;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #252936;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #20242f;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid #252936;
      background: #11131a;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      outline: none;
      background: #20242f;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  🤖 Zatoi AI
</header>

<div id="chat">
  <div class="message ai">
    Merhaba! Ben Zatoi AI. 👋
  </div>
</div>

<div class="input-area">
  <input
    id="messageInput"
    type="text"
    placeholder="Zatoi'ye bir şey sor..."
  >

  <button id="sendButton" onclick="sendMessage()">
    Gönder
  </button>
</div>

<script>

const WORKER_URL = "https://zatoi-ai.fbboytr.workers.dev/";

async function sendMessage() {

  const input = document.getElementById("messageInput");
  const button = document.getElementById("sendButton");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (!message) return;

  // Kullanıcı mesajı
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  chat.appendChild(userMessage);

  input.value = "";
  button.disabled = true;

  // Bekleme mesajı
  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent = "Zatoi düşünüyor... 🤔";

  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    aiMessage.textContent = data.reply || "Cevap alınamadı.";

  } catch (error) {

    aiMessage.textContent =
      "Zatoi'ye bağlanırken bir hata oluştu. ❌";

    console.error(error);
  }

  button.disabled = false;
  input.focus();

  chat.scrollTop = chat.scrollHeight;
}


// Enter tuşuyla gönderme

document.getElementById("messageInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
