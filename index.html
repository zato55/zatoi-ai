<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #080c12;
      color: #ffffff;
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      background: #080c12;
    }

    /* =========================
       SOL SOHBET ALANI
    ========================= */

    .chat-column {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b1017;
      position: relative;
    }

    .chat-top {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #0e141c;
      border-bottom: 1px solid #202a36;
    }

    .chat-title {
      max-width: 60%;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .new-chat-btn,
    .mobile-history-btn {
      border: 1px solid #2b3745;
      background: #151d27;
      color: #ffffff;
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .new-chat-btn:hover,
    .mobile-history-btn:hover {
      background: #202b38;
    }

    .mobile-history-btn {
      display: none;
    }

    /* =========================
       PC MESAJ KUTUSU
    ========================= */

    .desktop-input-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 14px;
      background: #0e141c;
      border-bottom: 1px solid #202a36;
    }

    .input-box {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    textarea {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      border: 1px solid #2a3542;
      border-radius: 10px;
      outline: none;
      padding: 11px 12px;
      background: #111923;
      color: #ffffff;
      font-size: 15px;
    }

    textarea::placeholder {
      color: #7d8997;
    }

    textarea:focus {
      border-color: #4b6075;
    }

    .action-btn {
      height: 42px;
      border: none;
      border-radius: 9px;
      padding: 0 15px;
      cursor: pointer;
      font-size: 14px;
      color: white;
    }

    .send-btn {
      background: #2563eb;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .voice-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      border: 1px solid #2a3542;
      border-radius: 9px;
      background: #151d27;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .voice-btn:hover {
      background: #202b38;
    }

    .mic-listening {
      animation: pulseMic 1s infinite;
      background: #7f1d1d;
      border-color: #ef4444;
    }

    @keyframes pulseMic {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    /* =========================
       MESAJLAR
    ========================= */

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 35px auto;
      text-align: center;
      color: #9aa7b5;
    }

    .welcome h1 {
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      line-height: 1.6;
    }

    .message-row {
      width: 100%;
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(760px, 82%);
      padding: 11px 14px;
      border-radius: 13px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #151d27;
      border: 1px solid #25303d;
      color: #e9eef4;
      border-bottom-left-radius: 4px;
    }

    .typing {
      opacity: 0.65;
      font-style: italic;
    }

    /* =========================
       SAĞ PANEL
    ========================= */

    .side-panel {
      width: 310px;
      flex-shrink: 0;
      height: 100%;
      background: #0e141c;
      border-left: 1px solid #202a36;
      display: flex;
      flex-direction: column;
    }

    .side-header {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #202a36;
      font-size: 16px;
      font-weight: 600;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .history-empty {
      color: #74808e;
      font-size: 14px;
      text-align: center;
      padding: 30px 15px;
      line-height: 1.5;
    }

    .history-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .history-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: 1px solid #222d39;
      background: #121923;
      color: #ffffff;
      border-radius: 9px;
      padding: 11px;
      cursor: pointer;
      overflow: hidden;
    }

    .history-open:hover {
      background: #1a2430;
    }

    .history-open.active {
      border-color: #3b82f6;
      background: #182438;
    }

    .history-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-date {
      margin-top: 4px;
      color: #758191;
      font-size: 11px;
    }

    .history-delete {
      width: 34px;
      height: 34px;
      border: 1px solid #2b3541;
      border-radius: 8px;
      background: #151d27;
      color: #b9c2cc;
      cursor: pointer;
    }

    .history-delete:hover {
      background: #3a1c1c;
      color: #ff8d8d;
    }

    /* =========================
       MOBİL
    ========================= */

    @media (max-width: 800px) {
      .app {
        display: block;
      }

      .chat-column {
        width: 100%;
        height: 100vh;
      }

      .side-panel {
        display: none;
      }

      .chat-top {
        height: 56px;
        padding: 0 9px;
      }

      .chat-title {
        max-width: 43%;
        font-size: 14px;
      }

      .top-actions {
        gap: 5px;
      }

      .new-chat-btn,
      .mobile-history-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .mobile-history-btn {
        display: block;
      }

      .desktop-input-area {
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
        background: #0e141c;
        border-top: 1px solid #202a36;
        border-bottom: 0;
      }

      .input-box {
        gap: 5px;
      }

      textarea {
        min-height: 42px;
        font-size: 14px;
        padding: 10px;
      }

      .action-btn {
        padding: 0 11px;
      }

      .voice-btn {
        width: 40px;
        min-width: 40px;
      }

      .messages {
        padding: 15px 12px;
        padding-bottom: 85px;
      }

      .message {
        max-width: 88%;
        font-size: 14px;
      }

      .welcome {
        margin: 25px auto;
      }

      .welcome h1 {
        font-size: 23px;
      }
    }

    /* =========================
       KÜÇÜK TELEFONLAR
    ========================= */

    @media (max-width: 430px) {
      .chat-title {
        max-width: 32%;
      }

      .new-chat-btn,
      .mobile-history-btn {
        font-size: 11px;
        padding: 8px 7px;
      }

      .send-btn {
        padding: 0 9px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SOL TARAF -->
  <section class="chat-column">

    <div class="chat-top">

      <div id="chatTitle" class="chat-title">
        Yeni Sohbet
      </div>

      <div class="top-actions">

        <button
          class="mobile-history-btn"
          id="mobileHistoryButton"
          type="button"
        >
          📚 Geçmiş
        </button>

        <button
          class="new-chat-btn"
          id="newChatButton"
          type="button"
        >
          ➕ Yeni Sohbet
        </button>

      </div>

    </div>

    <!-- PC'DE ÜSTTE, MOBİLDE ALTA SABİT -->
    <div class="desktop-input-area">

      <div class="input-box">

        <textarea
          id="desktopInput"
          rows="1"
          placeholder="Zatoi'ye bir şey sor..."
        ></textarea>

        <button
          id="micButton"
          class="voice-btn"
          type="button"
          title="Sesli konuş"
        >
          🎤
        </button>

        <button
          id="voiceToggle"
          class="voice-btn"
          type="button"
          title="Sesli cevap aç/kapat"
        >
          🔊
        </button>

        <button
          id="sendButton"
          class="action-btn send-btn"
          type="button"
        >
          Gönder
        </button>

      </div>

    </div>

    <!-- MESAJLAR -->
    <div id="messages" class="messages"></div>

  </section>


  <!-- SAĞ TARAF -->
  <aside class="side-panel">

    <div class="side-header">
      💬 Zatoi Sohbetleri
    </div>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </aside>

</div>


<script>
  /* =========================================
     AYARLAR
  ========================================= */

  const WORKER_URL =
    "https://zatoi-ai.fbboytr.workers.dev/";

  const CHATS_KEY =
    "zatoi_chats_v6";

  const ACTIVE_CHAT_KEY =
    "zatoi_active_chat_v6";

  /*
    Kullanıcı hafızası burada tutuluyor.
    Kullanıcıya gösterilmiyor.
  */
  const GLOBAL_MEMORY_KEY =
    "zatoi_global_memory_v6";

  const VOICE_OUTPUT_KEY =
    "zatoi_voice_output_v1";


  /* =========================================
     DEĞİŞKENLER
  ========================================= */

  let chats = [];

  let activeChatId = null;

  let globalMemory = {
    name: "",
    facts: [],
    preferences: []
  };

  let recognition = null;

  let isListening = false;

  let voiceOutputEnabled =
    localStorage.getItem(VOICE_OUTPUT_KEY) !== "false";


  /* =========================================
     ELEMENTLER
  ========================================= */

  const messagesElement =
    document.getElementById("messages");

  const historyList =
    document.getElementById("historyList");

  const chatTitleElement =
    document.getElementById("chatTitle");

  const desktopInput =
    document.getElementById("desktopInput");

  const sendButton =
    document.getElementById("sendButton");

  const micButton =
    document.getElementById("micButton");

  const voiceToggle =
    document.getElementById("voiceToggle");

  const newChatButton =
    document.getElementById("newChatButton");

  const mobileHistoryButton =
    document.getElementById("mobileHistoryButton");


  /* =========================================
     HAFIZA
  ========================================= */

  function saveMemory() {
    localStorage.setItem(
      GLOBAL_MEMORY_KEY,
      JSON.stringify(globalMemory)
    );
  }


  function loadMemory() {
    try {
      const saved =
        localStorage.getItem(GLOBAL_MEMORY_KEY);

      if (saved) {
        const parsed = JSON.parse(saved);

        globalMemory = {
          name: parsed.name || "",
          facts: Array.isArray(parsed.facts)
            ? parsed.facts
            : [],
          preferences: Array.isArray(parsed.preferences)
            ? parsed.preferences
            : []
        };
      }

    } catch (error) {
      console.log(
        "Hafıza okunamadı:",
        error
      );
    }
  }


  function cleanMemory() {
    globalMemory = {
      name: "",
      facts: [],
      preferences: []
    };

    saveMemory();
  }


  /* =========================================
     SOHBETLERİ KAYDET
  ========================================= */

  function saveChats() {
    localStorage.setItem(
      CHATS_KEY,
      JSON.stringify(chats)
    );

    if (activeChatId) {
      localStorage.setItem(
        ACTIVE_CHAT_KEY,
        activeChatId
      );
    }
  }


  /* =========================================
     SOHBET BAŞLIĞI
  ========================================= */

  function makeChatTitle(text) {

    let title =
      text
        .replace(/\s+/g, " ")
        .trim();

    if (!title) {
      return "Yeni Sohbet";
    }

    if (title.length > 42) {
      title =
        title.substring(0, 42).trim() + "...";
    }

    return title;
  }


  /* =========================================
     YENİ SOHBET OLUŞTUR
  ========================================= */

  function createChat() {

    const chat = {
      id:
        Date.now().toString() +
        Math.random()
          .toString(36)
          .substring(2, 8),

      title: "Yeni Sohbet",

      messages: [],

      createdAt: Date.now(),

      updatedAt: Date.now()
    };

    chats.unshift(chat);

    activeChatId =
      chat.id;

    saveChats();

    renderHistory();

    renderMessages();

    updateChatTitle();

    desktopInput.value = "";

    stopSpeaking();

    setTimeout(() => {
      desktopInput.focus();
    }, 50);
  }


  /* =========================================
     AKTİF SOHBETİ BUL
  ========================================= */

  function getActiveChat() {

    return chats.find(
      chat =>
        chat.id === activeChatId
    );
  }


  /* =========================================
     BAŞLIK
  ========================================= */

  function updateChatTitle() {

    const chat =
      getActiveChat();

    if (!chat) {
      chatTitleElement.textContent =
        "Yeni Sohbet";

      return;
    }

    chatTitleElement.textContent =
      chat.title || "Yeni Sohbet";
  }


  /* =========================================
     MESAJLARI GÖSTER
  ========================================= */

  function renderMessages() {

    messagesElement.innerHTML = "";

    const chat =
      getActiveChat();

    if (!chat || chat.messages.length === 0) {

      messagesElement.innerHTML = `
        <div class="welcome">
          <h1>Zatoi AI 🤖</h1>
          <p>
            Merhaba! Ben Zatoi.
            <br>
            Sana nasıl yardımcı olabilirim?
          </p>
        </div>
      `;

      return;
    }


    chat.messages.forEach(message => {

      /*
        Sadece gerçek kullanıcı ve
        asistan mesajlarını gösteriyoruz.

        Böylece sohbet başlığı hiçbir zaman
        mesaj olarak ekrana gelmez.
      */

      if (
        message.role !== "user" &&
        message.role !== "assistant"
      ) {
        return;
      }

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        message.role;


      const bubble =
        document.createElement("div");

      bubble.className =
        "message " +
        message.role;

      bubble.textContent =
        message.content;


      row.appendChild(bubble);

      messagesElement.appendChild(row);
    });


    scrollToBottom();
  }


  /* =========================================
     AŞAĞI KAYDIR
  ========================================= */

  function scrollToBottom() {

    setTimeout(() => {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }, 30);
  }


  /* =========================================
     SOHBET GEÇMİŞİ
  ========================================= */

  function renderHistory() {

    historyList.innerHTML = "";

    if (chats.length === 0) {

      historyList.innerHTML = `
        <div class="history-empty">
          Henüz sohbet yok.
          <br>
          Yeni bir sohbet başlatabilirsin.
        </div>
      `;

      return;
    }


    chats.forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "history-item";


      const openButton =
        document.createElement("button");

      openButton.type = "button";

      openButton.className =
        "history-open" +
        (
          chat.id === activeChatId
            ? " active"
            : ""
        );


      const date =
        new Date(chat.updatedAt);

      const dateText =
        date.toLocaleDateString(
          "tr-TR",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );


      openButton.innerHTML = `
        <div class="history-title">
          ${escapeHtml(chat.title || "Yeni Sohbet")}
        </div>

        <div class="history-date">
          ${dateText}
        </div>
      `;


      openButton.addEventListener(
        "click",
        () => {

          activeChatId =
            chat.id;

          saveChats();

          renderHistory();

          renderMessages();

          updateChatTitle();

          stopSpeaking();
        }
      );


      const deleteButton =
        document.createElement("button");

      deleteButton.type = "button";

      deleteButton.className =
        "history-delete";

      deleteButton.textContent =
        "🗑️";

      deleteButton.title =
        "Sohbeti sil";


      deleteButton.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          deleteChat(chat.id);
        }
      );


      item.appendChild(openButton);

      item.appendChild(deleteButton);

      historyList.appendChild(item);
    });
  }


  /* =========================================
     SOHBET SİL
  ========================================= */

  function deleteChat(id) {

    const index =
      chats.findIndex(
        chat => chat.id === id
      );

    if (index === -1) {
      return;
    }


    chats.splice(index, 1);


    if (activeChatId === id) {

      if (chats.length > 0) {

        activeChatId =
          chats[0].id;

      } else {

        activeChatId = null;

        createChat();

        return;
      }
    }


    saveChats();

    renderHistory();

    renderMessages();

    updateChatTitle();

    stopSpeaking();
  }


  /* =========================================
     HTML GÜVENLİĞİ
  ========================================= */

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================
     MESAJ GÖNDER
  ========================================= */

  async function sendMessage(text) {

    text =
      String(text || "").trim();

    if (!text) {
      return;
    }


    let chat =
      getActiveChat();


    if (!chat) {

      createChat();

      chat =
        getActiveChat();
    }


    /*
      İlk mesaj aynı zamanda sohbet başlığı olur.

      AMA sadece başlık olarak tutulur.
      Mesaj ayrıca aşağıda messages içine
      bir kez eklenir.
    */

    if (
      chat.messages.length === 0 &&
      chat.title === "Yeni Sohbet"
    ) {

      chat.title =
        makeChatTitle(text);
    }


    chat.messages.push({
      role: "user",
      content: text
    });


    chat.updatedAt =
      Date.now();


    saveChats();

    renderHistory();

    updateChatTitle();

    renderMessages();


    desktopInput.value = "";

    stopSpeaking();


    /* TYPING MESAJI */

    const typingRow =
      document.createElement("div");

    typingRow.className =
      "message-row assistant";


    const typingBubble =
      document.createElement("div");

    typingBubble.className =
      "message assistant typing";

    typingBubble.textContent =
      "Zatoi düşünüyor...";


    typingRow.appendChild(
      typingBubble
    );

    messagesElement.appendChild(
      typingRow
    );

    scrollToBottom();


    try {

      /*
        Son 20 mesajı gönderiyoruz.
        Kullanıcı hafızası ise ayrı olarak
        arka planda gönderiliyor.
      */

      const recentMessages =
        chat.messages.slice(-20);


      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              memory: globalMemory,
              messages: recentMessages
            })
          }
        );


      if (!response.ok) {

        throw new Error(
          "Sunucu hatası: " +
          response.status
        );
      }


      const data =
        await response.json();


      /*
        Worker'dan gelen yeni hafıza
        varsa sessizce kaydediyoruz.
      */

      if (data.memory) {

        globalMemory = {
          name:
            data.memory.name ||
            globalMemory.name ||
            "",

          facts:
            Array.isArray(data.memory.facts)
              ? data.memory.facts
              : globalMemory.facts,

          preferences:
            Array.isArray(data.memory.preferences)
              ? data.memory.preferences
              : globalMemory.preferences
        };

        saveMemory();
      }


      let reply =
        data.reply;


      if (
        !reply &&
        data.choices &&
        data.choices[0] &&
        data.choices[0].message
      ) {

        reply =
          data.choices[0]
            .message.content;
      }


      if (!reply) {

        reply =
          "Üzgünüm, şu anda cevap oluşturamadım.";
      }


      /* TYPING MESAJINI KALDIR */

      typingRow.remove();


      /* CEVABI KAYDET */

      chat.messages.push({
        role: "assistant",
        content: reply
      });


      chat.updatedAt =
        Date.now();


      saveChats();

      renderHistory();

      renderMessages();


      /* SESLİ CEVAP */

      speakText(reply);

    } catch (error) {

      console.error(error);

      typingRow.remove();


      const errorMessage =
        "Bir sorun oluştu. Zatoi sunucusuna bağlanamadım.";

      chat.messages.push({
        role: "assistant",
        content: errorMessage
      });


      chat.updatedAt =
        Date.now();


      saveChats();

      renderHistory();

      renderMessages();
    }
  }


  /* =========================================
     ENTER İLE GÖNDER
  ========================================= */

  desktopInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage(
          desktopInput.value
        );
      }
    }
  );


  /* =========================================
     GÖNDER BUTONU
  ========================================= */

  sendButton.addEventListener(
    "click",
    () => {

      sendMessage(
        desktopInput.value
      );
    }
  );


  /* =========================================
     YENİ SOHBET
  ========================================= */

  newChatButton.addEventListener(
    "click",
    () => {

      createChat();
    }
  );


  /* =========================================
     MOBİL GEÇMİŞ
  ========================================= */

  mobileHistoryButton.addEventListener(
    "click",
    () => {

      if (window.innerWidth <= 800) {

        const chatNames =
          chats
            .map(
              (chat, index) =>
                `${index + 1}. ${chat.title}`
            )
            .join("\n");


        if (!chatNames) {

          alert(
            "Henüz sohbet geçmişin yok."
          );

          return;
        }


        const choice =
          prompt(
            "Sohbet geçmişi:\n\n" +
            chatNames +
            "\n\nAçmak istediğin sohbetin numarasını yaz:"
          );


        if (!choice) {
          return;
        }


        const number =
          parseInt(choice, 10);


        if (
          isNaN(number) ||
          number < 1 ||
          number > chats.length
        ) {

          alert(
            "Geçersiz sohbet numarası."
          );

          return;
        }


        activeChatId =
          chats[number - 1].id;


        saveChats();

        renderHistory();

        renderMessages();

        updateChatTitle();

        stopSpeaking();
      }
    }
  );


  /* =========================================
     SESLİ KONUŞMA
  ========================================= */

  function setupSpeechRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      recognition = null;

      return;
    }


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "tr-TR";

    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;


    recognition.onstart =
      () => {

        isListening = true;

        updateMicButtons();
      };


    recognition.onresult =
      event => {

        let transcript = "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0]
              .transcript;
        }


        transcript =
          transcript.trim();


        if (desktopInput) {

          desktopInput.value =
            transcript;
        }


        const lastResult =
          event.results[
            event.results.length - 1
          ];


        if (
          lastResult &&
          lastResult.isFinal
        ) {

          setTimeout(
            () => {

              const currentInput =
                desktopInput;


              if (
                currentInput &&
                currentInput.value.trim()
              ) {

                const text =
                  currentInput.value.trim();


                currentInput.value =
                  "";


                sendMessage(text);
              }

            },
            250
          );
        }
      };


    recognition.onerror =
      event => {

        console.log(
          "Ses tanıma hatası:",
          event.error
        );


        isListening = false;

        updateMicButtons();


        if (
          event.error ===
          "not-allowed"
        ) {

          alert(
            "Mikrofon izni verilmedi. " +
            "Tarayıcı ayarlarından mikrofon iznini aç."
          );
        }
      };


    recognition.onend =
      () => {

        isListening = false;

        updateMicButtons();
      };
  }


  /* =========================================
     MİKROFON BUTONU
  ========================================= */

  function toggleVoiceRecognition() {

    if (!recognition) {

      alert(
        "Bu tarayıcı sesli konuşmayı desteklemiyor. " +
        "Chrome kullanmayı deneyebilirsin."
      );

      return;
    }


    if (isListening) {

      recognition.stop();

      return;
    }


    try {

      recognition.start();

    } catch (error) {

      console.log(
        "Mikrofon başlatılamadı:",
        error
      );
    }
  }


  /* =========================================
     MİKROFON GÖRÜNÜMÜ
  ========================================= */

  function updateMicButtons() {

    if (!micButton) {
      return;
    }


    if (isListening) {

      micButton.textContent =
        "⏹️";

      micButton.classList.add(
        "mic-listening"
      );

      micButton.title =
        "Dinlemeyi durdur";

    } else {

      micButton.textContent =
        "🎤";

      micButton.classList.remove(
        "mic-listening"
      );

      micButton.title =
        "Sesli konuş";
    }
  }


  micButton.addEventListener(
    "click",
    toggleVoiceRecognition
  );


  /* =========================================
     SESLİ CEVAP
  ========================================= */

  function updateVoiceToggle() {

    if (!voiceToggle) {
      return;
    }


    if (voiceOutputEnabled) {

      voiceToggle.textContent =
        "🔊";

      voiceToggle.title =
        "Sesli cevap açık";

    } else {

      voiceToggle.textContent =
        "🔇";

      voiceToggle.title =
        "Sesli cevap kapalı";
    }
  }


  function stopSpeaking() {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();
    }
  }


  function speakText(text) {

    if (!voiceOutputEnabled) {
      return;
    }


    if (
      !("speechSynthesis" in window)
    ) {

      return;
    }


    if (!text) {
      return;
    }


    stopSpeaking();


    /*
      Çok uzun cevapları parçalara ayırıyoruz.
      Böylece tarayıcı daha rahat seslendiriyor.
    */

    const chunks =
      splitTextForSpeech(
        text,
        220
      );


    let index = 0;


    function speakNext() {

      if (
        index >= chunks.length
      ) {

        return;
      }


      const utterance =
        new SpeechSynthesisUtterance(
          chunks[index]
        );


      utterance.lang =
        "tr-TR";

      utterance.rate =
        1.0;

      utterance.pitch =
        1.0;

      utterance.volume =
        1.0;


      utterance.onend =
        () => {

          index++;

          speakNext();
        };


      window.speechSynthesis
        .speak(utterance);
    }


    speakNext();
  }


  function splitTextForSpeech(
    text,
    maxLength
  ) {

    const words =
      String(text)
        .split(/\s+/);


    const chunks = [];

    let current = "";


    words.forEach(word => {

      if (
        (current + " " + word)
          .trim()
          .length <= maxLength
      ) {

        current =
          (
            current +
            " " +
            word
          ).trim();

      } else {

        if (current) {

          chunks.push(current);
        }

        current = word;
      }
    });


    if (current) {

      chunks.push(current);
    }


    return chunks;
  }


  /* =========================================
     SESLİ CEVAP AÇ/KAPAT
  ========================================= */

  function toggleVoiceOutput() {

    voiceOutputEnabled =
      !voiceOutputEnabled;


    localStorage.setItem(
      VOICE_OUTPUT_KEY,
      voiceOutputEnabled
    );


    updateVoiceToggle();


    if (!voiceOutputEnabled) {

      stopSpeaking();
    }
  }


  voiceToggle.addEventListener(
    "click",
    toggleVoiceOutput
  );


  /* =========================================
     EKRAN BOYUTU
  ========================================= */

  window.addEventListener(
    "resize",
    () => {

      updateChatTitle();
    }
  );


  /* =========================================
     ESKİ HAFIZA / SOHBETLERİ TAŞIMA
  ========================================= */

  function migrateOldChats() {

    /*
      Daha önce kullanılan v5 sistemindeki
      sohbetleri kaybetmemek için kontrol ediyoruz.
    */

    const oldChatsRaw =
      localStorage.getItem(
        "zatoi_chats_v5"
      );


    if (!oldChatsRaw) {
      return;
    }


    /*
      Yeni sistem zaten varsa
      eski sistemi tekrar taşımıyoruz.
    */

    if (
      localStorage.getItem(CHATS_KEY)
    ) {

      return;
    }


    try {

      const oldChats =
        JSON.parse(oldChatsRaw);


      if (
        !Array.isArray(oldChats)
      ) {

        return;
      }


      oldChats.forEach(oldChat => {

        if (
          oldChat.memory
        ) {

          const oldMemory =
            oldChat.memory;


          if (
            oldMemory.name &&
            !globalMemory.name
          ) {

            globalMemory.name =
              oldMemory.name;
          }


          if (
            Array.isArray(
              oldMemory.facts
            )
          ) {

            globalMemory.facts = [
              ...new Set([
                ...globalMemory.facts,
                ...oldMemory.facts
              ])
            ];
          }


          if (
            Array.isArray(
              oldMemory.preferences
            )
          ) {

            globalMemory.preferences = [
              ...new Set([
                ...globalMemory.preferences,
                ...oldMemory.preferences
              ])
            ];
          }
        }
      });


      chats =
        oldChats.map(oldChat => ({
          id:
            oldChat.id ||
            Date.now().toString(),

          title:
            oldChat.title ||
            "Yeni Sohbet",

          messages:
            Array.isArray(oldChat.messages)
              ? oldChat.messages
              : [],

          createdAt:
            oldChat.createdAt ||
            Date.now(),

          updatedAt:
            oldChat.updatedAt ||
            Date.now()
        }));


      const oldActive =
        localStorage.getItem(
          "zatoi_active_chat_v5"
        );


      if (
        oldActive &&
        chats.some(
          chat =>
            chat.id === oldActive
        )
      ) {

        activeChatId =
          oldActive;

      } else if (
        chats.length > 0
      ) {

        activeChatId =
          chats[0].id;
      }


      saveMemory();

      saveChats();


    } catch (error) {

      console.log(
        "Eski sohbetler taşınamadı:",
        error
      );
    }
  }


  /* =========================================
     BAŞLANGIÇ
  ========================================= */

  function initialize() {

    loadMemory();

    migrateOldChats();


    /*
      Yeni sohbetler daha önce kayıtlıysa
      onları yükle.
    */

    if (chats.length === 0) {

      const savedChats =
        localStorage.getItem(
          CHATS_KEY
        );


      if (savedChats) {

        try {

          const parsed =
            JSON.parse(savedChats);


          if (
            Array.isArray(parsed)
          ) {

            chats =
              parsed;
          }

        } catch (error) {

          console.log(
            "Sohbetler okunamadı:",
            error
          );
        }
      }
    }


    /*
      Aktif sohbeti bul.
    */

    const savedActiveChat =
      localStorage.getItem(
        ACTIVE_CHAT_KEY
      );


    if (
      savedActiveChat &&
      chats.some(
        chat =>
          chat.id === savedActiveChat
      )
    ) {

      activeChatId =
        savedActiveChat;

    } else if (
      chats.length > 0
    ) {

      activeChatId =
        chats[0].id;

    } else {

      createChat();

      return;
    }


    renderHistory();

    renderMessages();

    updateChatTitle();

    updateVoiceToggle();

    setupSpeechRecognition();
  }


  /* =========================================
     BAŞLAT
  ========================================= */

  initialize();

</script>
