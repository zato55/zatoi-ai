<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zatoi AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #fff;
      overflow: hidden;
    }

    header {
      height: 70px;
      background: #171a23;
      border-bottom: 1px solid #292d38;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 22px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      color: #9298a8;
      font-size: 13px;
    }

    #app {
      height: calc(100vh - 70px);
      display: flex;
    }

    /* CHAT */

    #chatArea {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #currentChatTitle {
      height: 45px;
      border-bottom: 1px solid #292d38;
      display: flex;
      align-items: center;
      padding: 0 20px;
      color: #bfc4d1;
      font-size: 14px;
      background: #11141b;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      padding-bottom: 100px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 16px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .user .bubble {
      background: #2b6cff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #1d212b;
      color: #e9ebf0;
      border-bottom-left-radius: 4px;
    }

    /* PC INPUT */

    #desktopInput {
      position: absolute;
      right: 20px;
      top: 8px;
      z-index: 10;
      display: flex;
      gap: 7px;
      width: min(570px, 60%);
    }

    #desktopInput input {
      flex: 1;
      height: 36px;
      background: #20242e;
      border: 1px solid #343a48;
      color: white;
      border-radius: 9px;
      padding: 0 12px;
      outline: none;
    }

    #desktopInput input:focus {
      border-color: #4b78ff;
    }

    #desktopInput button {
      height: 36px;
      padding: 0 13px;
      border: none;
      border-radius: 9px;
      background: #2b6cff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #desktopMic {
      width: 40px;
      padding: 0 !important;
      background: #242a35 !important;
    }

    #desktopMic.listening,
    #mobileMic.listening {
      background: #d83c52 !important;
      animation: pulse 1s infinite;
    }

    #voiceToggle {
      width: 40px;
      padding: 0 !important;
      background: #242a35 !important;
    }

    #voiceToggle.active {
      background: #315dce !important;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(216, 60, 82, .6);
      }

      70% {
        box-shadow: 0 0 0 9px rgba(216, 60, 82, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(216, 60, 82, 0);
      }
    }

    /* SIDE PANEL */

    #sidePanel {
      width: 320px;
      background: #151820;
      border-left: 1px solid #292d38;
      overflow-y: auto;
      padding: 18px;
    }

    #sideTitle {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #newChatButton {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 11px;
      background: #2b6cff;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
    }

    #historyTitle {
      font-size: 12px;
      color: #858b9b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #chatHistory {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .historyItem {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .historyOpen {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: 1px solid transparent;
      background: #1d212b;
      color: #e7e9ee;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      overflow: hidden;
    }

    .historyOpen:hover {
      background: #242936;
    }

    .historyOpen.active {
      border-color: #3c65d8;
      background: #20283b;
    }

    .historyTitleText {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .historyDate {
      display: block;
      margin-top: 4px;
      color: #777e8e;
      font-size: 10px;
    }

    .deleteChatButton {
      width: 35px;
      border: none;
      border-radius: 8px;
      background: #241b20;
      color: #d98b99;
      cursor: pointer;
    }

    .deleteChatButton:hover {
      background: #342027;
    }

    /* MEMORY */

    #memorySection {
      margin-top: 25px;
      border-top: 1px solid #292d38;
      padding-top: 20px;
    }

    #memorySectionTitle {
      font-size: 16px;
      font-weight: bold;
    }

    #memoryDescription {
      color: #858b9b;
      font-size: 11px;
      line-height: 1.4;
      margin: 7px 0 12px;
    }

    #memoryBox {
      background: #10131a;
      border: 1px solid #292d38;
      border-radius: 9px;
      padding: 12px;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
    }

    #memoryContent {
      color: #cdd1da;
      font-size: 12px;
      line-height: 1.6;
    }

    .memoryLabel {
      color: #858b9b;
    }

    .memoryButton {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: 1px solid #303644;
      border-radius: 8px;
      background: #1b1f28;
      color: #cfd3dc;
      cursor: pointer;
      font-size: 12px;
    }

    .memoryButton:hover {
      background: #252a35;
    }

    /* MOBİL */

    #mobileBottom {
      display: none;
    }

    #mobileHistoryOverlay {
      display: none;
    }

    @media (max-width: 800px) {

      html,
      body {
        overflow: hidden;
      }

      header {
        height: 60px;
        padding: 0 15px;
      }

      header h1 {
        font-size: 19px;
      }

      header p {
        font-size: 11px;
      }

      #app {
        height: calc(100vh - 60px);
      }

      #chatArea {
        width: 100%;
      }

      #sidePanel,
      #desktopInput {
        display: none;
      }

      #currentChatTitle {
        height: 42px;
        padding: 0 15px;
      }

      #chat {
        padding: 15px;
        padding-bottom: 160px;
      }

      .message {
        margin-bottom: 12px;
      }

      .bubble {
        max-width: 88%;
        font-size: 14px;
      }

      /* MOBİL ALT PANEL */

      #mobileBottom {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        background: rgba(15, 17, 23, .98);
        border-top: 1px solid #292d38;
        padding: 8px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }

      #mobileTopButtons {
        display: flex;
        gap: 7px;
        margin-bottom: 7px;
      }

      #mobileTopButtons button {
        flex: 1;
        height: 34px;
        border: 1px solid #303644;
        border-radius: 8px;
        background: #1c2029;
        color: #dce0e8;
        cursor: pointer;
        font-size: 12px;
      }

      #mobileTopButtons button:first-child {
        background: #2b6cff;
        border-color: #2b6cff;
        color: white;
      }

      #mobileInput {
        display: flex;
        gap: 6px;
      }

      #mobileInput input {
        flex: 1;
        min-width: 0;
        height: 43px;
        background: #20242e;
        border: 1px solid #343a48;
        border-radius: 10px;
        color: white;
        padding: 0 11px;
        outline: none;
        font-size: 14px;
      }

      #mobileInput button {
        height: 43px;
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      #mobileMic {
        width: 46px;
        background: #242a35;
        font-size: 18px;
      }

      #mobileSend {
        width: 58px;
        background: #2b6cff;
        font-size: 12px;
      }

      /* MOBİL GEÇMİŞ */

      #mobileHistoryOverlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(0, 0, 0, .65);
        padding: 20px;
      }

      #mobileHistoryOverlay.open {
        display: block;
      }

      #mobileHistoryPanel {
        width: 100%;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        background: #151820;
        border: 1px solid #292d38;
        border-radius: 14px;
        padding: 15px;
      }

      #mobileHistoryHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }

      #mobileHistoryHeader strong {
        font-size: 16px;
      }

      #closeMobileHistory {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: #272c36;
        color: white;
        cursor: pointer;
      }

      #mobileHistoryList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Zatoi AI</h1>
  <p>Senin kişisel yapay zekân</p>
</header>

<div id="app">

  <section id="chatArea">

    <!-- PC INPUT -->

    <div id="desktopInput">

      <input
        id="desktopMessageInput"
        type="text"
        placeholder="Zatoi'ye bir şey sor..."
        autocomplete="off"
      >

      <button
        id="desktopMic"
        onclick="toggleVoiceRecognition()"
        title="Konuş"
      >
        🎤
      </button>

      <button
        id="voiceToggle"
        onclick="toggleVoiceOutput()"
        title="Sesli cevap"
      >
        🔊
      </button>

      <button onclick="sendDesktopMessage()">
        Gönder
      </button>

    </div>


    <div id="currentChatTitle">
      Yeni sohbet
    </div>


    <div id="chat"></div>


    <!-- MOBİL -->

    <div id="mobileBottom">

      <div id="mobileTopButtons">

        <button onclick="createNewChat()">
          ➕ Yeni Sohbet
        </button>

        <button onclick="openMobileHistory()">
          📚 Geçmiş
        </button>

      </div>


      <div id="mobileInput">

        <input
          id="mobileMessageInput"
          type="text"
          placeholder="Zatoi'ye bir şey sor..."
          autocomplete="off"
        >

        <button
          id="mobileMic"
          onclick="toggleVoiceRecognition()"
          title="Konuş"
        >
          🎤
        </button>

        <button
          id="mobileSend"
          onclick="sendMobileMessage()"
        >
          Gönder
        </button>

      </div>

    </div>

  </section>


  <!-- SAĞ PANEL -->

  <aside id="sidePanel">

    <div id="sideTitle">
      💬 Zatoi Sohbetleri
    </div>

    <button
      id="newChatButton"
      onclick="createNewChat()"
    >
      ➕ Yeni Sohbet
    </button>

    <div id="historyTitle">
      Sohbet Geçmişi
    </div>

    <div id="chatHistory"></div>


    <!-- ORTAK HAFIZA -->

    <div id="memorySection">

      <div id="memorySectionTitle">
        🧠 Kullanıcı Hafızası
      </div>

      <div id="memoryDescription">
        Zatoi'nin seni farklı sohbetlerde de tanımasını sağlayan ortak hafıza.
      </div>

      <div id="memoryBox">
        <div id="memoryContent"></div>
      </div>

      <button
        class="memoryButton"
        onclick="renderMemory()"
      >
        🔄 Hafızayı Yenile
      </button>

      <button
        class="memoryButton"
        onclick="clearGlobalMemory()"
      >
        🧠 Hafızayı Temizle
      </button>

    </div>

  </aside>

</div>


<!-- MOBİL GEÇMİŞ -->

<div id="mobileHistoryOverlay">

  <div id="mobileHistoryPanel">

    <div id="mobileHistoryHeader">

      <strong>
        📚 Sohbet Geçmişi
      </strong>

      <button
        id="closeMobileHistory"
        onclick="closeMobileHistory()"
      >
        ✕
      </button>

    </div>

    <div id="mobileHistoryList"></div>

  </div>

</div>


<script>

  /* =====================================================
     AYARLAR
  ===================================================== */

  const WORKER_URL =
    "https://zatoi-ai.fbboytr.workers.dev/";

  const CHATS_KEY =
    "zatoi_chats_v6";

  const ACTIVE_CHAT_KEY =
    "zatoi_active_chat_v6";

  const GLOBAL_MEMORY_KEY =
    "zatoi_global_memory_v6";

  const VOICE_OUTPUT_KEY =
    "zatoi_voice_output_v1";


  /* =====================================================
     DEĞİŞKENLER
  ===================================================== */

  let chats = [];

  let activeChatId = null;

  let globalMemory = {
    name: "",
    facts: [],
    preferences: []
  };


  /* =====================================================
     SES SİSTEMİ
  ===================================================== */

  let voiceOutputEnabled =
    localStorage.getItem(
      VOICE_OUTPUT_KEY
    ) !== "false";


  let recognition = null;

  let isListening = false;


  /* =====================================================
     SES TANIMA SİSTEMİNİ KUR
  ===================================================== */

  function setupSpeechRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      recognition = null;

      return;

    }


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "tr-TR";


    recognition.continuous =
      false;


    recognition.interimResults =
      true;


    recognition.maxAlternatives =
      1;


    recognition.onstart =
      () => {

        isListening = true;

        updateMicButtons();

      };


    recognition.onresult =
      event => {

        let transcript = "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0].transcript;

        }


        transcript =
          transcript.trim();


        const input =
          getCurrentInput();


        if (input) {

          input.value =
            transcript;

        }


        /*
          Sonuç kesinleştiğinde
          otomatik gönder.
        */

        const lastResult =
          event.results[
            event.results.length - 1
          ];


        if (
          lastResult &&
          lastResult.isFinal
        ) {

          setTimeout(() => {

            const currentInput =
              getCurrentInput();


            if (
              currentInput &&
              currentInput.value.trim()
            ) {

              const text =
                currentInput.value.trim();


              currentInput.value =
                "";


              sendMessage(text);

            }

          }, 250);

        }

      };


    recognition.onerror =
      event => {

        console.log(
          "Ses tanıma hatası:",
          event.error
        );

        isListening = false;

        updateMicButtons();


        if (
          event.error ===
          "not-allowed"
        ) {

          alert(
            "Mikrofon izni verilmedi. Tarayıcı ayarlarından mikrofon iznini aç."
          );

        }

      };


    recognition.onend =
      () => {

        isListening = false;

        updateMicButtons();

      };

  }


  /* =====================================================
     AKTİF INPUT'U BUL
  ===================================================== */

  function getCurrentInput() {

    if (
      window.innerWidth <= 800
    ) {

      return document.getElementById(
        "mobileMessageInput"
      );

    }


    return document.getElementById(
      "desktopMessageInput"
    );

  }


  /* =====================================================
     MİKROFON
  ===================================================== */

  function toggleVoiceRecognition() {

    if (!recognition) {

      alert(
        "Bu tarayıcı sesli konuşmayı desteklemiyor. Chrome kullanmayı deneyebilirsin."
      );

      return;

    }


    if (isListening) {

      recognition.stop();

      return;

    }


    try {

      recognition.start();

    } catch (error) {

      console.log(
        "Mikrofon başlatılamadı:",
        error
      );

    }

  }


  /* =====================================================
     MİKROFON BUTONLARI
  ===================================================== */

  function updateMicButtons() {

    const desktopMic =
      document.getElementById(
        "desktopMic"
      );

    const mobileMic =
      document.getElementById(
        "mobileMic"
      );


    if (isListening) {

      desktopMic?.classList.add(
        "listening"
      );

      mobileMic?.classList.add(
        "listening"
      );


      if (desktopMic) {

        desktopMic.textContent =
          "⏹️";

      }


      if (mobileMic) {

        mobileMic.textContent =
          "⏹️";

      }

    } else {

      desktopMic?.classList.remove(
        "listening"
      );

      mobileMic?.classList.remove(
        "listening"
      );


      if (desktopMic) {

        desktopMic.textContent =
          "🎤";

      }


      if (mobileMic) {

        mobileMic.textContent =
          "🎤";

      }

    }

  }


  /* =====================================================
     SESLİ CEVAP AÇ/KAPAT
  ===================================================== */

  function toggleVoiceOutput() {

    voiceOutputEnabled =
      !voiceOutputEnabled;


    localStorage.setItem(
      VOICE_OUTPUT_KEY,
      voiceOutputEnabled
    );


    updateVoiceToggle();


    /*
      Kapatılırsa mevcut konuşmayı da durdur.
    */

    if (!voiceOutputEnabled) {

      stopSpeaking();

    }

  }


  /* =====================================================
     SES BUTONUNU GÜNCELLE
  ===================================================== */

  function updateVoiceToggle() {

    const button =
      document.getElementById(
        "voiceToggle"
      );


    if (!button) {
      return;
    }


    if (voiceOutputEnabled) {

      button.textContent =
        "🔊";

      button.title =
        "Sesli cevap açık";

      button.classList.add(
        "active"
      );

    } else {

      button.textContent =
        "🔇";

      button.title =
        "Sesli cevap kapalı";

      button.classList.remove(
        "active"
      );

    }

  }


  /* =====================================================
     ZATOI'Yİ KONUŞTUR
  ===================================================== */

  function speakText(text) {

    if (!voiceOutputEnabled) {
      return;
    }


    if (
      !("speechSynthesis" in window)
    ) {

      console.log(
        "Tarayıcı sesli okumayı desteklemiyor."
      );

      return;

    }


    stopSpeaking();


    /*
      Emoji ve bazı işaretleri
      temizliyoruz.
    */

    let cleanText =
      text
        .replace(
          /[*_#`]/g,
          ""
        )
        .trim();


    if (!cleanText) {
      return;
    }


    /*
      Çok uzun cevapları parçalara ayırıyoruz.
      Tarayıcı TTS uzun metinlerde bazen sorun çıkarabilir.
    */

    const chunks =
      splitTextForSpeech(
        cleanText,
        220
      );


    let index = 0;


    function speakNext() {

      if (
        index >= chunks.length
      ) {

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          chunks[index]
        );


      utterance.lang =
        "tr-TR";


      utterance.rate =
        1.0;


      utterance.pitch =
        1.0;


      utterance.volume =
        1.0;


      utterance.onend =
        () => {

          index++;

          if (
            voiceOutputEnabled
          ) {

            speakNext();

          }

        };


      utterance.onerror =
        event => {

          console.log(
            "Sesli okuma hatası:",
            event
          );

        };


      window.speechSynthesis.speak(
        utterance
      );

    }


    speakNext();

  }


  /* =====================================================
     METNİ SES İÇİN PARÇALA
  ===================================================== */

  function splitTextForSpeech(
    text,
    maxLength
  ) {

    const words =
      text.split(/\s+/);


    const chunks = [];

    let current =
      "";


    for (
      const word of words
    ) {

      if (
        (
          current.length +
          word.length +
          1
        ) <= maxLength
      ) {

        current +=
          (
            current
              ? " "
              : ""
          )
          + word;

      } else {

        if (current) {

          chunks.push(
            current
          );

        }

        current =
          word;

      }

    }


    if (current) {

      chunks.push(
        current
      );

    }


    return chunks;

  }


  /* =====================================================
     SESİ DURDUR
  ===================================================== */

  function stopSpeaking() {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

    }

  }


  /* =====================================================
     ID
  ===================================================== */

  function createId() {

    return Date.now().toString()
      + "_"
      + Math.random()
        .toString(36)
        .substring(2, 9);

  }


  /* =====================================================
     BOŞ HAFIZA
  ===================================================== */

  function createEmptyMemory() {

    return {
      name: "",
      facts: [],
      preferences: []
    };

  }


  /* =====================================================
     SOHBET OLUŞTUR
  ===================================================== */

  function createChat(
    title = "Yeni sohbet"
  ) {

    return {

      id: createId(),

      title: title,

      messages: [],

      createdAt: Date.now(),

      updatedAt: Date.now()

    };

  }


  /* =====================================================
     HAFIZA BİRLEŞTİR
  ===================================================== */

  function mergeMemory(
    target,
    source
  ) {

    if (!source) {
      return target;
    }


    if (
      !target.name &&
      typeof source.name === "string" &&
      source.name.trim()
    ) {

      target.name =
        source.name.trim();

    }


    if (
      Array.isArray(source.facts)
    ) {

      for (
        const fact of source.facts
      ) {

        if (
          typeof fact === "string" &&
          fact.trim() &&
          !target.facts.includes(
            fact.trim()
          )
        ) {

          target.facts.push(
            fact.trim()
          );

        }

      }

    }


    if (
      Array.isArray(
        source.preferences
      )
    ) {

      for (
        const preference of
        source.preferences
      ) {

        if (
          typeof preference === "string" &&
          preference.trim() &&
          !target.preferences.includes(
            preference.trim()
          )
        ) {

          target.preferences.push(
            preference.trim()
          );

        }

      }

    }


    return target;

  }


  /* =====================================================
     V5 → V6
  ===================================================== */

  function migrateOldData() {

    const oldChatsRaw =
      localStorage.getItem(
        "zatoi_chats_v5"
      );


    const oldMemoryRaw =
      localStorage.getItem(
        GLOBAL_MEMORY_KEY
      );


    if (oldMemoryRaw) {
      return false;
    }


    if (!oldChatsRaw) {
      return false;
    }


    try {

      const oldChats =
        JSON.parse(
          oldChatsRaw
        );


      if (
        !Array.isArray(oldChats)
      ) {

        return false;

      }


      let migratedMemory =
        createEmptyMemory();


      for (
        const oldChat of oldChats
      ) {

        if (
          oldChat &&
          oldChat.memory
        ) {

          mergeMemory(
            migratedMemory,
            oldChat.memory
          );

        }

      }


      globalMemory =
        migratedMemory;


      localStorage.setItem(
        GLOBAL_MEMORY_KEY,
        JSON.stringify(
          globalMemory
        )
      );


      const newChats =
        oldChats.map(
          oldChat => {

            return {

              id:
                oldChat.id ||
                createId(),

              title:
                oldChat.title ||
                "Yeni sohbet",

              messages:
                Array.isArray(
                  oldChat.messages
                )
                  ? oldChat.messages
                  : [],

              createdAt:
                oldChat.createdAt ||
                Date.now(),

              updatedAt:
                oldChat.updatedAt ||
                Date.now()

            };

          }
        );


      localStorage.setItem(
        CHATS_KEY,
        JSON.stringify(
          newChats
        )
      );


      const oldActive =
        localStorage.getItem(
          "zatoi_active_chat_v5"
        );


      if (oldActive) {

        localStorage.setItem(
          ACTIVE_CHAT_KEY,
          oldActive
        );

      }


      return true;

    } catch (error) {

      console.log(
        "Eski veriler taşınamadı:",
        error
      );

      return false;

    }

  }


  /* =====================================================
     VERİLERİ YÜKLE
  ===================================================== */

  function loadChats() {

    try {

      migrateOldData();


      const savedChats =
        localStorage.getItem(
          CHATS_KEY
        );


      const savedActiveChat =
        localStorage.getItem(
          ACTIVE_CHAT_KEY
        );


      const savedGlobalMemory =
        localStorage.getItem(
          GLOBAL_MEMORY_KEY
        );


      if (savedChats) {

        const parsed =
          JSON.parse(
            savedChats
          );


        if (
          Array.isArray(parsed)
        ) {

          chats =
            parsed.map(
              chat => {

                return {

                  id:
                    chat.id ||
                    createId(),

                  title:
                    chat.title ||
                    "Yeni sohbet",

                  messages:
                    Array.isArray(
                      chat.messages
                    )
                      ? chat.messages
                      : [],

                  createdAt:
                    chat.createdAt ||
                    Date.now(),

                  updatedAt:
                    chat.updatedAt ||
                    Date.now()

                };

              }
            );

        }

      }


      if (savedGlobalMemory) {

        const parsedMemory =
          JSON.parse(
            savedGlobalMemory
          );


        if (parsedMemory) {

          globalMemory = {

            name:
              typeof parsedMemory.name ===
              "string"
                ? parsedMemory.name
                : "",

            facts:
              Array.isArray(
                parsedMemory.facts
              )
                ? parsedMemory.facts
                : [],

            preferences:
              Array.isArray(
                parsedMemory.preferences
              )
                ? parsedMemory.preferences
                : []

          };

        }

      }


      if (!chats.length) {

        const firstChat =
          createChat();


        chats = [
          firstChat
        ];


        activeChatId =
          firstChat.id;


        saveAll();

      } else {

        activeChatId =
          savedActiveChat ||
          chats[0].id;


        const exists =
          chats.some(
            chat =>
              chat.id ===
              activeChatId
          );


        if (!exists) {

          activeChatId =
            chats[0].id;

        }

      }

    } catch (error) {

      console.log(
        "Yükleme hatası:",
        error
      );


      const firstChat =
        createChat();


      chats = [
        firstChat
      ];


      activeChatId =
        firstChat.id;


      globalMemory =
        createEmptyMemory();


      saveAll();

    }

  }


  /* =====================================================
     KAYDET
  ===================================================== */

  function saveAll() {

    localStorage.setItem(
      CHATS_KEY,
      JSON.stringify(chats)
    );


    localStorage.setItem(
      ACTIVE_CHAT_KEY,
      activeChatId
    );


    localStorage.setItem(
      GLOBAL_MEMORY_KEY,
      JSON.stringify(
        globalMemory
      )
    );

  }


  /* =====================================================
     AKTİF SOHBET
  ===================================================== */

  function getActiveChat() {

    return chats.find(
      chat =>
        chat.id ===
        activeChatId
    );

  }


  /* =====================================================
     BAŞLIK
  ===================================================== */

  function generateChatTitle(
    text
  ) {

    let title =
      text.trim();


    if (!title) {

      return "Yeni sohbet";

    }


    if (title.length > 32) {

      title =
        title.substring(
          0,
          32
        )
        + "...";

    }


    return title;

  }


  /* =====================================================
     MESAJ GÖNDER
  ===================================================== */

  async function sendMessage(
    text
  ) {

    text =
      text.trim();


    if (!text) {
      return;
    }


    const activeChat =
      getActiveChat();


    if (!activeChat) {
      return;
    }


    activeChat.messages.push({

      role: "user",

      content: text

    });


    if (
      activeChat.messages.length ===
      1
    ) {

      activeChat.title =
        generateChatTitle(
          text
        );

    }


    activeChat.updatedAt =
      Date.now();


    saveAll();

    renderConversation();

    renderHistory();


    const recentMessages =
      activeChat.messages
        .slice(-20);


    try {

      const response =
        await fetch(
          WORKER_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                /*
                  ORTAK HAFIZA
                */

                memory:
                  globalMemory,

                /*
                  SADECE BU SOHBETİN
                  MESAJLARI
                */

                messages:
                  recentMessages

              })

          }
        );


      const data =
        await response.json();


      if (data.error) {

        throw new Error(
          data.error
        );

      }


      /* HAFIZA */

      if (data.memory) {

        globalMemory = {

          name:
            data.memory.name ||
            globalMemory.name ||
            "",

          facts:
            Array.isArray(
              data.memory.facts
            )
              ? data.memory.facts
              : globalMemory.facts,

          preferences:
            Array.isArray(
              data.memory.preferences
            )
              ? data.memory.preferences
              : globalMemory.preferences

        };


        saveAll();

      }


      /* CEVAP */

      const reply =
        data.reply ||
        data.choices?.[0]?.message?.content ||
        "Zatoi cevap veremedi.";


      activeChat.messages.push({

        role: "assistant",

        content: reply

      });


      activeChat.updatedAt =
        Date.now();


      saveAll();

      renderConversation();

      renderHistory();

      renderMemory();


      /*
        ZATOI CEVABI SESLENDİR
      */

      speakText(reply);


    } catch (error) {

      console.log(
        "Zatoi bağlantı hatası:",
        error
      );


      const errorMessage =
        "Şu anda bağlantıda bir sorun oluştu. ⚠️";


      activeChat.messages.push({

        role: "assistant",

        content:
          errorMessage

      });


      activeChat.updatedAt =
        Date.now();


      saveAll();

      renderConversation();

    }

  }


  /* =====================================================
     PC MESAJ
  ===================================================== */

  function sendDesktopMessage() {

    const input =
      document.getElementById(
        "desktopMessageInput"
      );


    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    input.value = "";


    sendMessage(text);

  }


  /* =====================================================
     MOBİL MESAJ
  ===================================================== */

  function sendMobileMessage() {

    const input =
      document.getElementById(
        "mobileMessageInput"
      );


    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    input.value = "";


    sendMessage(text);

  }


  /* =====================================================
     SOHBETİ GÖSTER
  ===================================================== */

  function renderConversation() {

    const chatElement =
      document.getElementById(
        "chat"
      );


    const activeChat =
      getActiveChat();


    if (!activeChat) {
      return;
    }


    document.getElementById(
      "currentChatTitle"
    ).textContent =
      activeChat.title;


    chatElement.innerHTML =
      "";


    for (
      const message of
      activeChat.messages
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message "
        +
        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      bubble.textContent =
        message.content;


      wrapper.appendChild(
        bubble
      );


      chatElement.appendChild(
        wrapper
      );

    }


    requestAnimationFrame(
      () => {

        chatElement.scrollTop =
          chatElement.scrollHeight;

      }
    );

  }


  /* =====================================================
     GEÇMİŞ
  ===================================================== */

  function renderHistory() {

    const history =
      document.getElementById(
        "chatHistory"
      );


    if (!history) {
      return;
    }


    history.innerHTML =
      "";


    const sortedChats =
      [...chats].sort(
        (a, b) =>
          b.updatedAt -
          a.updatedAt
      );


    for (
      const chat of sortedChats
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "historyItem";


      const openButton =
        document.createElement(
          "button"
        );


      openButton.className =
        "historyOpen";


      if (
        chat.id ===
        activeChatId
      ) {

        openButton.classList.add(
          "active"
        );

      }


      const title =
        document.createElement(
          "span"
        );


      title.className =
        "historyTitleText";


      title.textContent =
        chat.title;


      const date =
        document.createElement(
          "span"
        );


      date.className =
        "historyDate";


      date.textContent =
        formatDate(
          chat.updatedAt
        );


      openButton.appendChild(
        title
      );


      openButton.appendChild(
        date
      );


      openButton.onclick =
        () => {

          openChat(
            chat.id
          );

        };


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "deleteChatButton";


      deleteButton.textContent =
        "🗑️";


      deleteButton.onclick =
        event => {

          event.stopPropagation();

          deleteChat(
            chat.id
          );

        };


      item.appendChild(
        openButton
      );


      item.appendChild(
        deleteButton
      );


      history.appendChild(
        item
      );

    }


    renderMobileHistory();

  }


  /* =====================================================
     MOBİL GEÇMİŞ
  ===================================================== */

  function renderMobileHistory() {

    const history =
      document.getElementById(
        "mobileHistoryList"
      );


    if (!history) {
      return;
    }


    history.innerHTML =
      "";


    const sortedChats =
      [...chats].sort(
        (a, b) =>
          b.updatedAt -
          a.updatedAt
      );


    for (
      const chat of sortedChats
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "historyItem";


      const openButton =
        document.createElement(
          "button"
        );


      openButton.className =
        "historyOpen";


      if (
        chat.id ===
        activeChatId
      ) {

        openButton.classList.add(
          "active"
        );

      }


      const title =
        document.createElement(
          "span"
        );


      title.className =
        "historyTitleText";


      title.textContent =
        chat.title;


      const date =
        document.createElement(
          "span"
        );


      date.className =
        "historyDate";


      date.textContent =
        formatDate(
          chat.updatedAt
        );


      openButton.appendChild(
        title
      );


      openButton.appendChild(
        date
      );


      openButton.onclick =
        () => {

          openChat(
            chat.id
          );

          closeMobileHistory();

        };


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "deleteChatButton";


      deleteButton.textContent =
        "🗑️";


      deleteButton.onclick =
        event => {

          event.stopPropagation();

          deleteChat(
            chat.id
          );

        };


      item.appendChild(
        openButton
      );


      item.appendChild(
        deleteButton
      );


      history.appendChild(
        item
      );

    }

  }


  /* =====================================================
     TARİH
  ===================================================== */

  function formatDate(
    timestamp
  ) {

    try {

      return new Date(
        timestamp
      ).toLocaleString(
        "tr-TR",
        {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "";

    }

  }


  /* =====================================================
     SOHBET AÇ
  ===================================================== */

  function openChat(id) {

    const exists =
      chats.some(
        chat =>
          chat.id === id
      );


    if (!exists) {
      return;
    }


    stopSpeaking();


    activeChatId =
      id;


    saveAll();

    renderConversation();

    renderHistory();

    renderMemory();

  }


  /* =====================================================
     YENİ SOHBET
  ===================================================== */

  function createNewChat() {

    stopSpeaking();


    const newChat =
      createChat();


    chats.push(
      newChat
    );


    activeChatId =
      newChat.id;


    saveAll();

    renderConversation();

    renderHistory();

    renderMemory();


    setTimeout(
      () => {

        const input =
          getCurrentInput();


        input?.focus();

      },
      100
    );

  }


  /* =====================================================
     SOHBET SİL
  ===================================================== */

  function deleteChat(id) {

    if (
      chats.length <= 1
    ) {

      alert(
        "En az bir sohbet kalmalı."
      );

      return;

    }


    const chat =
      chats.find(
        c =>
          c.id === id
      );


    if (!chat) {
      return;
    }


    const confirmed =
      confirm(
        `"${chat.title}" sohbeti silinsin mi?`
      );


    if (!confirmed) {
      return;
    }


    chats =
      chats.filter(
        c =>
          c.id !== id
      );


    if (
      activeChatId === id
    ) {

      chats.sort(
        (a, b) =>
          b.updatedAt -
          a.updatedAt
      );


      activeChatId =
        chats[0].id;

    }


    saveAll();

    renderConversation();

    renderHistory();

    renderMemory();

  }


  /* =====================================================
     HAFIZA
  ===================================================== */

  function renderMemory() {

    const content =
      document.getElementById(
        "memoryContent"
      );


    if (!content) {
      return;
    }


    let html =
      "";


    if (
      globalMemory.name
    ) {

      html +=
        `<div>
          <span class="memoryLabel">
            İsim:
          </span>
          ${escapeHtml(
            globalMemory.name
          )}
        </div>`;

    }


    if (
      globalMemory.facts &&
      globalMemory.facts.length
    ) {

      html +=
        `<div style="margin-top:8px;">
          <span class="memoryLabel">
            Bilgiler:
          </span>
        </div>`;


      for (
        const fact of
        globalMemory.facts
      ) {

        html +=
          `<div>
            • ${escapeHtml(fact)}
          </div>`;

      }

    }


    if (
      globalMemory.preferences &&
      globalMemory.preferences.length
    ) {

      html +=
        `<div style="margin-top:8px;">
          <span class="memoryLabel">
            Tercihler:
          </span>
        </div>`;


      for (
        const preference of
        globalMemory.preferences
      ) {

        html +=
          `<div>
            • ${escapeHtml(
              preference
            )}
          </div>`;

      }

    }


    if (!html) {

      html =
        `<span class="memoryLabel">
          Henüz kayıtlı bilgi yok.
        </span>`;

    }


    content.innerHTML =
      html;

  }


  /* =====================================================
     HAFIZA TEMİZLE
  ===================================================== */

  function clearGlobalMemory() {

    const confirmed =
      confirm(
        "Zatoi'nin seni tanımak için kaydettiği ortak hafıza temizlensin mi?"
      );


    if (!confirmed) {
      return;
    }


    globalMemory =
      createEmptyMemory();


    saveAll();

    renderMemory();

  }


  /* =====================================================
     HTML GÜVENLİĞİ
  ===================================================== */

  function escapeHtml(
    text
  ) {

    return String(text)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =====================================================
     MOBİL GEÇMİŞ AÇ
  ===================================================== */

  function openMobileHistory() {

    document
      .getElementById(
        "mobileHistoryOverlay"
      )
      .classList.add(
        "open"
      );

  }


  /* =====================================================
     MOBİL GEÇMİŞ KAPAT
  ===================================================== */

  function closeMobileHistory() {

    document
      .getElementById(
        "mobileHistoryOverlay"
      )
      .classList.remove(
        "open"
      );

  }


  /* =====================================================
     ENTER
  ===================================================== */

  document
    .getElementById(
      "desktopMessageInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendDesktopMessage();

        }

      }
    );


  document
    .getElementById(
      "mobileMessageInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMobileMessage();

        }

      }
    );


  /* =====================================================
     BAŞLAT
  ===================================================== */

  setupSpeechRecognition();

  updateMicButtons();

  updateVoiceToggle();

  loadChats();

  renderConversation();

  renderHistory();

  renderMemory();

</script>
