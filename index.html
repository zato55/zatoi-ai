<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zatoi AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1117;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #171a21;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #292d36;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai {
      background: #252a34;
      margin-right: auto;
    }

    .user {
      background: #3b82f6;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #292d36;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #252a34;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #clearButton {
      margin: 10px 15px 0 15px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #252a34;
      color: #aaa;
      cursor: pointer;
    }

  </style>

</head>


<body>

  <div class="container">

    <header>
      🤖 Zatoi AI
    </header>


    <div id="chat"></div>


    <button id="clearButton">
      🗑️ Hafızayı Temizle
    </button>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Zatoi'ye bir şey sor..."
        autocomplete="off"
      >

      <button id="sendButton">
        Gönder
      </button>

    </div>

  </div>


  <script>

    const WORKER_URL =
      "https://zatoi-ai.fbboytr.workers.dev/";


    const chat =
      document.getElementById("chat");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const clearButton =
      document.getElementById("clearButton");


    // 🧠 HAFIZA

    let conversation =
      JSON.parse(
        localStorage.getItem("zatoi_memory") || "[]"
      );


    function saveMemory() {

      localStorage.setItem(
        "zatoi_memory",
        JSON.stringify(conversation)
      );

    }


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent =
        text;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;

    }


    function loadMemory() {

      chat.innerHTML = "";

      if (conversation.length === 0) {

        addMessage(
          "Merhaba! Ben Zatoi AI. 👋",
          "ai"
        );

        return;

      }


      conversation.forEach(function(message) {

        if (message.role === "user") {

          addMessage(
            message.content,
            "user"
          );

        }

        if (message.role === "assistant") {

          addMessage(
            message.content,
            "ai"
          );

        }

      });

    }


   ```javascript
async function sendMessage() {

  const message =
    messageInput.value.trim();

  if (!message) return;


  // Kullanıcı mesajını ekle
  addMessage(
    message,
    "user"
  );


  conversation.push({
    role: "user",
    content: message
  });


  saveMemory();


  messageInput.value = "";

  sendButton.disabled = true;


  const aiMessage =
    addMessage(
      "Zatoi düşünüyor...",
      "ai"
    );


  try {

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            messages: conversation
          })
        }
      );


    const data =
      await response.json();


    console.log(
      "Zatoi cevabı:",
      data
    );


    // Worker { reply: "..." } döndürürse
    let reply =
      data?.reply;


    // Worker doğrudan AI cevabını döndürürse
    if (!reply) {

      reply =
        data?.choices?.[0]?.message?.content;

    }


    // Cevap bulunduysa
    if (reply) {

      aiMessage.textContent =
        reply;


      conversation.push({
        role: "assistant",
        content: reply
      });


      saveMemory();

    }


    // Worker hata döndürürse
    else if (data?.error) {

      aiMessage.textContent =
        "Zatoi AI hatası: " +
        data.error;

    }


    // Hiçbir cevap formatı bulunamazsa
    else {

      aiMessage.textContent =
        "Zatoi cevap veremedi.";

      console.log(
        "Beklenmeyen cevap:",
        data
      );

    }


  }

  catch (error) {

    console.error(
      "Bağlantı hatası:",
      error
    );

    aiMessage.textContent =
      "Zatoi'ye bağlanırken hata oluştu.";

  }


  sendButton.disabled = false;

  messageInput.focus();

}

    // Gönder butonu

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // Enter ile gönder

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    // Hafızayı temizle

    clearButton.addEventListener(
      "click",
      function() {

        const confirmClear =
          confirm(
            "Zatoi'nin tüm konuşma hafızası silinsin mi?"
          );


        if (confirmClear) {

          conversation = [];

          localStorage.removeItem(
            "zatoi_memory"
          );

          loadMemory();

        }

      }
    );


    // Sayfa açılırken hafızayı yükle

    loadMemory();

  </script>

</body>

</html>
