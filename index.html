<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zatoi AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #0b0f14;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;

    }


    button,
    textarea {

      font-family: inherit;

    }


    button {

      border: none;
      cursor: pointer;

    }


    .app {

      width: 100%;
      height: 100vh;

      display: flex;

      background: #0b0f14;

    }


    /* =================================
       CHAT
    ================================= */

    .chat-column {

      flex: 1;
      min-width: 0;

      height: 100%;

      display: flex;
      flex-direction: column;

    }


    .chat-top {

      height: 58px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom:
        1px solid #1c2530;

      background: #0d1218;

    }


    .chat-title {

      font-size: 17px;
      font-weight: 700;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

    }


    .top-actions {

      display: flex;
      gap: 8px;

    }


    .new-chat-btn,
    .mobile-history-btn {

      background: #17212b;
      color: white;

      border:
        1px solid #263442;

      border-radius: 10px;

      padding:
        9px 12px;

      font-size: 13px;

    }


    .mobile-history-btn {

      display: none;

    }


    /* =================================
       INPUT
    ================================= */

    .desktop-input-area {

      flex-shrink: 0;

      padding:
        12px 18px;

      background: #0b0f14;

      border-bottom:
        1px solid #1c2530;

    }


    .input-box {

      width: 100%;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      background: #111820;

      border:
        1px solid #273440;

      border-radius: 14px;

      padding: 8px;

    }


    textarea {

      flex: 1;
      min-width: 0;

      resize: none;

      max-height: 130px;
      min-height: 40px;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: 15px;

      line-height: 1.4;

      padding: 10px;

    }


    textarea::placeholder {

      color: #71808f;

    }


    .action-btn,
    .voice-btn {

      flex-shrink: 0;

      height: 40px;
      min-width: 40px;

      border-radius: 10px;

      background: #1b2732;

      color: white;

      font-size: 14px;

      padding:
        0 12px;

    }


    .send-btn {

      background: #2563eb;

      font-weight: 700;

    }


    .pdf-btn {

      font-size: 18px;

      padding:
        0 10px;

    }


    .voice-btn.active {

      background: #b91c1c;

    }


    /* =================================
       PDF
    ================================= */

    .file-input {

      display: none;

    }


    .selected-file {

      display: none;

      align-items: center;

      gap: 8px;

      padding:
        8px 12px;

      margin:
        0 18px 8px;

      background: #101922;

      border:
        1px solid #263542;

      border-radius: 10px;

      font-size: 13px;

      color: #cbd5df;

    }


    .selected-file.show {

      display: flex;

    }


    .selected-file-name {

      flex: 1;
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .remove-file-btn {

      background: transparent;

      color: #ff8b8b;

      font-size: 18px;

    }


    /* =================================
       MESSAGES
    ================================= */

    .messages {

      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      scrollbar-width: thin;

    }


    .message-row {

      display: flex;

      width: 100%;

    }


    .message-row.user {

      justify-content: flex-end;

    }


    .message-row.assistant {

      justify-content: flex-start;

    }


    .message {

      max-width:
        min(78%, 850px);

      padding:
        11px 14px;

      border-radius: 14px;

      font-size: 15px;

      line-height: 1.5;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

    }


    .message.user {

      background: #2563eb;

      border-bottom-right-radius:
        5px;

    }


    .message.assistant {

      background: #17212b;

      border:
        1px solid #253341;

      border-bottom-left-radius:
        5px;

    }


    .welcome {

      margin: auto;

      text-align: center;

      color: #8b9aaa;

      padding: 30px;

    }


    .welcome h1 {

      color: white;

      font-size: 30px;

      margin:
        0 0 12px;

    }


    .welcome p {

      line-height: 1.7;

    }


    /* =================================
       TYPING
    ================================= */

    .typing-row {

      display: flex;

      justify-content:
        flex-start;

    }


    .typing {

      background: #17212b;

      border:
        1px solid #253341;

      border-radius: 14px;

      padding:
        11px 14px;

      display: flex;

      gap: 5px;

    }


    .typing span {

      width: 6px;
      height: 6px;

      background: #8999a8;

      border-radius: 50%;

      animation:
        typing 1.2s infinite;

    }


    .typing span:nth-child(2) {

      animation-delay:
        .15s;

    }


    .typing span:nth-child(3) {

      animation-delay:
        .3s;

    }


    @keyframes typing {

      0%,
      60%,
      100% {

        opacity: .3;

        transform:
          translateY(0);

      }

      30% {

        opacity: 1;

        transform:
          translateY(-3px);

      }

    }


    /* =================================
       HISTORY
    ================================= */

    .side-panel {

      width: 280px;

      height: 100%;

      flex-shrink: 0;

      border-left:
        1px solid #1c2530;

      background: #0d1218;

      display: flex;

      flex-direction: column;

    }


    .side-header {

      height: 58px;

      display: flex;

      align-items: center;

      padding:
        0 16px;

      font-weight: 700;

      border-bottom:
        1px solid #1c2530;

    }


    .history-list {

      flex: 1;

      overflow-y: auto;

      padding: 10px;

    }


    .history-item {

      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 7px;

    }


    .history-open {

      flex: 1;

      min-width: 0;

      text-align: left;

      background: #111820;

      color: #dce4eb;

      border:
        1px solid #202d39;

      border-radius: 10px;

      padding: 10px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .history-open.active {

      border-color: #2563eb;

      background: #142338;

    }


    .history-delete {

      width: 34px;
      height: 34px;

      border-radius: 8px;

      background: #171d23;

      color: #ff8585;

    }


    /* =================================
       MOBILE
    ================================= */

    .mobile-input-area {

      display: none;

    }


    .mobile-history-overlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background:
        rgba(0,0,0,.6);

    }


    .mobile-history-overlay.show {

      display: block;

    }


    .mobile-history-panel {

      position: absolute;

      top: 0;
      left: 0;
      bottom: 0;

      width:
        min(320px, 85vw);

      background: #0d1218;

      border-right:
        1px solid #26313d;

      display: flex;

      flex-direction: column;

    }


    .mobile-history-header {

      height: 58px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding:
        0 14px;

      border-bottom:
        1px solid #1c2530;

    }


    .close-history {

      width: 35px;
      height: 35px;

      border-radius: 8px;

      background: #19222b;

      color: white;

      font-size: 18px;

    }


    .mobile-history-list {

      flex: 1;

      overflow-y: auto;

      padding: 10px;

    }


    @media (max-width: 800px) {

      .app {

        height: 100dvh;

      }


      .side-panel {

        display: none;

      }


      .chat-top {

        height: 56px;

        padding:
          0 10px;

      }


      .mobile-history-btn {

        display: block;

        padding:
          8px 9px;

        font-size: 12px;

      }


      .new-chat-btn {

        padding:
          8px 9px;

        font-size: 12px;

      }


      .desktop-input-area {

        display: none;

      }


      .messages {

        padding:
          12px 10px 100px;

      }


      .message {

        max-width: 88%;

      }


      .mobile-input-area {

        display: block;

        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 20;

        padding: 8px;

        background:
          rgba(11,15,20,.97);

        border-top:
          1px solid #1c2530;

      }


      .mobile-input-area
      .selected-file {

        margin:
          0 0 7px;

      }


      .mobile-input-area
      .input-box {

        padding: 6px;

      }


      .mobile-input-area
      textarea {

        min-height: 38px;

        max-height: 100px;

        padding: 9px;

        font-size: 14px;

      }


      .mobile-input-area
      .voice-btn,
      .mobile-input-area
      .action-btn {

        height: 38px;

        min-width: 38px;

        padding:
          0 8px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <section class="chat-column">


    <!-- TOP -->

    <div class="chat-top">

      <div
        id="chatTitle"
        class="chat-title"
      >
        Yeni Sohbet
      </div>


      <div class="top-actions">

        <button
          id="mobileHistoryButton"
          class="mobile-history-btn"
        >
          📚 Geçmiş
        </button>


        <button
          id="newChatButton"
          class="new-chat-btn"
        >
          ➕ Yeni Sohbet
        </button>

      </div>

    </div>


    <!-- DESKTOP INPUT -->

    <div class="desktop-input-area">


      <div
        id="desktopSelectedFile"
        class="selected-file"
      >

        <span>📄</span>

        <span
          id="desktopSelectedFileName"
          class="selected-file-name"
        ></span>

        <button
          id="desktopRemoveFile"
          class="remove-file-btn"
        >
          ×
        </button>

      </div>


      <div class="input-box">

        <textarea
          id="desktopInput"
          rows="1"
          placeholder="Zatoi'ye bir şey sor..."
        ></textarea>


        <button
          id="desktopPdfButton"
          class="voice-btn pdf-btn"
          title="PDF yükle"
        >
          📎
        </button>


        <button
          id="micButton"
          class="voice-btn"
        >
          🎤
        </button>


        <button
          id="voiceToggle"
          class="voice-btn"
        >
          🔊
        </button>


        <button
          id="sendButton"
          class="action-btn send-btn"
        >
          Gönder
        </button>

      </div>

    </div>


    <!-- MESAJLAR -->

    <div
      id="messages"
      class="messages"
    ></div>


    <!-- MOBILE INPUT -->

    <div class="mobile-input-area">


      <div
        id="mobileSelectedFile"
        class="selected-file"
      >

        <span>📄</span>

        <span
          id="mobileSelectedFileName"
          class="selected-file-name"
        ></span>

        <button
          id="mobileRemoveFile"
          class="remove-file-btn"
        >
          ×
        </button>

      </div>


      <div class="input-box">

        <textarea
          id="mobileInput"
          rows="1"
          placeholder="Zatoi'ye bir şey sor..."
        ></textarea>


        <button
          id="mobilePdfButton"
          class="voice-btn pdf-btn"
        >
          📎
        </button>


        <button
          id="mobileMicButton"
          class="voice-btn"
        >
          🎤
        </button>


        <button
          id="mobileVoiceToggle"
          class="voice-btn"
        >
          🔊
        </button>


        <button
          id="mobileSendButton"
          class="action-btn send-btn"
        >
          ➤
        </button>

      </div>

    </div>

  </section>


  <!-- HISTORY -->

  <aside class="side-panel">

    <div class="side-header">
      💬 Zatoi Sohbetleri
    </div>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </aside>

</div>


<!-- PDF INPUT -->

<input
  id="pdfInput"
  class="file-input"
  type="file"
  accept="application/pdf,.pdf"
>


<!-- MOBILE HISTORY -->

<div
  id="mobileHistoryOverlay"
  class="mobile-history-overlay"
>

  <div class="mobile-history-panel">

    <div class="mobile-history-header">

      <span>
        💬 Zatoi Sohbetleri
      </span>

      <button
        id="closeHistoryButton"
        class="close-history"
      >
        ×
      </button>

    </div>


    <div
      id="mobileHistoryList"
      class="mobile-history-list"
    ></div>

  </div>

</div>


<script>


/* ==========================================
   AYARLAR
========================================== */

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";


const CHATS_KEY =
  "zatoi_chats_v6";


const ACTIVE_CHAT_KEY =
  "zatoi_active_chat_v6";


const GLOBAL_MEMORY_KEY =
  "zatoi_global_memory_v6";


const VOICE_OUTPUT_KEY =
  "zatoi_voice_output_v1";


/* ==========================================
   ELEMENTLER
========================================== */

const messagesElement =
  document.getElementById(
    "messages"
  );


const chatTitleElement =
  document.getElementById(
    "chatTitle"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


const mobileHistoryList =
  document.getElementById(
    "mobileHistoryList"
  );


const desktopInput =
  document.getElementById(
    "desktopInput"
  );


const mobileInput =
  document.getElementById(
    "mobileInput"
  );


const pdfInput =
  document.getElementById(
    "pdfInput"
  );


let chats = [];

let activeChatId = null;

let selectedPdf = null;

let documentData = null;

let sending = false;


/* ==========================================
   HAFIZA
========================================== */

let globalMemory = {

  name: "",

  facts: [],

  preferences: []

};


function loadMemory() {

  try {

    const saved =
      localStorage.getItem(
        GLOBAL_MEMORY_KEY
      );


    if (saved) {

      const parsed =
        JSON.parse(saved);


      globalMemory = {

        name:
          parsed.name || "",

        facts:
          Array.isArray(
            parsed.facts
          )
            ? parsed.facts
            : [],

        preferences:
          Array.isArray(
            parsed.preferences
          )
            ? parsed.preferences
            : []

      };

    }

  } catch (error) {

    console.log(
      "Memory error:",
      error
    );

  }

}


function saveMemory() {

  localStorage.setItem(

    GLOBAL_MEMORY_KEY,

    JSON.stringify(
      globalMemory
    )

  );

}


loadMemory();


/* ==========================================
   CHAT
========================================== */

function createChat() {

  return {

    id:
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    title:
      "Yeni Sohbet",

    messages: [],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    document:
      null

  };

}


function saveChats() {

  localStorage.setItem(

    CHATS_KEY,

    JSON.stringify(
      chats
    )

  );


  localStorage.setItem(

    ACTIVE_CHAT_KEY,

    activeChatId || ""

  );

}


function loadChats() {

  try {

    const saved =
      localStorage.getItem(
        CHATS_KEY
      );


    if (saved) {

      chats =
        JSON.parse(saved);

    }

  } catch (error) {

    chats = [];

  }


  if (!Array.isArray(chats)) {

    chats = [];

  }


  chats =
    chats.map(
      chat => ({

        id:
          chat.id ||
          "chat_" +
          Date.now(),

        title:
          chat.title ||
          "Yeni Sohbet",

        messages:
          Array.isArray(
            chat.messages
          )
            ? chat.messages
            : [],

        createdAt:
          chat.createdAt ||
          Date.now(),

        updatedAt:
          chat.updatedAt ||
          Date.now(),

        document:
          chat.document ||
          null

      })
    );


  const savedActive =
    localStorage.getItem(
      ACTIVE_CHAT_KEY
    );


  if (
    savedActive &&
    chats.some(
      c =>
        c.id ===
        savedActive
    )
  ) {

    activeChatId =
      savedActive;

  } else if (
    chats.length
  ) {

    activeChatId =
      chats[0].id;

  } else {

    const chat =
      createChat();

    chats.push(chat);

    activeChatId =
      chat.id;

    saveChats();

  }

}


loadChats();


function getActiveChat() {

  return chats.find(
    chat =>
      chat.id ===
      activeChatId
  );

}


function createNewChat() {

  stopSpeaking();

  const chat =
    createChat();


  chats.unshift(chat);

  activeChatId =
    chat.id;


  saveChats();

  clearSelectedFile();

  renderAll();

  setInput("");

}


function selectChat(id) {

  stopSpeaking();

  activeChatId =
    id;


  saveChats();

  clearSelectedFile();

  renderAll();

  closeMobileHistory();

}


function deleteChat(id) {

  const index =
    chats.findIndex(
      chat =>
        chat.id === id
    );


  if (index === -1) {

    return;

  }


  const wasActive =
    activeChatId === id;


  chats.splice(
    index,
    1
  );


  if (
    chats.length === 0
  ) {

    const chat =
      createChat();


    chats.push(chat);

    activeChatId =
      chat.id;

  } else if (
    wasActive
  ) {

    activeChatId =
      chats[0].id;

  }


  saveChats();

  clearSelectedFile();

  renderAll();

}


/* ==========================================
   MOBİL
========================================== */

function isMobile() {

  return (
    window.innerWidth <=
    800
  );

}


/* ==========================================
   INPUT
========================================== */

function getInput() {

  return isMobile()
    ? mobileInput
    : desktopInput;

}


function setInput(value) {

  desktopInput.value =
    value;

  mobileInput.value =
    value;


  autoResize(
    desktopInput
  );

  autoResize(
    mobileInput
  );

}


function autoResize(textarea) {

  textarea.style.height =
    "auto";


  textarea.style.height =
    Math.min(
      textarea.scrollHeight,
      130
    ) + "px";

}


function focusInput() {

  setTimeout(
    () => {

      getInput().focus();

    },
    100
  );

}


/* ==========================================
   MESAJLAR
========================================== */

function renderMessages() {

  messagesElement.innerHTML =
    "";


  const chat =
    getActiveChat();


  if (
    !chat ||
    chat.messages.length === 0
  ) {

    messagesElement.innerHTML = `

      <div class="welcome">

        <h1>
          Zatoi AI 🤖
        </h1>

        <p>
          Merhaba! Ben Zatoi.
          <br>
          Sana nasıl yardımcı olabilirim?
        </p>

      </div>

    `;

    return;

  }


  let messages;


  if (isMobile()) {

    messages =
      [...chat.messages];

  } else {

    messages =
      [...chat.messages]
        .reverse();

  }


  messages.forEach(
    message => {

      if (
        message.role !==
          "user" &&
        message.role !==
          "assistant"
      ) {

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        message.role;


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message " +
        message.role;


      bubble.textContent =
        message.content;


      row.appendChild(
        bubble
      );


      messagesElement.appendChild(
        row
      );

    }
  );


  if (isMobile()) {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      },
      20
    );

  } else {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          0;

      },
      20
    );

  }

}


/* ==========================================
   TYPING
========================================== */

function showTyping() {

  hideTyping();


  const row =
    document.createElement(
      "div"
    );


  row.id =
    "typingRow";


  row.className =
    "typing-row";


  row.innerHTML = `

    <div class="typing">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  if (isMobile()) {

    messagesElement.appendChild(
      row
    );

  } else {

    messagesElement.insertBefore(
      row,
      messagesElement.firstChild
    );

  }

}


function hideTyping() {

  const element =
    document.getElementById(
      "typingRow"
    );


  if (element) {

    element.remove();

  }

}


/* ==========================================
   BAŞLIK
========================================== */

function updateTitle(
  chat,
  text
) {

  if (
    chat.title !==
    "Yeni Sohbet"
  ) {

    return;

  }


  const clean =
    text
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  chat.title =
    clean.length > 35
      ? clean.slice(0,35) + "..."
      : clean;

}


function updateChatTitle() {

  const chat =
    getActiveChat();


  chatTitleElement.textContent =
    chat
      ? chat.title
      : "Yeni Sohbet";

}


/* ==========================================
   HISTORY
========================================== */

function renderHistory() {

  renderHistoryList(
    historyList
  );

  renderHistoryList(
    mobileHistoryList
  );

}


function renderHistoryList(
  element
) {

  element.innerHTML =
    "";


  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      const open =
        document.createElement(
          "button"
        );


      open.className =
        "history-open";


      if (
        chat.id ===
        activeChatId
      ) {

        open.classList.add(
          "active"
        );

      }


      open.textContent =
        chat.title ||
        "Yeni Sohbet";


      open.onclick =
        () =>
          selectChat(
            chat.id
          );


      const del =
        document.createElement(
          "button"
        );


      del.className =
        "history-delete";


      del.textContent =
        "🗑️";


      del.onclick =
        event => {

          event.stopPropagation();

          deleteChat(
            chat.id
          );

        };


      item.appendChild(
        open
      );

      item.appendChild(
        del
      );


      element.appendChild(
        item
      );

    }
  );

}

function updateFileUI() {

  const desktopBox =
    document.getElementById(
      "desktopSelectedFile"
    );


  const mobileBox =
    document.getElementById(
      "mobileSelectedFile"
    );


  const desktopName =
    document.getElementById(
      "desktopSelectedFileName"
    );


  const mobileName =
    document.getElementById(
      "mobileSelectedFileName"
    );


  if (!selectedPdf) {

    desktopBox.classList.remove(
      "show"
    );

    mobileBox.classList.remove(
      "show"
    );

    return;

  }


  desktopBox.classList.add(
    "show"
  );


  mobileBox.classList.add(
    "show"
  );


  desktopName.textContent =
    selectedPdf.name;


  mobileName.textContent =
    selectedPdf.name;

}


function clearSelectedFile() {

  selectedPdf = null;

  documentData = null;

  pdfInput.value =
    "";


  updateFileUI();

}


async function uploadPdf(file) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        body:
          formData

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(

      data.details ||
      data.error ||
      "PDF yüklenemedi."

    );

  }


  if (
    !data.success ||
    !data.text
  ) {

    throw new Error(

      data.error ||
      "PDF'den metin çıkarılamadı."

    );

  }


  return {

    name:
      data.name ||
      file.name,

    text:
      data.text

  };

}


pdfInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if (!file) {

      return;

    }


    if (
      file.size >
      25 * 1024 * 1024
    ) {

      alert(
        "PDF 25 MB'dan büyük olamaz."
      );

      clearSelectedFile();

      return;

    }


    selectedPdf =
      file;


    updateFileUI();


    const desktopName =
      document.getElementById(
        "desktopSelectedFileName"
      );


    const mobileName =
      document.getElementById(
        "mobileSelectedFileName"
      );


    desktopName.textContent =
      "PDF okunuyor...";


    mobileName.textContent =
      "PDF okunuyor...";


    try {

      const result =
        await uploadPdf(
          file
        );


      documentData =
        result;


      const chat =
        getActiveChat();


      if (chat) {

        chat.document = {

          name:
            result.name,

          text:
            result.text.slice(
              0,
              60000
            )

        };


        chat.updatedAt =
          Date.now();


        saveChats();

      }


      desktopName.textContent =
        result.name +
        " ✓";


      mobileName.textContent =
        result.name +
        " ✓";


      focusInput();


    } catch (error) {

      console.log(
        "PDF error:",
        error
      );


      alert(

        "PDF okunurken hata oluştu:\n\n" +
        (
          error.message ||
          "Bilinmeyen hata"
        )

      );


      clearSelectedFile();

    }

  }
);

/* ==========================================
   MESAJ GÖNDER
========================================== */

async function sendMessage() {

  if (sending) {

    return;

  }


  const input =
    getInput();


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  const chat =
    getActiveChat();


  if (!chat) {

    return;

  }


  sending = true;


  chat.messages.push({

    role:
      "user",

    content:
      text,

    time:
      Date.now()

  });


  updateTitle(
    chat,
    text
  );


  chat.updatedAt =
    Date.now();


  saveChats();


  setInput("");


  renderAll();

  showTyping();


  try {

    /*
     * PDF burada doğrudan
     * document olarak Worker'a gidiyor.
     */

    let documentForAI =
      null;


    if (
      chat.document &&
      chat.document.text
    ) {

      documentForAI = {

        name:
          chat.document.name,

        text:
          chat.document.text.slice(
            0,
            60000
          )

      };

    }


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              memory:
                globalMemory,

              messages:
                chat.messages.slice(
                  -20
                ),

              document:
                documentForAI

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.details ||
        data.error ||
        "Sunucu hatası."

      );

    }


    /* =============================
       HAFIZA
    ============================= */

    if (data.memory) {

      globalMemory = {

        name:
          data.memory.name ||
          globalMemory.name ||
          "",

        facts:
          Array.isArray(
            data.memory.facts
          )
            ? data.memory.facts
            : globalMemory.facts,

        preferences:
          Array.isArray(
            data.memory.preferences
          )
            ? data.memory.preferences
            : globalMemory.preferences

      };


      saveMemory();

    }


    /* =============================
       CEVAP
    ============================= */

    let reply =
      data.reply;


    if (!reply) {

      reply =
        "Üzgünüm, cevap oluşturulamadı.";

    }


    chat.messages.push({

      role:
        "assistant",

      content:
        reply,

      time:
        Date.now()

    });


    chat.updatedAt =
      Date.now();


    saveChats();


    hideTyping();

    renderAll();


    if (
      voiceOutputEnabled
    ) {

      speakText(
        reply
      );

    }


  } catch (error) {

    console.log(
      "Chat error:",
      error
    );


    chat.messages.push({

      role:
        "assistant",

      content:
        "Bağlantıda bir sorun oluştu. Lütfen tekrar dene.",

      time:
        Date.now()

    });


    saveChats();


    hideTyping();

    renderAll();

  }


  sending = false;

  focusInput();

}

/* ==========================================
   SESLİ KONUŞMA
========================================== */

let recognition =
  null;

let isListening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "tr-TR";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      isListening =
        true;

      updateMic();

    };


  recognition.onend =
    () => {

      isListening =
        false;

      updateMic();

    };


  recognition.onresult =
    event => {

      let finalText =
        "";


      let interimText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript;


        if (
          event.results[i]
            .isFinal
        ) {

          finalText +=
            transcript;

        } else {

          interimText +=
            transcript;

        }

      }


      if (
        finalText.trim()
      ) {

        setInput(
          finalText.trim()
        );

        sendMessage();

      } else if (
        interimText.trim()
      ) {

        setInput(
          interimText
        );

      }

    };

}


function updateMic() {

  const buttons = [

    document.getElementById(
      "micButton"
    ),

    document.getElementById(
      "mobileMicButton"
    )

  ];


  buttons.forEach(
    button => {

      if (isListening) {

        button.textContent =
          "⏹️";

        button.classList.add(
          "active"
        );

      } else {

        button.textContent =
          "🎤";

        button.classList.remove(
          "active"
        );

      }

    }
  );

}


function toggleMic() {

  if (!recognition) {

    alert(
      "Bu tarayıcı sesli konuşmayı desteklemiyor. Chrome kullanmayı dene."
    );

    return;

  }


  if (isListening) {

    recognition.stop();

  } else {

    try {

      recognition.start();

    } catch (error) {

      console.log(
        error
      );

    }

  }

}

  .getElementById(

  )
  .onclick =
    toggleMic;


/* ==========================================
   SESLİ CEVAP
========================================== */

let voiceOutputEnabled =
  true;


try {

  const saved =
    localStorage.getItem(
      VOICE_OUTPUT_KEY
    );


  if (
    saved !== null
  ) {

    voiceOutputEnabled =
      saved === "true";

  }

} catch (error) {}


function updateVoiceButton() {

  const icon =
    voiceOutputEnabled
      ? "🔊"
      : "🔇";


  document
    .getElementById(
      "voiceToggle"
    )
    .textContent =
      icon;


  document
    .getElementById(
      "mobileVoiceToggle"
    )
    .textContent =
      icon;

}


function stopSpeaking() {

  if (
    "speechSynthesis" in
    window
  ) {

    speechSynthesis.cancel();

  }

}


function speakText(text) {

  if (
    !voiceOutputEnabled ||
    !("speechSynthesis" in window)
  ) {

    return;

  }


  stopSpeaking();


  const chunks = [];

  let current = "";


  const sentences =
    text.split(
      /(?<=[.!?])\s+/
    );


  sentences.forEach(
    sentence => {

      if (
        current.length +
        sentence.length >
        220
      ) {

        if (
          current.trim()
        ) {

          chunks.push(
            current.trim()
          );

        }


        current =
          sentence;

      } else {

        current +=
          " " +
          sentence;

      }

    }
  );


  if (
    current.trim()
  ) {

    chunks.push(
      current.trim()
    );

  }


  let index =
    0;


  function next() {

    if (
      index >=
      chunks.length
    ) {

      return;

    }


    const utterance =
      new SpeechSynthesisUtterance(
        chunks[index]
      );


    utterance.lang =
      "tr-TR";


    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    utterance.onend =
      () => {

        index++;

        next();

      };


    speechSynthesis.speak(
      utterance
    );

  }


  next();

}


function toggleVoice() {

  voiceOutputEnabled =
    !voiceOutputEnabled;


  if (
    !voiceOutputEnabled
  ) {

    stopSpeaking();

  }


  localStorage.setItem(

    VOICE_OUTPUT_KEY,

    String(
      voiceOutputEnabled
    )

  );


  updateVoiceButton();

}

    "voiceToggle"
  )

    toggleVoice;


document
  .getElementById(
    "mobileVoiceToggle"
  )

    toggleVoice;


updateVoiceButton();
