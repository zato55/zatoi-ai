<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zatoi AI</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zatoi AI">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =================================
       AUTH
    ================================= */

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #182536 0%,
          #0b0f14 55%
        );
    }

    .auth-screen.hidden {
      display: none;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;

      padding: 30px 24px;

      background: #101720;

      border:
        1px solid #263442;

      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);

      text-align: center;
    }

    .auth-logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #17212b;

      font-size: 34px;
    }

    .auth-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .auth-subtitle {
      margin: 0 0 22px;
      color: #8b9aaa;
      font-size: 14px;
    }

    .auth-error {
      display: none;

      margin-bottom: 14px;
      padding: 10px 12px;

      border:
        1px solid #7f3030;

      border-radius: 10px;

      background: #291519;
      color: #ff9d9d;

      font-size: 13px;
      line-height: 1.4;
    }

    .auth-error.show {
      display: block;
    }

    .auth-input {
      width: 100%;

      height: 46px;

      margin-bottom: 10px;

      padding: 0 13px;

      outline: none;

      border:
        1px solid #293846;

      border-radius: 10px;

      background: #0b1118;
      color: white;

      font-size: 15px;
    }

    .auth-input:focus {
      border-color: #2563eb;
    }

    .auth-submit {
      width: 100%;

      height: 46px;

      margin-top: 8px;

      border-radius: 10px;

      background: #2563eb;
      color: white;

      font-size: 15px;
      font-weight: 700;
    }

    .auth-submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .auth-switch {
      width: 100%;

      margin-top: 12px;

      padding: 9px;

      background: transparent;
      color: #8fb8ff;

      font-size: 14px;
    }

    .auth-info {
      margin-top: 18px;

      color: #687888;

      font-size: 12px;
      line-height: 1.5;
    }

    /* =================================
       APP
    ================================= */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      background: #0b0f14;
    }

    .app.hidden {
      display: none;
    }

    /* =================================
       CHAT
    ================================= */

    .chat-column {
      flex: 1;
      min-width: 0;

      height: 100%;

      display: flex;
      flex-direction: column;
    }

    .chat-top {
      height: 58px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom:
        1px solid #1c2530;

      background: #0d1218;
    }

    .chat-title {
      min-width: 0;

      font-size: 17px;
      font-weight: 700;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-area {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-right: 2px;
    }

    .account-name {
      max-width: 130px;

      padding: 7px 9px;

      border-radius: 9px;

      background: #17212b;
      color: #cbd5df;

      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      background: #171d23;
      color: #ff9a9a;

      border:
        1px solid #29323a;

      border-radius: 9px;

      padding: 8px 10px;

      font-size: 12px;
    }

    .new-chat-btn,
    .mobile-history-btn {
      background: #17212b;
      color: white;

      border:
        1px solid #263442;

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 13px;
    }

    .mobile-history-btn {
      display: none;
    }

    /* =================================
       INPUT
    ================================= */

    .desktop-input-area {
      flex-shrink: 0;

      padding: 12px 18px;

      background: #0b0f14;

      border-bottom:
        1px solid #1c2530;
    }

    .input-box {
      width: 100%;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      background: #111820;

      border:
        1px solid #273440;

      border-radius: 14px;

      padding: 8px;
    }

    textarea {
      flex: 1;
      min-width: 0;

      resize: none;

      max-height: 130px;
      min-height: 40px;

      border: none;
      outline: none;

      background: transparent;
      color: white;

      font-size: 15px;
      line-height: 1.4;

      padding: 10px;
    }

    textarea::placeholder {
      color: #71808f;
    }

    .action-btn,
    .voice-btn {
      flex-shrink: 0;

      height: 40px;
      min-width: 40px;

      border-radius: 10px;

      background: #1b2732;
      color: white;

      font-size: 14px;

      padding: 0 12px;
    }

    .send-btn {
      background: #2563eb;
      font-weight: 700;
    }

    .pdf-btn {
      font-size: 18px;
      padding: 0 10px;
    }

    .voice-btn.active {
      background: #b91c1c;
    }

    /* =================================
       PDF
    ================================= */

    .file-input {
      display: none;
    }

    .selected-file {
      display: none;

      align-items: center;
      gap: 8px;

      padding: 8px 12px;
      margin: 0 18px 8px;

      background: #101922;

      border:
        1px solid #263542;

      border-radius: 10px;

      font-size: 13px;
      color: #cbd5df;
    }

    .selected-file.show {
      display: flex;
    }

    .selected-file-name {
      flex: 1;
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file-btn {
      background: transparent;
      color: #ff8b8b;
      font-size: 18px;
    }

    /* =================================
       MESSAGES
    ================================= */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      scrollbar-width: thin;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(78%, 850px);

      padding: 11px 14px;

      border-radius: 14px;

      font-size: 15px;
      line-height: 1.5;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: #2563eb;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #17212b;

      border:
        1px solid #253341;

      border-bottom-left-radius: 5px;
    }

    .welcome {
      margin: auto;

      text-align: center;

      color: #8b9aaa;

      padding: 30px;
    }

    .welcome h1 {
      color: white;

      font-size: 30px;

      margin: 0 0 12px;
    }

    .welcome p {
      line-height: 1.7;
    }

    /* =================================
       TYPING
    ================================= */

    .typing-row {
      display: flex;
      justify-content: flex-start;
    }

    .typing {
      background: #17212b;

      border:
        1px solid #253341;

      border-radius: 14px;

      padding: 11px 14px;

      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      background: #8999a8;

      border-radius: 50%;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =================================
       HISTORY
    ================================= */

    .side-panel {
      width: 280px;
      height: 100%;

      flex-shrink: 0;

      border-left:
        1px solid #1c2530;

      background: #0d1218;

      display: flex;
      flex-direction: column;
    }

    .side-header {
      height: 58px;

      display: flex;
      align-items: center;

      padding: 0 16px;

      font-weight: 700;

      border-bottom:
        1px solid #1c2530;
    }

    .history-list {
      flex: 1;

      overflow-y: auto;

      padding: 10px;
    }

    .history-item {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 7px;
    }

    .history-open {
      flex: 1;
      min-width: 0;

      text-align: left;

      background: #111820;
      color: #dce4eb;

      border:
        1px solid #202d39;

      border-radius: 10px;

      padding: 10px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .history-open.active {
      border-color: #2563eb;
      background: #142338;
    }

    .history-delete {
      width: 34px;
      height: 34px;

      border-radius: 8px;

      background: #171d23;

      color: #ff8585;
    }

    /* =================================
       MOBILE
    ================================= */

    .mobile-input-area {
      display: none;
    }

    .mobile-history-overlay {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background: rgba(0,0,0,.6);
    }

    .mobile-history-overlay.show {
      display: block;
    }

    .mobile-history-panel {
      position: absolute;

      top: 0;
      left: 0;
      bottom: 0;

      width: min(320px, 85vw);

      background: #0d1218;

      border-right:
        1px solid #26313d;

      display: flex;

      flex-direction: column;
    }

    .mobile-history-header {
      height: 58px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 14px;

      border-bottom:
        1px solid #1c2530;
    }

    .close-history {
      width: 35px;
      height: 35px;

      border-radius: 8px;

      background: #19222b;

      color: white;

      font-size: 18px;
    }

    .mobile-history-list {
      flex: 1;

      overflow-y: auto;

      padding: 10px;
    }

    @media (max-width: 800px) {

      .app {
        height: 100dvh;
      }

      .side-panel {
        display: none;
      }

      .chat-top {
        height: 56px;
        padding: 0 10px;
      }

      .chat-title {
        max-width: 130px;
      }

      .mobile-history-btn {
        display: block;

        padding: 8px 9px;

        font-size: 12px;
      }

      .new-chat-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .account-area {
        margin-right: 0;
      }

      .account-name {
        display: none;
      }

      .logout-btn {
        padding: 8px 9px;
      }

      .desktop-input-area {
        display: none;
      }

      .messages {
        padding: 12px 10px 100px;
      }

      .message {
        max-width: 88%;
      }

      .mobile-input-area {
        display: block;

        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 20;

        padding: 8px;

        background: rgba(11,15,20,.97);

        border-top:
          1px solid #1c2530;
      }

      .mobile-input-area .selected-file {
        margin: 0 0 7px;
      }

      .mobile-input-area .input-box {
        padding: 6px;
      }

      .mobile-input-area textarea {
        min-height: 38px;
        max-height: 100px;

        padding: 9px;

        font-size: 14px;
      }

      .mobile-input-area .voice-btn,
      .mobile-input-area .action-btn {
        height: 38px;
        min-width: 38px;
        padding: 0 8px;
      }

      .auth-card {
        padding: 26px 20px;
      }

    }

  </style>

</head>

<body>


<!-- ==========================================
     AUTH EKRANI
========================================== -->

<div
  id="authScreen"
  class="auth-screen"
>

  <div class="auth-card">

    <div class="auth-logo">
      🤖
    </div>

    <h1>
      Zatoi AI
    </h1>

    <p
      id="authSubtitle"
      class="auth-subtitle"
    >
      Hesabına giriş yap
    </p>

    <div
      id="authError"
      class="auth-error"
    ></div>

    <input
      id="authUsername"
      class="auth-input"
      type="text"
      autocomplete="username"
      placeholder="Kullanıcı adı"
      maxlength="40"
    >

    <input
      id="authPassword"
      class="auth-input"
      type="password"
      autocomplete="current-password"
      placeholder="Şifre"
      maxlength="128"
    >

    <input
      id="authPasswordConfirm"
      class="auth-input"
      type="password"
      autocomplete="new-password"
      placeholder="Şifre tekrar"
      maxlength="128"
      style="display:none;"
    >

    <button
      id="authSubmit"
      class="auth-submit"
    >
      Giriş Yap
    </button>

    <button
      id="authSwitch"
      class="auth-switch"
    >
      Hesabın yok mu? Hesap oluştur
    </button>

    <div class="auth-info">
      E-posta veya başka kişisel bilgi gerekmiyor.
    </div>

  </div>

</div>


<!-- ==========================================
     ANA UYGULAMA
========================================== -->

<div
  id="app"
  class="app hidden"
>


  <section class="chat-column">


    <div class="chat-top">

      <div
        id="chatTitle"
        class="chat-title"
      >
        Yeni Sohbet
      </div>


      <div class="top-actions">

        <div class="account-area">

          <span
            id="accountUsername"
            class="account-name"
          ></span>

          <button
            id="logoutButton"
            class="logout-btn"
          >
            Çıkış
          </button>

        </div>


        <button
          id="mobileHistoryButton"
          class="mobile-history-btn"
        >
          📚 Geçmiş
        </button>


        <button
          id="newChatButton"
          class="new-chat-btn"
        >
          ➕ Yeni Sohbet
        </button>

      </div>

    </div>


    <div class="desktop-input-area">


      <div
        id="desktopSelectedFile"
        class="selected-file"
      >

        <span>📄</span>

        <span
          id="desktopSelectedFileName"
          class="selected-file-name"
        ></span>

        <button
          id="desktopRemoveFile"
          class="remove-file-btn"
        >
          ×
        </button>

      </div>


      <div class="input-box">

        <textarea
          id="desktopInput"
          rows="1"
          placeholder="Zatoi'ye bir şey sor..."
        ></textarea>


        <button
          id="desktopPdfButton"
          class="voice-btn pdf-btn"
          title="PDF yükle"
        >
          📎
        </button>


        <button
          id="micButton"
          class="voice-btn"
        >
          🎤
        </button>


        <button
          id="voiceToggle"
          class="voice-btn"
        >
          🔊
        </button>


        <button
          id="sendButton"
          class="action-btn send-btn"
        >
          Gönder
        </button>

      </div>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="mobile-input-area">


      <div
        id="mobileSelectedFile"
        class="selected-file"
      >

        <span>📄</span>

        <span
          id="mobileSelectedFileName"
          class="selected-file-name"
        ></span>

        <button
          id="mobileRemoveFile"
          class="remove-file-btn"
        >
          ×
        </button>

      </div>


      <div class="input-box">

        <textarea
          id="mobileInput"
          rows="1"
          placeholder="Zatoi'ye bir şey sor..."
        ></textarea>


        <button
          id="mobilePdfButton"
          class="voice-btn pdf-btn"
        >
          📎
        </button>


        <button
          id="mobileMicButton"
          class="voice-btn"
        >
          🎤
        </button>


        <button
          id="mobileVoiceToggle"
          class="voice-btn"
        >
          🔊
        </button>


        <button
          id="mobileSendButton"
          class="action-btn send-btn"
        >
          ➤
        </button>

      </div>

    </div>

  </section>


  <aside class="side-panel">

    <div class="side-header">
      💬 Zatoi Sohbetleri
    </div>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </aside>

</div>


<input
  id="pdfInput"
  class="file-input"
  type="file"
  accept="application/pdf,.pdf"
>


<div
  id="mobileHistoryOverlay"
  class="mobile-history-overlay"
>

  <div class="mobile-history-panel">

    <div class="mobile-history-header">

      <span>
        💬 Zatoi Sohbetleri
      </span>

      <button
        id="closeHistoryButton"
        class="close-history"
      >
        ×
      </button>

    </div>


    <div
      id="mobileHistoryList"
      class="mobile-history-list"
    ></div>

  </div>

</div>


<script>


/* ==========================================
   AYARLAR
========================================== */

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";


const CHATS_KEY =
  "zatoi_chats_v6";


const ACTIVE_CHAT_KEY =
  "zatoi_active_chat_v6";


const GLOBAL_MEMORY_KEY =
  "zatoi_global_memory_v6";


const VOICE_OUTPUT_KEY =
  "zatoi_voice_output_v1";


const AUTH_TOKEN_KEY =
  "zatoi_auth_token_v1";


const AUTH_USER_KEY =
  "zatoi_auth_user_v1";


/* ==========================================
   AUTH DURUMU
========================================== */

let authToken =
  localStorage.getItem(
    AUTH_TOKEN_KEY
  ) || "";


let currentUser = null;


try {

  currentUser =
    JSON.parse(
      localStorage.getItem(
        AUTH_USER_KEY
      ) || "null"
    );

} catch (error) {

  currentUser = null;

}


/* ==========================================
   ELEMENTLER
========================================== */

const authScreen =
  document.getElementById(
    "authScreen"
  );


const app =
  document.getElementById(
    "app"
  );


const authSubtitle =
  document.getElementById(
    "authSubtitle"
  );


const authError =
  document.getElementById(
    "authError"
  );


const authUsername =
  document.getElementById(
    "authUsername"
  );


const authPassword =
  document.getElementById(
    "authPassword"
  );


const authPasswordConfirm =
  document.getElementById(
    "authPasswordConfirm"
  );


const authSubmit =
  document.getElementById(
    "authSubmit"
  );


const authSwitch =
  document.getElementById(
    "authSwitch"
  );


const accountUsername =
  document.getElementById(
    "accountUsername"
  );


const messagesElement =
  document.getElementById(
    "messages"
  );


const chatTitleElement =
  document.getElementById(
    "chatTitle"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


const mobileHistoryList =
  document.getElementById(
    "mobileHistoryList"
  );


const desktopInput =
  document.getElementById(
    "desktopInput"
  );


const mobileInput =
  document.getElementById(
    "mobileInput"
  );


const pdfInput =
  document.getElementById(
    "pdfInput"
  );


let chats = [];

let activeChatId = null;

let selectedPdf = null;

let documentData = null;

let sending = false;

let authMode = "login";


/* ==========================================
   AUTH HATA MESAJI
========================================== */

function showAuthError(message) {

  authError.textContent =
    message;

  authError.classList.add(
    "show"
  );

}


function clearAuthError() {

  authError.textContent =
    "";

  authError.classList.remove(
    "show"
  );

}


/* ==========================================
   AUTH MODU
========================================== */

function updateAuthMode() {

  clearAuthError();

  authUsername.value = "";
  authPassword.value = "";
  authPasswordConfirm.value = "";

  if (authMode === "login") {

    authSubtitle.textContent =
      "Hesabına giriş yap";

    authPassword.autocomplete =
      "current-password";

    authPasswordConfirm.style.display =
      "none";

    authSubmit.textContent =
      "Giriş Yap";

    authSwitch.textContent =
      "Hesabın yok mu? Hesap oluştur";

  } else {

    authSubtitle.textContent =
      "Yeni Zatoi hesabını oluştur";

    authPassword.autocomplete =
      "new-password";

    authPasswordConfirm.style.display =
      "block";

    authSubmit.textContent =
      "Hesap Oluştur";

    authSwitch.textContent =
      "Zaten hesabın var mı? Giriş yap";

  }

}


authSwitch.onclick =
  () => {

    authMode =
      authMode === "login"
        ? "register"
        : "login";

    updateAuthMode();

  };


/* ==========================================
   AUTH API
========================================== */

async function authRequest(
  action,
  username = "",
  password = ""
) {

  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          ...(authToken
            ? {
                "Authorization":
                  `Bearer ${authToken}`
              }
            : {})

        },

        body:
          JSON.stringify({

            type:
              "auth",

            action:
              action,

            username:
              username,

            password:
              password

          })

      }
    );


  let data = {};

  try {

    data =
      await response.json();

  } catch (error) {

    data = {};

  }


  if (!response.ok) {

    throw new Error(

      data.details ||
      data.error ||
      "İşlem başarısız."

    );

  }


  return data;

}


/* ==========================================
   AUTH BAŞARILI
========================================== */

function saveAuth(
  token,
  user,
  memory
) {

  authToken =
    token || "";

  currentUser =
    user || null;


  if (authToken) {

    localStorage.setItem(
      AUTH_TOKEN_KEY,
      authToken
    );

  } else {

    localStorage.removeItem(
      AUTH_TOKEN_KEY
    );

  }


  if (currentUser) {

    localStorage.setItem(

      AUTH_USER_KEY,

      JSON.stringify(
        currentUser
      )

    );

  } else {

    localStorage.removeItem(
      AUTH_USER_KEY
    );

  }


  if (memory) {

    globalMemory = {

      name:
        memory.name || "",

      facts:
        Array.isArray(
          memory.facts
        )
          ? memory.facts
          : [],

      preferences:
        Array.isArray(
          memory.preferences
        )
          ? memory.preferences
          : []

    };


    saveMemory();

  }


  if (currentUser) {

    accountUsername.textContent =
      "👤 " +
      currentUser.username;

  } else {

    accountUsername.textContent =
      "";

  }

}

/* ==========================================
   REGISTER
========================================== */

async function registerAccount() {

  clearAuthError();


  const username =
    authUsername.value.trim();


  const password =
    authPassword.value;


  const confirm =
    authPasswordConfirm.value;


  if (!username) {

    showAuthError(
      "Kullanıcı adı gir."
    );

    return;

  }


  if (password.length < 8) {

    showAuthError(
      "Şifre en az 8 karakter olmalı."
    );

    return;

  }


  if (password !== confirm) {

    showAuthError(
      "Şifreler aynı değil."
    );

    return;

  }


  authSubmit.disabled =
    true;


  authSubmit.textContent =
    "Oluşturuluyor...";


  try {

    const data =
      await authRequest(
        "register",
        username,
        password
      );


    if (
      !data.token ||
      !data.user
    ) {

      throw new Error(
        "Hesap oluşturuldu ancak oturum başlatılamadı."
      );

    }


    saveAuth(
      data.token,
      data.user,
      data.memory
    );


    authUsername.value = "";
    authPassword.value = "";
    authPasswordConfirm.value = "";


    showApp();


  } catch (error) {

    console.log(
      "Register error:",
      error
    );


    showAuthError(
      error.message ||
      "Hesap oluşturulamadı."
    );

  }


  authSubmit.disabled =
    false;


  authSubmit.textContent =
    "Hesap Oluştur";

}

   LOGIN
========================================== */

async function loginAccount() {

  clearAuthError();


  const username =

  const password =

  if (!username) {

/* ==========================================
   CHAT
========================================== */

function createChat() {

  return {

    id:
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    title:
      "Yeni Sohbet",

    messages: [],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    document:
      null

  };

}


function saveChats() {

  localStorage.setItem(

    CHATS_KEY,

    JSON.stringify(
      chats
    )

  );


  localStorage.setItem(

    ACTIVE_CHAT_KEY,

    activeChatId || ""

  );

}


function loadChats() {

  try {

    const saved =
      localStorage.getItem(
        CHATS_KEY
      );


    if (saved) {

      chats =
        JSON.parse(saved);

    }

  } catch (error) {

    chats = [];

  }


  if (!Array.isArray(chats)) {

    chats = [];

  }


  chats =
    chats.map(
      chat => ({

        id:
          chat.id ||
          "chat_" +
          Date.now(),

        title:
          chat.title ||
          "Yeni Sohbet",

        messages:
          Array.isArray(
            chat.messages
          )
            ? chat.messages
            : [],

        createdAt:
          chat.createdAt ||
          Date.now(),

        updatedAt:
          chat.updatedAt ||
          Date.now(),

        document:
          chat.document ||
          null

      })
    );


  const savedActive =
    localStorage.getItem(
      ACTIVE_CHAT_KEY
    );


  if (
    savedActive &&
    chats.some(
      c =>
        c.id ===
        savedActive
    )
  ) {

    activeChatId =
      savedActive;

  } else if (
    chats.length
  ) {

    activeChatId =
      chats[0].id;

  } else {

    const chat =
      createChat();

    chats.push(chat);

    activeChatId =
      chat.id;

    saveChats();

  }

}


loadChats();


function getActiveChat() {

  return chats.find(
    chat =>
      chat.id ===
      activeChatId
  );

}


function createNewChat() {

  stopSpeaking();

  const chat =
    createChat();


  chats.unshift(chat);

  activeChatId =
    chat.id;


  saveChats();

  clearSelectedFile();

  renderAll();

  setInput("");

}


function selectChat(id) {

  stopSpeaking();

  activeChatId =
    id;


  saveChats();

  clearSelectedFile();

  renderAll();

  closeMobileHistory();

}


function deleteChat(id) {

  const index =
    chats.findIndex(
      chat =>
        chat.id === id
    );


  if (index === -1) {
    return;
  }


  const wasActive =
    activeChatId === id;


  chats.splice(
    index,
    1
  );


  if (
    chats.length === 0
  ) {

    const chat =
      createChat();


    chats.push(chat);

    activeChatId =
      chat.id;

  } else if (
    wasActive
  ) {

    activeChatId =
      chats[0].id;

  }


  saveChats();

  clearSelectedFile();

  renderAll();

}

/* ==========================================
   MESAJLAR
========================================== */

function renderMessages() {

  messagesElement.innerHTML =
    "";


  const chat =
    getActiveChat();


  if (
    !chat ||
    chat.messages.length === 0
  ) {

    messagesElement.innerHTML = `

      <div class="welcome">

        <h1>
          Zatoi AI 🤖
        </h1>

        <p>
          Merhaba! Ben Zatoi.
          <br>
          Sana nasıl yardımcı olabilirim?
        </p>

      </div>

    `;

    return;

  }


  let messages;


  if (isMobile()) {

    messages =
      [...chat.messages];

  } else {

    messages =
      [...chat.messages]
        .reverse();

  }


  messages.forEach(
    message => {

      if (
        message.role !==
          "user" &&
        message.role !==
          "assistant"
      ) {

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        message.role;


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message " +
        message.role;


      bubble.textContent =
        message.content;


      row.appendChild(
        bubble
      );


      messagesElement.appendChild(
        row
      );

    }
  );


  if (isMobile()) {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      },
      20
    );

  } else {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          0;

      },
      20
    );

  }

}

function updateFileUI() {

  const desktopBox =
    document.getElementById(
      "desktopSelectedFile"
    );

    );


  const desktopName =

    );

    );

    );

    );

  }


  desktopBox.classList.add(

  );

function clearSelectedFile() {

  selectedPdf = null;

  documentData = null;

  pdfInput.value =
    "";


  updateFileUI();

}


async function uploadPdf(file) {

  if (!authToken) {

    throw new Error(
      "Oturum açman gerekiyor."
    );

  }


  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        headers: {

          "Authorization":
            `Bearer ${authToken}`

        },

        body:
          formData

      }
    );


  if (
    response.status ===
    401
  ) {

    await forceLogout();

    throw new Error(
      "Oturum süren dolmuş. Tekrar giriş yap."
    );

  }


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(

      data.details ||
      data.error ||
      "PDF yüklenemedi."

    );

  }


  if (
    !data.success ||
    !data.text
  ) {

    throw new Error(

      data.error ||
      "PDF'den metin çıkarılamadı."

    );

  }


  return {

    name:
      data.name ||
      file.name,

    text:
      data.text

  };

}


pdfInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    if (
      file.size >
      25 * 1024 * 1024
    ) {

      alert(
        "PDF 25 MB'dan büyük olamaz."
      );

      clearSelectedFile();

      return;

    }


    selectedPdf =
      file;


    updateFileUI();


    const desktopName =
      document.getElementById(
        "desktopSelectedFileName"
      );


    const mobileName =
      document.getElementById(
        "mobileSelectedFileName"
      );


    desktopName.textContent =
      "PDF okunuyor...";


    mobileName.textContent =
      "PDF okunuyor...";


    try {

      const result =
        await uploadPdf(
          file
        );


      documentData =
        result;


      const chat =
        getActiveChat();


      if (chat) {

        chat.document = {

          name:
            result.name,

          text:
            result.text.slice(
              0,
              60000
            )

        };


        chat.updatedAt =

        saveChats();

      }


      desktopName.textContent =
        result.name +
        " ✓";


      mobileName.textContent =
        result.name +
        " ✓";


      focusInput();


    } catch (error) {

      console.log(
        "PDF error:",
        error
      );


      if (
        error.message !==
        "Oturum süren dolmuş. Tekrar giriş yap."
      ) {

        alert(

          "PDF okunurken hata oluştu:\n\n" +
          (
            error.message ||
            "Bilinmeyen hata"
          )

        );

      }


      clearSelectedFile();

    }

  }
);

async function forceLogout() {

  currentUser = null;


  localStorage.removeItem(

    AUTH_USER_KEY
  );

/* ==========================================
   MESAJ GÖNDER
========================================== */

async function sendMessage() {

  if (sending) {
    return;
  }


  if (!authToken) {

    showAuthScreen();

    return;

  }


  const input =
    getInput();


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  const chat =
    getActiveChat();


  if (!chat) {
    return;
  }


  sending = true;


  chat.messages.push({

    role:
      "user",

    content:
      text,

    time:
      Date.now()

  });


  updateTitle(
    chat,
    text
  );


  chat.updatedAt =
    Date.now();


  saveChats();


  setInput("");


  renderAll();

  showTyping();


  try {

    let documentForAI =
      null;


    if (
      chat.document &&
      chat.document.text
    ) {

      documentForAI = {

        name:
          chat.document.name,

        text:
          chat.document.text.slice(
            0,
            60000
          )

      };

    }


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${authToken}`

          },

          body:
            JSON.stringify({

              memory:
                globalMemory,

              messages:
                chat.messages.slice(
                  -20
                ),

              document:
                documentForAI

            })

        }
      );


    let data = {};
    let rawResponse = "";


    try {

      rawResponse =
        await response.text();


      if (rawResponse) {

        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (parseError) {

          data = {};

        }

      }

    } catch (readError) {

      console.log(
        "Response read error:",
        readError
      );

    }


    /* =============================
       OTURUM GEÇERSİZ
    ============================= */

    if (
      response.status ===
      401
    ) {

      hideTyping();

      sending = false;

      await forceLogout();

      alert(
        "Oturum süren dolmuş. Lütfen tekrar giriş yap."
      );

      return;

    }


    if (!response.ok) {

      const serverMessage =
        data.details ||
        data.error ||
        rawResponse ||
        "Sunucu hatası.";


      throw new Error(

        `HTTP ${response.status} ${response.statusText || ""}\n${serverMessage}`.trim()

      );

    }


    /* =============================
       HAFIZA
    ============================= */

    if (data.memory) {

      globalMemory = {

        name:
          data.memory.name ||
          globalMemory.name ||
          "",

        facts:
          Array.isArray(
            data.memory.facts
          )
            ? data.memory.facts
            : globalMemory.facts,

        preferences:
          Array.isArray(
            data.memory.preferences
          )
            ? data.memory.preferences
            : globalMemory.preferences

      };


      saveMemory();

    }


    /* =============================
       CEVAP
    ============================= */

    let reply =
      data.reply;


    if (!reply) {

      const debugInfo =
        data.error ||
        data.details ||
        rawResponse ||
        "Worker 200 döndürdü ama 'reply' alanı gelmedi.";


      reply =
        `⚠️ Zatoi cevap üretemedi.\n\n${debugInfo}`;

    }


    chat.messages.push({

      role:
        "assistant",

      content:
        reply,

      time:
        Date.now()

    });


    chat.updatedAt =
      Date.now();


    saveChats();


    hideTyping();

    renderAll();


    if (
      voiceOutputEnabled
    ) {

      speakText(
        reply
      );

    }


  } catch (error) {

    console.log(
      "Chat error:",
      error
    );


    hideTyping();


    const errorText =
      error && error.message
        ? error.message
        : String(
            error ||
            "Bilinmeyen hata"
          );


    chat.messages.push({

      role:
        "assistant",

      content:
        `⚠️ Hata oluştu:\n\n${errorText}`,

      time:
        Date.now()

    });


    saveChats();

    renderAll();

  }


  sending = false;

  focusInput();

}

/* ==========================================
   SESLİ KONUŞMA
========================================== */

let recognition =
  null;

let isListening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "tr-TR";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      isListening =
        true;

      updateMic();

    };


  recognition.onend =
    () => {

      isListening =
        false;

      updateMic();

    };


  recognition.onresult =
    event => {

      let finalText =
        "";


      let interimText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript;


        if (
          event.results[i]
            .isFinal
        ) {

          finalText +=
            transcript;

        } else {

          interimText +=
            transcript;

        }

      }


      if (
        finalText.trim()
      ) {

        setInput(
          finalText.trim()
        );

        sendMessage();

      } else if (
        interimText.trim()
      ) {

        setInput(
          interimText
        );

      }

    };

}


function updateMic() {

  const buttons = [

    document.getElementById(
      "micButton"
    ),

    document.getElementById(
      "mobileMicButton"
    )

  ];


  buttons.forEach(
    button => {

      if (!button) {
        return;
      }


      if (isListening) {

        button.textContent =
          "⏹️";

        button.classList.add(
          "active"
        );

      } else {

        button.textContent =
          "🎤";

        button.classList.remove(
          "active"
        );

      }

    }
  );

}


function toggleMic() {

  if (!recognition) {

    alert(
      "Bu tarayıcı sesli konuşmayı desteklemiyor. Chrome kullanmayı dene."
    );

    return;

  }


  if (isListening) {

    recognition.stop();

  } else {

    try {

      recognition.start();

    } catch (error) {

      console.log(
        error
      );

    }

  }

}


document
  .getElementById(
    "micButton"
  )
  .onclick =
    toggleMic;


document
  .getElementById(
    "mobileMicButton"
  )
  .onclick =
    toggleMic;


/* ==========================================
   SESLİ CEVAP
========================================== */

let voiceOutputEnabled =
  true;


try {

  const saved =
    localStorage.getItem(
      VOICE_OUTPUT_KEY
    );


  if (
    saved !== null
  ) {

    voiceOutputEnabled =
      saved === "true";

  }

} catch (error) {}


function updateVoiceButton() {

  const icon =
    voiceOutputEnabled
      ? "🔊"
      : "🔇";


  document
    .getElementById(
      "voiceToggle"
    )
    .textContent =
      icon;


  document
    .getElementById(
      "mobileVoiceToggle"
    )
    .textContent =
      icon;

}


function stopSpeaking() {

  if (
    "speechSynthesis" in
    window
  ) {

    speechSynthesis.cancel();

  }

}


function speakText(text) {

  if (
    !voiceOutputEnabled ||
    !("speechSynthesis" in window)
  ) {

    return;

  }


  stopSpeaking();


  const chunks = [];

  let current = "";


  const sentences =
    text.split(
      /(?<=[.!?])\s+/
    );


  sentences.forEach(
    sentence => {

      if (
        current.length +
        sentence.length >
        220
      ) {

        if (
          current.trim()
        ) {

          chunks.push(
            current.trim()
          );

        }


        current =
          sentence;

      } else {

        current +=
          " " +
          sentence;

      }

    }
  );


  if (
    current.trim()
  ) {

    chunks.push(
      current.trim()
    );

  }


  let index =
    0;


  function next() {

    if (
      index >=
      chunks.length
    ) {

      return;

    }


    const utterance =
      new SpeechSynthesisUtterance(
        chunks[index]
      );


    utterance.lang =
      "tr-TR";


    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    utterance.onend =
      () => {

        index++;

        next();

      };


    speechSynthesis.speak(
      utterance
    );

  }


  next();

}


function toggleVoice() {

  voiceOutputEnabled =
    !voiceOutputEnabled;


  if (
    !voiceOutputEnabled
  ) {

    stopSpeaking();

  }


  localStorage.setItem(

    VOICE_OUTPUT_KEY,

    String(
      voiceOutputEnabled
    )

  );


  updateVoiceButton();

}


document
  .getElementById(
    "voiceToggle"
  )
  .onclick =
    toggleVoice;


document
  .getElementById(
    "mobileVoiceToggle"
  )
  .onclick =
    toggleVoice;


updateVoiceButton();
