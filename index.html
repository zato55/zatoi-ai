<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Zatoi AI</title>

<style>

/* =====================================================
   GENEL
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #0f0f0f;

  color: white;

  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

  height: 70px;

  display: flex;

  align-items: center;

  padding: 0 25px;

  background: #151515;

  border-bottom: 1px solid #292929;
}

header h1 {

  margin: 0;

  font-size: 23px;
}

header p {

  margin: 4px 0 0 12px;

  color: #888;

  font-size: 13px;
}


/* =====================================================
   ANA ALAN
===================================================== */

#app {

  height: calc(100vh - 70px);

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    360px;
}


/* =====================================================
   SOL CHAT ALANI
===================================================== */

#chatArea {

  position: relative;

  min-width: 0;

  height: 100%;

  background: #0f0f0f;

  overflow: hidden;
}


/* =====================================================
   PC MESAJ KUTUSU
===================================================== */

#desktopInput {

  position: absolute;

  top: 20px;

  right: 25px;

  width: min(500px, 65%);

  display: flex;

  gap: 8px;

  z-index: 20;
}

#desktopInput input {

  flex: 1;

  min-width: 0;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #3a3a3a;

  background: #1b1b1b;

  color: white;

  outline: none;

  font-size: 15px;
}

#desktopInput input:focus {

  border-color: #2563eb;
}

#desktopInput input::placeholder {

  color: #777;
}

#desktopSend {

  border: none;

  border-radius: 12px;

  padding: 12px 20px;

  background: #2563eb;

  color: white;

  cursor: pointer;

  font-size: 14px;

  font-weight: bold;

  flex-shrink: 0;
}

#desktopSend:hover {

  background: #1d4ed8;
}


/* =====================================================
   SOHBET BAŞLIĞI
===================================================== */

#currentChatTitle {

  position: absolute;

  top: 78px;

  left: 25px;

  color: #777;

  font-size: 13px;

  z-index: 5;
}


/* =====================================================
   CHAT
===================================================== */

#chat {

  height: 100%;

  overflow-y: auto;

  padding:
    110px
    25px
    30px;
}

.message {

  margin-bottom: 16px;

  padding:
    13px
    16px;

  border-radius: 15px;

  max-width: 78%;

  white-space: pre-wrap;

  line-height: 1.5;

  word-wrap: break-word;
}

.user {

  background: #2563eb;

  margin-left: auto;
}

.assistant {

  background: #1e1e1e;

  border: 1px solid #303030;

  margin-right: auto;
}

.label {

  font-size: 11px;

  color: #aaa;

  margin-bottom: 5px;
}


/* =====================================================
   SAĞ PANEL
===================================================== */

#sidePanel {

  border-left:
    1px solid #292929;

  background: #141414;

  padding: 20px;

  overflow-y: auto;
}


/* =====================================================
   SAĞ PANEL BAŞLIK
===================================================== */

#sideTitle {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;
}


/* =====================================================
   YENİ SOHBET BUTONU
===================================================== */

#newChatButton {

  width: 100%;

  min-height: 46px;

  margin-bottom: 18px;

  border: none;

  border-radius: 11px;

  background: #2563eb;

  color: white;

  cursor: pointer;

  font-size: 14px;

  font-weight: bold;
}

#newChatButton:hover {

  background: #1d4ed8;
}


/* =====================================================
   SOHBET GEÇMİŞİ
===================================================== */

#historyTitle {

  color: #aaa;

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 8px;

  text-transform: uppercase;
}

#chatHistory {

  display: flex;

  flex-direction: column;

  gap: 7px;

  margin-bottom: 22px;
}


/* =====================================================
   SOHBET ÖĞESİ
===================================================== */

.historyItem {

  display: flex;

  align-items: center;

  gap: 6px;

  width: 100%;

  min-height: 44px;

  padding: 5px;

  border-radius: 10px;

  background: #1d1d1d;

  border: 1px solid #2d2d2d;
}

.historyItem.active {

  border-color: #2563eb;

  background: #202b43;
}


/* =====================================================
   SOHBET AÇMA BUTONU
===================================================== */

.historyOpen {

  flex: 1;

  min-width: 0;

  border: none;

  background: transparent;

  color: white;

  text-align: left;

  cursor: pointer;

  padding: 8px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  font-size: 13px;
}


/* =====================================================
   SOHBET SİLME
===================================================== */

.historyDelete {

  width: 32px;

  height: 32px;

  border: none;

  border-radius: 8px;

  background: #292929;

  color: #aaa;

  cursor: pointer;
}

.historyDelete:hover {

  background: #3a3a3a;

  color: white;
}


/* =====================================================
   HAFIZA
===================================================== */

#memorySection {

  border-top:
    1px solid #292929;

  padding-top: 18px;
}

#memorySectionTitle {

  font-size: 15px;

  font-weight: bold;

  margin-bottom: 12px;
}

#memoryDescription {

  color: #888;

  font-size: 12px;

  line-height: 1.5;

  margin-bottom: 12px;
}

#memoryBox {

  background: #101010;

  border:
    1px solid #303030;

  border-radius: 13px;

  padding: 15px;
}

#memoryContent {

  white-space: pre-wrap;

  word-break: break-word;

  color: #aaa;

  font-size: 12px;

  line-height: 1.55;

  max-height: 220px;

  overflow-y: auto;
}


/* =====================================================
   HAFIZA BUTONLARI
===================================================== */

.memoryButton {

  width: 100%;

  min-height: 43px;

  margin-top: 8px;

  border:
    1px solid #3b3b3b;

  border-radius: 10px;

  background: #292929;

  color: white;

  cursor: pointer;

  font-size: 13px;

  font-weight: bold;
}

.memoryButton:hover {

  background: #333;
}


/* =====================================================
   MOBİL PANEL
===================================================== */

#mobileBottom {

  display: none;
}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 600px) {

  html,
  body {

    width: 100%;

    height: 100%;

    overflow: hidden;
  }


  /* HEADER */

  header {

    height: 62px;

    padding: 0 15px;

    justify-content: center;

    flex-direction: column;
  }

  header h1 {

    font-size: 21px;
  }

  header p {

    margin: 3px 0 0;

    font-size: 12px;
  }


  /* APP */

  #app {

    height:
      calc(100vh - 62px);

    display: block;
  }


  /* CHAT AREA */

  #chatArea {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;
  }


  /* SIDE PANEL */

  #sidePanel {

    display: none;
  }


  /* DESKTOP INPUT */

  #desktopInput {

    display: none;
  }


  /* CURRENT TITLE */

  #currentChatTitle {

    top: 8px;

    left: 12px;

    font-size: 12px;
  }


  /* CHAT */

  #chat {

    height: 100%;

    overflow-y: auto;

    padding:
      35px
      12px
      150px
      12px;

    -webkit-overflow-scrolling:
      touch;
  }

  .message {

    max-width: 92%;

    padding:
      12px
      14px;

    font-size: 14px;
  }


  /* ===================================================
     MOBİL ALT PANEL
  =================================================== */

  #mobileBottom {

    display: block;

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    width: 100%;

    padding:
      8px
      10px;

    padding-bottom:
      calc(
        8px +
        env(safe-area-inset-bottom)
      );

    background:
      rgba(17,17,17,0.98);

    border-top:
      1px solid #292929;

    z-index: 9999;
  }


  /* ===================================================
     MOBİL ÜST BUTONLAR
  =================================================== */

  #mobileTopButtons {

    display: flex;

    gap: 6px;

    margin-bottom: 7px;
  }

  #mobileTopButtons button {

    flex: 1;

    min-height: 41px;

    border:
      1px solid #444;

    border-radius: 10px;

    background: #292929;

    color: white;

    font-size: 12px;

    font-weight: bold;
  }

  #mobileNewChat {

    background: #2563eb !important;

    border-color: #2563eb !important;
  }


  /* ===================================================
     MOBİL INPUT
  =================================================== */

  #mobileInput {

    display: flex;

    width: 100%;

    gap: 6px;
  }

  #mobileMessageInput {

    flex: 1;

    min-width: 0;

    height: 45px;

    padding:
      0 13px;

    border-radius: 12px;

    border:
      1px solid #3a3a3a;

    background: #1b1b1b;

    color: white;

    outline: none;

    font-size: 14px;
  }

  #mobileMessageInput:focus {

    border-color: #2563eb;
  }

  #mobileMessageInput::placeholder {

    color: #777;
  }


  /* ===================================================
     MOBİL GÖNDER
  =================================================== */

  #mobileSend {

    height: 45px;

    border: none;

    border-radius: 12px;

    padding:
      0 14px;

    background: #2563eb;

    color: white;

    cursor: pointer;

    font-size: 13px;

    font-weight: bold;
  }


  /* ===================================================
     MOBİL GEÇMİŞ PENCERESİ
  =================================================== */

  #mobileHistoryOverlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
      rgba(0,0,0,0.72);

    z-index: 10000;
  }

  #mobileHistoryOverlay.open {

    display: block;
  }


  #mobileHistoryPanel {

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: min(320px, 88%);

    background: #141414;

    border-right:
      1px solid #292929;

    padding: 18px;

    overflow-y: auto;
  }


  #mobileHistoryHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
  }


  #mobileHistoryHeader span {

    font-size: 18px;

    font-weight: bold;
  }


  #closeHistory {

    width: 36px;

    height: 36px;

    border: none;

    border-radius: 9px;

    background: #292929;

    color: white;

    font-size: 18px;
  }


  #mobileNewChatBig {

    width: 100%;

    min-height: 45px;

    margin-bottom: 15px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-weight: bold;
  }


  #mobileHistoryList {

    display: flex;

    flex-direction: column;

    gap: 7px;
  }


  .mobileHistoryItem {

    display: flex;

    gap: 5px;

    align-items: center;

    padding: 5px;

    background: #1d1d1d;

    border:
      1px solid #2d2d2d;

    border-radius: 10px;
  }


  .mobileHistoryItem.active {

    background: #202b43;

    border-color: #2563eb;
  }


  .mobileHistoryOpen {

    flex: 1;

    min-width: 0;

    border: none;

    background: transparent;

    color: white;

    text-align: left;

    padding: 9px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  .mobileHistoryDelete {

    width: 32px;

    height: 32px;

    border: none;

    border-radius: 8px;

    background: #292929;

    color: #aaa;
  }

}


/* =====================================================
   ÇOK KÜÇÜK TELEFON
===================================================== */

@media (max-width: 380px) {

  #mobileBottom {

    padding:
      6px
      8px;

    padding-bottom:
      calc(
        6px +
        env(safe-area-inset-bottom)
      );
  }

  #mobileTopButtons {

    gap: 5px;

    margin-bottom: 6px;
  }

  #mobileTopButtons button {

    min-height: 38px;

    font-size: 11px;
  }

  #mobileMessageInput {

    height: 43px;

    font-size: 13px;
  }

  #mobileSend {

    height: 43px;

    padding:
      0 11px;

    font-size: 12px;
  }

  #chat {

    padding-bottom: 140px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <h1>
    🤖 Zatoi AI
  </h1>

  <p>
    Senin kişisel yapay zekân
  </p>

</header>


<!-- =====================================================
     ANA UYGULAMA
===================================================== -->

<div id="app">


  <!-- ===================================================
       CHAT
  =================================================== -->

  <section id="chatArea">


    <!-- PC INPUT -->

    <div id="desktopInput">

      <input
        id="desktopMessageInput"
        type="text"
        placeholder="Zatoi'ye bir şey sor..."
        autocomplete="off"
      >

      <button
        id="desktopSend"
        onclick="sendFromDesktop()"
      >
        Gönder
      </button>

    </div>


    <!-- AKTİF SOHBET ADI -->

    <div id="currentChatTitle">
      Yeni sohbet
    </div>


    <!-- MESAJLAR -->

    <div id="chat"></div>


    <!-- =================================================
         MOBİL ALT PANEL
    ================================================= -->

    <div id="mobileBottom">


      <div id="mobileTopButtons">

        <button
          id="mobileNewChat"
          onclick="createNewChat()"
        >
          ➕ Yeni Sohbet
        </button>

        <button
          onclick="openMobileHistory()"
        >
          📚 Geçmiş
        </button>

      </div>


      <div id="mobileInput">

        <input
          id="mobileMessageInput"
          type="text"
          placeholder="Zatoi'ye bir şey sor..."
          autocomplete="off"
        >

        <button
          id="mobileSend"
          onclick="sendFromMobile()"
        >
          Gönder
        </button>

      </div>


    </div>


  </section>


  <!-- ===================================================
       SAĞ PANEL
  =================================================== -->

  <aside id="sidePanel">


    <div id="sideTitle">
      💬 Zatoi Sohbetleri
    </div>


    <!-- YENİ SOHBET -->

    <button
      id="newChatButton"
      onclick="createNewChat()"
    >
      ➕ Yeni Sohbet
    </button>


    <!-- GEÇMİŞ -->

    <div id="historyTitle">
      Sohbet Geçmişi
    </div>


    <div id="chatHistory"></div>


    <!-- HAFIZA -->

    <div id="memorySection">


      <div id="memorySectionTitle">
        🧠 Zatoi Hafızası
      </div>


      <div id="memoryDescription">

        Bu sohbetin hafızası burada tutulur.

      </div>


      <div id="memoryBox">

        <div id="memoryContent"></div>

      </div>


      <button
        class="memoryButton"
        onclick="renderMemory()"
      >
        🔄 Hafızayı Yenile
      </button>


      <button
        class="memoryButton"
        onclick="clearCurrentMemory()"
      >
        🧠 Bu Sohbetin Hafızasını Temizle
      </button>


    </div>


  </aside>


</div>


<!-- =====================================================
     MOBİL GEÇMİŞ PENCERESİ
===================================================== -->

<div
  id="mobileHistoryOverlay"
  onclick="closeHistoryFromBackground(event)"
>


  <div
    id="mobileHistoryPanel"
    onclick="event.stopPropagation()"
  >


    <div id="mobileHistoryHeader">

      <span>
        💬 Sohbetler
      </span>

      <button
        id="closeHistory"
        onclick="closeMobileHistory()"
      >
        ✕
      </button>

    </div>


    <button
      id="mobileNewChatBig"
      onclick="createNewChatFromMobile()"
    >
      ➕ Yeni Sohbet
    </button>


    <div id="mobileHistoryList"></div>


  </div>


</div>


<script>

/* =====================================================
   WORKER
===================================================== */

const WORKER_URL =
  "https://zatoi-ai.fbboytr.workers.dev/";


/* =====================================================
   ANA LOCAL STORAGE
===================================================== */

const CHATS_KEY =
  "zatoi_chats_v5";


const ACTIVE_CHAT_KEY =
  "zatoi_active_chat_v5";


/* =====================================================
   SOHBETLER
===================================================== */

let chats = [];

let activeChatId = null;


/* =====================================================
   ID OLUŞTUR
===================================================== */

function createId() {

  return Date.now().toString() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 9);

}


/* =====================================================
   BOŞ HAFIZA
===================================================== */

function createEmptyMemory() {

  return {

    name: "",

    facts: [],

    preferences: []

  };

}


/* =====================================================
   YENİ SOHBET
===================================================== */

function createChat(title = "Yeni sohbet") {

  return {

    id: createId(),

    title: title,

    messages: [],

    memory: createEmptyMemory(),

    createdAt: Date.now(),

    updatedAt: Date.now()

  };

}


/* =====================================================
   VERİLERİ YÜKLE
===================================================== */

function loadChats() {

  try {

    const savedChats =
      localStorage.getItem(
        CHATS_KEY
      );


    const savedActiveChat =
      localStorage.getItem(
        ACTIVE_CHAT_KEY
      );


    if (savedChats) {

      const parsed =
        JSON.parse(
          savedChats
        );


      if (Array.isArray(parsed)) {

        chats = parsed;

      }

    }


    if (!chats.length) {

      const firstChat =
        createChat();


      chats = [
        firstChat
      ];


      activeChatId =
        firstChat.id;


      saveChats();

    } else {

      activeChatId =
        savedActiveChat ||
        chats[0].id;


      const exists =
        chats.some(
          chat =>
            chat.id === activeChatId
        );


      if (!exists) {

        activeChatId =
          chats[0].id;

      }

    }

  } catch (error) {

    console.log(
      "Sohbet yükleme hatası:",
      error
    );


    const firstChat =
      createChat();


    chats = [
      firstChat
    ];


    activeChatId =
      firstChat.id;

  }

}


/* =====================================================
   VERİLERİ KAYDET
===================================================== */

function saveChats() {

  localStorage.setItem(

    CHATS_KEY,

    JSON.stringify(
      chats
    )

  );


  localStorage.setItem(

    ACTIVE_CHAT_KEY,

    activeChatId

  );

}


/* =====================================================
   AKTİF SOHBET
===================================================== */

function getActiveChat() {

  return chats.find(

    chat =>
      chat.id === activeChatId

  );

}


/* =====================================================
   SOHBET BAŞLIĞI OLUŞTUR
===================================================== */

function generateChatTitle(text) {

  let title =
    text.trim();


  if (!title) {

    return "Yeni sohbet";

  }


  if (title.length > 32) {

    title =
      title.substring(
        0,
        32
      ) + "...";

  }


  return title;

}


/* =====================================================
   SOHBET GEÇMİŞİNİ GÖSTER
===================================================== */

function renderHistory() {

  const history =
    document.getElementById(
      "chatHistory"
    );


  history.innerHTML = "";


  const sortedChats =
    [...chats].sort(
      (a, b) =>
        b.updatedAt -
        a.updatedAt
    );


  sortedChats.forEach(chat => {


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "historyItem";


    if (
      chat.id === activeChatId
    ) {

      item.classList.add(
        "active"
      );

    }


    const openButton =
      document.createElement(
        "button"
      );


    openButton.className =
      "historyOpen";


    openButton.textContent =
      chat.title ||
      "Yeni sohbet";


    openButton.title =
      chat.title ||
      "Yeni sohbet";


    openButton.onclick =
      () => openChat(chat.id);


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "historyDelete";


    deleteButton.textContent =
      "🗑️";


    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteChat(chat.id);

      };


    item.appendChild(
      openButton
    );


    item.appendChild(
      deleteButton
    );


    history.appendChild(
      item
    );

  });


  renderMobileHistory();

}


/* =====================================================
   MOBİL GEÇMİŞİ GÖSTER
===================================================== */

function renderMobileHistory() {

  const list =
    document.getElementById(
      "mobileHistoryList"
    );


  if (!list) return;


  list.innerHTML = "";


  const sortedChats =
    [...chats].sort(
      (a, b) =>
        b.updatedAt -
        a.updatedAt
    );


  sortedChats.forEach(chat => {


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "mobileHistoryItem";


    if (
      chat.id === activeChatId
    ) {

      item.classList.add(
        "active"
      );

    }


    const openButton =
      document.createElement(
        "button"
      );


    openButton.className =
      "mobileHistoryOpen";


    openButton.textContent =
      chat.title ||
      "Yeni sohbet";


    openButton.onclick =
      () => {

        openChat(chat.id);

        closeMobileHistory();

      };


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "mobileHistoryDelete";


    deleteButton.textContent =
      "🗑️";


    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteChat(chat.id);

      };


    item.appendChild(
      openButton
    );


    item.appendChild(
      deleteButton
    );


    list.appendChild(
      item
    );

  });

}


/* =====================================================
   SOHBETİ AÇ
===================================================== */

function openChat(id) {

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if (!chat) return;


  activeChatId =
    id;


  saveChats();


  renderConversation();


  renderHistory();


  renderMemory();

}


/* =====================================================
   YENİ SOHBET
===================================================== */

function createNewChat() {

  const newChat =
    createChat();


  chats.push(
    newChat
  );


  activeChatId =
    newChat.id;


  saveChats();


  renderConversation();


  renderHistory();


  renderMemory();


  focusCorrectInput();

}


/* =====================================================
   MOBİL YENİ SOHBET
===================================================== */

function createNewChatFromMobile() {

  createNewChat();

  closeMobileHistory();

}


/* =====================================================
   SOHBET SİL
===================================================== */

function deleteChat(id) {

  if (chats.length === 1) {

    alert(
      "En az bir sohbet kalmalı."
    );

    return;

  }


  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if (!chat) return;


  const answer =
    confirm(

      `"${chat.title}" sohbeti silinsin mi?`

    );


  if (!answer) return;


  chats =
    chats.filter(
      item =>
        item.id !== id
    );


  if (
    activeChatId === id
  ) {

    chats.sort(
      (a, b) =>
        b.updatedAt -
        a.updatedAt
    );


    activeChatId =
      chats[0].id;

  }


  saveChats();


  renderConversation();


  renderHistory();


  renderMemory();

}


/* =====================================================
   SOHBET MESAJLARINI GÖSTER
===================================================== */

function renderConversation() {

  const chatElement =
    document.getElementById(
      "chat"
    );


  const activeChat =
    getActiveChat();


  chatElement.innerHTML = "";


  if (!activeChat) return;


  activeChat.messages.forEach(
    message => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message " +
        message.role;


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "label";


      label.textContent =
        message.role === "user"
          ? "Sen"
          : "Zatoi";


      const content =
        document.createElement(
          "div"
        );


      content.textContent =
        message.content;


      div.appendChild(
        label
      );


      div.appendChild(
        content
      );


      chatElement.appendChild(
        div
      );

    }
  );


  const title =
    document.getElementById(
      "currentChatTitle"
    );


  title.textContent =
    activeChat.title ||
    "Yeni sohbet";


  setTimeout(
    () => {

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    0
  );

}


/* =====================================================
   HAFIZA GÖSTER
===================================================== */

function renderMemory() {

  const content =
    document.getElementById(
      "memoryContent"
    );


  const activeChat =
    getActiveChat();


  if (!activeChat) {

    content.textContent =
      "{}";

    return;

  }


  content.textContent =
    JSON.stringify(
      activeChat.memory,
      null,
      2
    );

}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

async function sendMessage(text) {

  text =
    text.trim();


  if (!text) return;


  const activeChat =
    getActiveChat();


  if (!activeChat) return;


  /* Kullanıcı mesajı */

  activeChat.messages.push({

    role: "user",

    content: text

  });


  /* İlk mesajdan sohbet adı */

  if (
    activeChat.messages.length === 1
  ) {

    activeChat.title =
      generateChatTitle(
        text
      );

  }


  activeChat.updatedAt =
    Date.now();


  saveChats();


  renderConversation();


  renderHistory();


  /* Son 20 mesaj */

  const recentMessages =
    activeChat.messages.slice(-20);


  try {


    const response =
      await fetch(

        WORKER_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:

            JSON.stringify({

              memory:
                activeChat.memory,

              messages:
                recentMessages

            })

        }

      );


    const data =
      await response.json();


    if (data.error) {

      throw new Error(
        data.error
      );

    }


    /* ================================
       HAFIZA
    ================================= */

    if (data.memory) {

      activeChat.memory = {

        name:
          data.memory.name ||
          activeChat.memory.name ||
          "",

        facts:
          Array.isArray(
            data.memory.facts
          )

            ? data.memory.facts

            : activeChat.memory.facts,

        preferences:
          Array.isArray(
            data.memory.preferences
          )

            ? data.memory.preferences

            : activeChat.memory.preferences

      };

    }


    /* ================================
       CEVAP
    ================================= */

    const reply =

      data.reply ||

      data.choices?.[0]
        ?.message
        ?.content ||

      "Zatoi cevap veremedi.";


    activeChat.messages.push({

      role: "assistant",

      content:
        reply

    });


    activeChat.updatedAt =
      Date.now();


    saveChats();


    renderConversation();


    renderHistory();


    renderMemory();


  } catch (error) {

    console.log(
      "Hata:",
      error
    );


    activeChat.messages.push({

      role: "assistant",

      content:
        "Şu anda bağlantıda bir sorun oluştu. ⚠️"

    });


    activeChat.updatedAt =
      Date.now();


    saveChats();


    renderConversation();

  }

}


/* =====================================================
   PC GÖNDER
===================================================== */

function sendFromDesktop() {

  const input =
    document.getElementById(
      "desktopMessageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  input.value = "";


  sendMessage(text);

}


/* =====================================================
   MOBİL GÖNDER
===================================================== */

function sendFromMobile() {

  const input =
    document.getElementById(
      "mobileMessageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  input.value = "";


  sendMessage(text);

}


/* =====================================================
   BU SOHBETİN HAFIZASINI TEMİZLE
===================================================== */

function clearCurrentMemory() {

  const activeChat =
    getActiveChat();


  if (!activeChat) return;


  const answer =
    confirm(

      "Bu sohbetin hafızası tamamen silinsin mi?"

    );


  if (!answer) return;


  activeChat.memory =
    createEmptyMemory();


  saveChats();


  renderMemory();


  alert(
    "🧠 Bu sohbetin hafızası temizlendi."
  );

}


/* =====================================================
   MOBİL GEÇMİŞ AÇ
===================================================== */

function openMobileHistory() {

  const overlay =
    document.getElementById(
      "mobileHistoryOverlay"
    );


  overlay.classList.add(
    "open"
  );


  renderMobileHistory();

}


/* =====================================================
   MOBİL GEÇMİŞ KAPAT
===================================================== */

function closeMobileHistory() {

  const overlay =
    document.getElementById(
      "mobileHistoryOverlay"
    );


  overlay.classList.remove(
    "open"
  );

}


/* =====================================================
   ARKA PLANA TIKLAYINCA KAPAT
===================================================== */

function closeHistoryFromBackground(event) {

  if (
    event.target.id ===
    "mobileHistoryOverlay"
  ) {

    closeMobileHistory();

  }

}


/* =====================================================
   DOĞRU INPUT'A ODAKLAN
===================================================== */

function focusCorrectInput() {

  if (
    window.innerWidth <= 600
  ) {

    const input =
      document.getElementById(
        "mobileMessageInput"
      );


    if (input) {

      setTimeout(
        () => input.focus(),
        100
      );

    }

  } else {

    const input =
      document.getElementById(
        "desktopMessageInput"
      );


    if (input) {

      setTimeout(
        () => input.focus(),
        100
      );

    }

  }

}


/* =====================================================
   PC ENTER
===================================================== */

document
  .getElementById(
    "desktopMessageInput"
  )
  .addEventListener(

    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendFromDesktop();

      }

    }

  );


/* =====================================================
   MOBİL ENTER
===================================================== */

document
  .getElementById(
    "mobileMessageInput"
  )
  .addEventListener(

    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendFromMobile();

      }

    }

  );


/* =====================================================
   BAŞLANGIÇ
===================================================== */

loadChats();

renderConversation();

renderHistory();

renderMemory();

</script>
