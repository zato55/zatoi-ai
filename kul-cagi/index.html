<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KÜL ÇAĞI — v0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a0a;color:#e9e0cb;font-family:system-ui,Segoe UI,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#111714;cursor:crosshair}
.panel{position:fixed;background:rgba(9,12,11,.90);border:1px solid #504838;box-shadow:0 10px 30px #0009}
#hud{left:14px;top:14px;width:min(370px,calc(100vw - 28px));padding:13px}
.title{font-weight:900;letter-spacing:.16em;color:#e2c777}.row{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.bar{height:9px;background:#292c28;border:1px solid #3c3e38;margin:5px 0 8px;overflow:hidden}.fill{height:100%;transition:width .1s}
#hp{background:#a44339}#xp{background:#b59a52}
#skills{display:flex;gap:7px;margin-top:10px}.skill{flex:1;border:1px solid #494337;background:#151916;padding:7px;text-align:center;font-size:11px;position:relative;overflow:hidden}.skill b{display:block;font-size:13px}.shade{position:absolute;left:0;right:0;bottom:0;background:#0009;height:0;pointer-events:none}
#tips{left:14px;bottom:14px;padding:9px 11px;font-size:11px;line-height:1.5}
#toast{position:fixed;top:17%;left:50%;transform:translateX(-50%);font-weight:900;letter-spacing:.13em;text-shadow:0 2px 10px #000;pointer-events:none}
#inv{right:14px;top:14px;width:330px;max-height:calc(100vh - 28px);overflow:auto;padding:13px;display:none;pointer-events:auto}
#inv.on{display:block}.item{border:1px solid #49443a;background:#151816;padding:9px;margin-top:7px;cursor:pointer}.item:hover{border-color:#d1b66b}
.c{color:#ddd}.w{color:#8fc58d}.r{color:#7caee8}.a{color:#c28be0}.y{color:#e8b65a}
#cross{position:fixed;width:14px;height:14px;border:1px solid #dfd0aa;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:.7}
@media(max-width:700px){#hud{width:285px}#tips{max-width:65vw;font-size:9px}#inv{left:10px;right:10px;width:auto;top:10px;max-height:75vh}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud" class="panel">
 <div class="title">KÜL ÇAĞI · v0.2</div>
 <div class="row"><span id="lv"></span><span id="gold"></span></div>
 <div class="bar"><div id="hp" class="fill"></div></div>
 <div class="row"><span id="ht"></span><span id="wep"></span></div>
 <div class="bar"><div id="xp" class="fill"></div></div>
 <div class="row"><span id="xt"></span><span id="kill"></span></div>
 <div id="skills">
   <div class="skill"><b>LMB</b><span id="basicTxt">Saldırı</span><i id="atkShade" class="shade"></i></div>
   <div class="skill"><b>SPACE</b>Sıyrıl<i id="dashShade" class="shade"></i></div>
   <div class="skill"><b>Q</b><span id="powerTxt">Özel</span><i id="powShade" class="shade"></i></div>
 </div>
</div>
<div id="tips" class="panel">WASD/Oklar: hareket · Sol tık: saldırı · SPACE: sıyrıl · Q: silah yeteneği · E: loot · I: envanter · 1/2/3: silah değiştir</div>
<div id="inv" class="panel"></div><div id="toast"></div><div id="cross"></div>
<script>
(()=>{"use strict";
const C=document.querySelector("#g"),X=C.getContext("2d"),$=s=>document.querySelector(s);
let W,H,D=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+"px";C.style.height=H+"px";X.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();

const K={},M={x:W/2,y:H/2,down:false};
addEventListener("keydown",e=>{
 K[e.code]=true;
 if(e.code==="KeyI"){ $("#inv").classList.toggle("on"); renderInv(); }
 if(e.code==="KeyE")pickup();
 if(/^Digit[123]$/.test(e.code)){P.weapon=+e.code.slice(-1)-1; say(WEAP[P.weapon].name);}
});
addEventListener("keyup",e=>K[e.code]=false);
C.addEventListener("mousemove",e=>{M.x=e.clientX;M.y=e.clientY;$("#cross").style.left=M.x+"px";$("#cross").style.top=M.y+"px"});
C.addEventListener("mousedown",e=>{if(e.button===0)M.down=true});
addEventListener("mouseup",()=>M.down=false);C.oncontextmenu=e=>e.preventDefault();

const WORLD={w:2600,h:1800};
const WEAP=[
 {name:"Yarma Kılıcı",dmg:31,range:92,cd:.55,col:"#d9c17e",power:"Yer Yaran",pCd:5.0},
 {name:"İkiz Keskiler",dmg:14,range:68,cd:.21,col:"#78c1ad",power:"Gölge Atılımı",pCd:4.2},
 {name:"Damar Odağı",dmg:24,range:300,cd:.58,col:"#ad8cdd",power:"Damar Patlaması",pCd:5.5}
];
const RAR=[["Sıradan","c",1,.55],["İşlenmiş","w",1.18,.25],["Nadir","r",1.45,.13],["Kadim","a",1.8,.055],["Yadigâr","y",2.4,.015]];
const TYPES=[
 ["Kül Kemireni",38,96,8,18,"#887565",14],
 ["Çatlak",74,61,12,30,"#785b58",19],
 ["Solgun Avcı",50,77,10,25,"#69777d",16],
 ["Köklenmiş",128,39,17,44,"#5d694f",24],
 ["Damar Böceği",33,114,7,16,"#786ba1",13],
 ["Kül Tazısı",56,137,11,28,"#826d58",16]
];
const P={x:WORLD.w/2,y:WORLD.h/2,hp:125,max:125,lv:1,xp:0,next:90,gold:0,kills:0,weapon:0,atk:0,dash:0,dashCd:0,power:0,speed:225,bag:[],eq:null,ifr:0,face:0};
let enemies=[],drops=[],fx=[],texts=[],cam={x:0,y:0},toast=0,shake=0;

function say(s){$("#toast").textContent=s;toast=2}
function spawn(){
 let t=TYPES[Math.random()*TYPES.length|0],a=Math.random()*Math.PI*2,d=520+Math.random()*470,elite=Math.random()<.085,h=t[1]*(elite?2.25:1);
 enemies.push({name:t[0],x:clamp(P.x+Math.cos(a)*d,35,WORLD.w-35),y:clamp(P.y+Math.sin(a)*d,35,WORLD.h-35),hp:h,max:h,spd:t[2],dmg:t[3],xp:t[4],col:t[5],r:t[6]*(elite?1.15:1),elite,atk:0,hit:0,kx:0,ky:0});
}
for(let i=0;i<28;i++)spawn();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rarity(){let z=Math.random(),s=0;for(const q of RAR){s+=q[3];if(z<s)return q}return RAR[0]}
function itemDrop(e){
 if(Math.random()<.63){let q=rarity(),w=WEAP[Math.random()*3|0];drops.push({x:e.x,y:e.y,t:0,it:{name:q[0]+" "+w.name,q,w,bonus:Math.round((4+P.lv*2)*q[2]),lv:P.lv}})}
 P.gold+=Math.floor(2+Math.random()*(e.elite?21:8));
}
function gain(v){P.xp+=v;while(P.xp>=P.next){P.xp-=P.next;P.lv++;P.next=Math.round(P.next*1.32);P.max+=18;P.hp=P.max;say("SEVİYE "+P.lv+" · DAMAR GÜÇLENİYOR");burst(P.x,P.y,"#e6c76d",25)}}
function damageEnemy(e,d,a,knock=35){e.hp-=d;e.hit=.14;e.kx+=Math.cos(a)*knock;e.ky+=Math.sin(a)*knock;texts.push({x:e.x,y:e.y-20,t:.7,s:Math.round(d),col:"#f0ddad"});burst(e.x,e.y,WEAP[P.weapon].col,5);shake=Math.max(shake,3)}
function burst(px,py,col,n){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=25+Math.random()*120;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+Math.random()*.35,col})}}
function basic(){
 if(P.atk>0)return;let w=WEAP[P.weapon],a=P.face;P.atk=w.cd;
 if(P.weapon===2){
   fx.push({beam:true,x:P.x,y:P.y,a,t:.13,len:w.range,col:w.col});
   let best=null,bd=w.range;
   for(const e of enemies){let dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy),da=Math.abs(Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a)));if(d<bd&&da<.16){best=e;bd=d}}
   if(best)damageEnemy(best,w.dmg+P.lv*2+(P.eq?.bonus||0),a,18);
 }else{
   fx.push({arc:true,x:P.x,y:P.y,a,t:.18,r:w.range,col:w.col});
   for(const e of enemies){let dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy),da=Math.abs(Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a)));if(d<w.range+e.r&&da<(P.weapon===0?.72:.55))damageEnemy(e,w.dmg+P.lv*2+(P.eq?.bonus||0),a,P.weapon===0?58:25)}
 }
}
function special(){
 if(P.power>0)return;let w=WEAP[P.weapon];P.power=w.pCd;
 if(P.weapon===0){
   say("YER YARAN");fx.push({ring:true,x:P.x,y:P.y,t:.45,r:150,col:w.col});
   for(const e of enemies){let d=Math.hypot(e.x-P.x,e.y-P.y);if(d<155)damageEnemy(e,w.dmg*1.75+P.lv*3,Math.atan2(e.y-P.y,e.x-P.x),100)}
 }else if(P.weapon===1){
   say("GÖLGE ATILIMI");P.ifr=.45;P.x=clamp(P.x+Math.cos(P.face)*175,20,WORLD.w-20);P.y=clamp(P.y+Math.sin(P.face)*175,20,WORLD.h-20);
   fx.push({ring:true,x:P.x,y:P.y,t:.35,r:90,col:w.col});
   for(const e of enemies){if(Math.hypot(e.x-P.x,e.y-P.y)<95)damageEnemy(e,w.dmg*2.2+P.lv*2,P.face,60)}
 }else{
   say("DAMAR PATLAMASI");let tx=M.x+cam.x,ty=M.y+cam.y;fx.push({ring:true,x:tx,y:ty,t:.5,r:125,col:w.col});
   for(const e of enemies){if(Math.hypot(e.x-tx,e.y-ty)<130)damageEnemy(e,w.dmg*2+P.lv*3,Math.atan2(e.y-ty,e.x-tx),70)}
 }
}
function pickup(){let bi=-1,bd=85;drops.forEach((o,i)=>{let d=Math.hypot(o.x-P.x,o.y-P.y);if(d<bd){bd=d;bi=i}});if(bi>=0){let o=drops.splice(bi,1)[0];P.bag.push(o.it);say(o.it.name+" alındı");renderInv()}}
function renderInv(){
 let h='<div class="title">ENVANTER</div><small>Eşyaya tıklayarak kuşan.</small><p><b>Kuşanılan:</b><br>'+(P.eq?'<span class="'+P.eq.q[1]+'">'+P.eq.name+'</span> · +'+P.eq.bonus+' hasar':'Başlangıç ekipmanı')+'</p>';
 P.bag.forEach((o,i)=>h+='<div class="item" data-i="'+i+'"><b class="'+o.q[1]+'">'+o.name+'</b><br><small>Seviye '+o.lv+' · +'+o.bonus+' hasar</small></div>');
 $("#inv").innerHTML=h;document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{P.eq=P.bag[+el.dataset.i];P.weapon=WEAP.indexOf(P.eq.w);say(P.eq.name+" kuşanıldı");renderInv()});
}renderInv();

function update(dt){
 P.face=Math.atan2(M.y+cam.y-P.y,M.x+cam.x-P.x);
 P.atk=Math.max(0,P.atk-dt);P.power=Math.max(0,P.power-dt);P.dashCd=Math.max(0,P.dashCd-dt);P.ifr=Math.max(0,P.ifr-dt);
 let dx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0),l=Math.hypot(dx,dy)||1;
 if(K.Space&&P.dashCd<=0){P.dash=.20;P.dashCd=1.15;P.ifr=.28;burst(P.x,P.y,"#b9b09a",8)}
 P.dash=Math.max(0,P.dash-dt);let sp=P.speed*(P.dash>0?2.65:1);
 P.x=clamp(P.x+dx/l*sp*dt,20,WORLD.w-20);P.y=clamp(P.y+dy/l*sp*dt,20,WORLD.h-20);
 if(M.down)basic();if(K.KeyQ){K.KeyQ=false;special()}
 for(let i=enemies.length-1;i>=0;i--){
   let e=enemies[i];e.atk=Math.max(0,e.atk-dt);e.hit=Math.max(0,e.hit-dt);
   if(e.hp<=0){itemDrop(e);gain(Math.round(e.xp*(e.elite?2.5:1)));P.kills++;enemies.splice(i,1);spawn();continue}
   e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.04,dt);e.ky*=Math.pow(.04,dt);
   let vx=P.x-e.x,vy=P.y-e.y,d=Math.hypot(vx,vy)||1;if(d<540){e.x+=vx/d*e.spd*dt;e.y+=vy/d*e.spd*dt}
   // separation
   for(const o of enemies){if(o===e)continue;let sx=e.x-o.x,sy=e.y-o.y,sd=Math.hypot(sx,sy)||1,min=e.r+o.r+5;if(sd<min){e.x+=sx/sd*(min-sd)*.035;e.y+=sy/sd*(min-sd)*.035}}
   if(d<e.r+19&&e.atk<=0&&P.ifr<=0){P.hp-=e.dmg*(e.elite?1.5:1);e.atk=.9;P.ifr=.25;shake=7;texts.push({x:P.x,y:P.y-25,t:.8,s:"-"+Math.round(e.dmg*(e.elite?1.5:1)),col:"#e06a5d"});if(P.hp<=0){P.hp=P.max;P.x=WORLD.w/2;P.y=WORLD.h/2;P.gold=Math.max(0,P.gold-10);say("KÜLE DÖNDÜN · 10 Kül kaybettin")}}
 }
 drops.forEach(o=>o.t+=dt);fx.forEach(f=>{f.t-=dt;if(!f.arc&&!f.ring&&!f.beam){f.x+=f.vx*dt;f.y+=f.vy*dt}});fx=fx.filter(f=>f.t>0);texts.forEach(t=>{t.y-=30*dt;t.t-=dt});texts=texts.filter(t=>t.t>0);
 cam.x+=(P.x-W/2-cam.x)*Math.min(1,dt*7);cam.y+=(P.y-H/2-cam.y)*Math.min(1,dt*7);cam.x=clamp(cam.x,0,Math.max(0,WORLD.w-W));cam.y=clamp(cam.y,0,Math.max(0,WORLD.h-H));
 if(toast>0){toast-=dt;if(toast<=0)$("#toast").textContent=""}shake*=Math.pow(.05,dt);
}
function humanoid(px,py,a){
 X.save();X.translate(px,py);X.rotate(a);
 X.fillStyle="#343832";X.beginPath();X.ellipse(-2,8,12,16,0,0,7);X.fill();
 X.fillStyle="#d0c3a6";X.beginPath();X.arc(5,-9,8,0,7);X.fill();
 X.fillStyle="#665d49";X.fillRect(-7,-1,21,14);
 X.strokeStyle="#242724";X.lineWidth=5;X.beginPath();X.moveTo(-4,18);X.lineTo(-9,29);X.moveTo(5,18);X.lineTo(9,29);X.stroke();
 X.fillStyle=WEAP[P.weapon].col;X.fillRect(9,-3,P.weapon===0?34:27,P.weapon===0?7:5);
 X.restore();
}
function draw(){
 let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;X.fillStyle="#101512";X.fillRect(0,0,W,H);X.save();X.translate(-cam.x+sx,-cam.y+sy);
 X.fillStyle="#191e1a";X.fillRect(0,0,WORLD.w,WORLD.h);X.strokeStyle="#272c26";X.lineWidth=1;
 for(let i=0;i<WORLD.w;i+=80){X.beginPath();X.moveTo(i,0);X.lineTo(i,WORLD.h);X.stroke()}for(let i=0;i<WORLD.h;i+=80){X.beginPath();X.moveTo(0,i);X.lineTo(WORLD.w,i);X.stroke()}
 for(let i=0;i<38;i++){let a=i*347%WORLD.w,b=i*613%WORLD.h;X.fillStyle="#292821";X.fillRect(a,b,55+(i%4)*15,17);X.fillStyle="#373329";X.fillRect(a+9,b-22,13,22)}
 drops.forEach(o=>{X.save();X.translate(o.x,o.y);X.rotate(o.t);X.strokeStyle=o.it.q[1]==="y"?"#e8b65a":"#c7b47f";X.strokeRect(-7,-7,14,14);X.restore()});
 enemies.forEach(e=>{X.save();X.translate(e.x,e.y);X.fillStyle=e.hit?"#f0e2c8":e.col;X.beginPath();X.arc(0,0,e.r,0,7);X.fill();X.fillStyle="#28231f";X.beginPath();X.arc(5,-3,Math.max(4,e.r*.32),0,7);X.fill();if(e.elite){X.strokeStyle="#d5a54b";X.lineWidth=3;X.beginPath();X.arc(0,0,e.r+5,0,7);X.stroke();X.fillStyle="#e7bd62";X.font="11px sans-serif";X.textAlign="center";X.fillText("ELİT",0,-e.r-11)}X.fillStyle="#241b1a";X.fillRect(-18,e.r+8,36,4);X.fillStyle="#a64c42";X.fillRect(-18,e.r+8,36*e.hp/e.max,4);X.restore()});
 fx.forEach(f=>{X.save();X.globalAlpha=Math.min(1,f.t*5);X.strokeStyle=f.col;
   if(f.arc){X.translate(f.x,f.y);X.rotate(f.a);X.lineWidth=7;X.beginPath();X.arc(0,0,f.r,-.75,.75);X.stroke()}
   else if(f.beam){X.translate(f.x,f.y);X.rotate(f.a);X.lineWidth=4;X.beginPath();X.moveTo(15,0);X.lineTo(f.len,0);X.stroke()}
   else if(f.ring){X.lineWidth=5;X.beginPath();X.arc(f.x,f.y,f.r*(1-f.t*.7),0,7);X.stroke()}
   else{X.fillStyle=f.col;X.fillRect(f.x-2,f.y-2,4,4)}
   X.restore()
 });
 humanoid(P.x,P.y,P.face);
 texts.forEach(t=>{X.globalAlpha=Math.min(1,t.t*2);X.fillStyle=t.col;X.font="bold 14px system-ui";X.textAlign="center";X.fillText(t.s,t.x,t.y)});X.globalAlpha=1;X.restore();

 $("#hp").style.width=P.hp/P.max*100+"%";$("#xp").style.width=P.xp/P.next*100+"%";$("#lv").textContent="Seviye "+P.lv;$("#gold").textContent=P.gold+" Kül";$("#ht").textContent=Math.ceil(P.hp)+" / "+P.max+" HP";$("#xt").textContent=P.xp+" / "+P.next+" EXP";$("#wep").textContent=WEAP[P.weapon].name;$("#kill").textContent=P.kills+" av";$("#basicTxt").textContent="Saldırı";$("#powerTxt").textContent=WEAP[P.weapon].power;
 $("#atkShade").style.height=(P.atk/WEAP[P.weapon].cd*100)+"%";$("#dashShade").style.height=(P.dashCd/1.15*100)+"%";$("#powShade").style.height=(P.power/WEAP[P.weapon].pCd*100)+"%";
}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
say("SOLMUŞ OVA · v0.2");requestAnimationFrame(loop);
})();
</script>
</body></html>
